name: repair-gate1-orchestration-v2

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/repair_gate1_orchestration_v2.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: repair-gate1-orchestration
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate1-contract
          fetch-depth: 0

      - name: Publish repair-run marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 3 --body \
            "Gate 1 orchestration repair: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Repair reusable workflow chain and Q8 preflight assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path(".github/workflows/gate1_step3b_wildguard_q8_canonical.yml"),
              Path(".github/workflows/gate1_step3b_wildguard_wrapper_stability.yml"),
              Path(".github/workflows/gate1_step3b_confirmatory.yml"),
              Path(".github/workflows/gate1_step3b_final_eligibility.yml"),
              Path(".github/workflows/gate1_exact_oracle.yml"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if "  workflow_call:\n" not in text:
                  marker = "on:\n  workflow_dispatch:\n"
                  if marker not in text:
                      raise SystemExit(f"trigger marker missing: {path}")
                  text = text.replace(
                      marker,
                      "on:\n  workflow_call:\n  workflow_dispatch:\n",
                      1,
                  )
              path.write_text(text, encoding="utf-8")

          q8_path = paths[0]
          q8 = q8_path.read_text(encoding="utf-8")
          stale = '          test "$WILDGUARD_ACCESS_OK" = "true"\n'
          fixed = '''          python - <<'PY'\n          import json\n          import os\n          from pathlib import Path\n\n          preflight = json.loads(\n              (Path(os.environ["SAFE_OUTPUT"]) / "wildguard_preflight.json").read_text()\n          )\n          if preflight.get("access_ok") is not True:\n              raise SystemExit("official WildGuard access preflight did not pass")\n          PY\n'''
          if stale in q8:
              q8 = q8.replace(stale, fixed, 1)
          elif "same-step GITHUB_ENV" not in q8 and "preflight.get(\"access_ok\")" not in q8:
              raise SystemExit("Q8 preflight assertion state is unknown")
          q8_path.write_text(q8, encoding="utf-8")
          PY

      - name: Preserve the first operational Q8 attempt
        run: |
          if [ -d data/gate1/v2/wildguard_q8 ]; then
            if [ ! -e data/gate1/v2/wildguard_q8_operational_32357880091 ]; then
              git mv data/gate1/v2/wildguard_q8 \
                data/gate1/v2/wildguard_q8_operational_32357880091
            else
              rm -rf data/gate1/v2/wildguard_q8
            fi
          fi
          if [ -f docs/GATE1_STEP3B5_WILDGUARD_Q8_RESULT.md ]; then
            if [ ! -e docs/GATE1_STEP3B5_WILDGUARD_Q8_OPERATIONAL_32357880091.md ]; then
              git mv docs/GATE1_STEP3B5_WILDGUARD_Q8_RESULT.md \
                docs/GATE1_STEP3B5_WILDGUARD_Q8_OPERATIONAL_32357880091.md
            else
              rm docs/GATE1_STEP3B5_WILDGUARD_Q8_RESULT.md
            fi
          fi

      - name: Materialize one canonical end-to-end orchestrator
        run: |
          cat >.github/workflows/gate1_full_orchestrator.yml <<'YAML'
          name: gate1-full-canonical-orchestrator

          on:
            workflow_dispatch:
            push:
              branches:
                - agent/gate1-contract
              paths:
                - .github/workflows/gate1_full_orchestrator.yml

          permissions:
            contents: write
            issues: write
            pull-requests: write

          concurrency:
            group: gate1-full-canonical-orchestrator
            cancel-in-progress: true

          jobs:
            q8_external_validation:
              uses: ./.github/workflows/gate1_step3b_wildguard_q8_canonical.yml
              secrets: inherit

            wrapper_stability:
              needs: q8_external_validation
              if: always() && needs.q8_external_validation.result == 'success'
              uses: ./.github/workflows/gate1_step3b_wildguard_wrapper_stability.yml
              secrets: inherit

            fresh_confirmatory:
              needs: wrapper_stability
              if: always() && needs.wrapper_stability.result == 'success'
              uses: ./.github/workflows/gate1_step3b_confirmatory.yml
              secrets: inherit

            final_eligibility:
              needs: fresh_confirmatory
              if: always() && needs.fresh_confirmatory.result == 'success'
              uses: ./.github/workflows/gate1_step3b_final_eligibility.yml
              secrets: inherit

            exact_oracle:
              needs: final_eligibility
              if: always() && needs.final_eligibility.result == 'success'
              uses: ./.github/workflows/gate1_exact_oracle.yml
              secrets: inherit

            publish_summary:
              needs:
                - q8_external_validation
                - wrapper_stability
                - fresh_confirmatory
                - final_eligibility
                - exact_oracle
              if: always()
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: agent/gate1-contract
                    fetch-depth: 0
                - name: Publish final status
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    git fetch origin agent/gate1-contract
                    git checkout -B agent/gate1-contract origin/agent/gate1-contract
                    decision=data/gate1/v2/oracle/gate1_decision.json
                    if [ -f "$decision" ]; then
                      status="$(jq -r '.gate1_decision // .status' "$decision")"
                    else
                      status=GATE1_OPERATIONAL_INCOMPLETE
                    fi
                    {
                      echo '# Gate 1 canonical orchestration'
                      echo
                      echo "- Q8 external validation: **${{ needs.q8_external_validation.result }}**"
                      echo "- wrapper stability: **${{ needs.wrapper_stability.result }}**"
                      echo "- fresh confirmatory: **${{ needs.fresh_confirmatory.result }}**"
                      echo "- final eligibility: **${{ needs.final_eligibility.result }}**"
                      echo "- exact oracle: **${{ needs.exact_oracle.result }}**"
                      echo "- Gate 1 status: **$status**"
                    } >>"$GITHUB_STEP_SUMMARY"
                    gh pr comment 3 --body \
                      "Gate 1 canonical orchestration: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — final status: **$status**"
          YAML
          sed -i 's/^          //' .github/workflows/gate1_full_orchestrator.yml

      - name: Validate and commit repair
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path(".github/workflows").glob("gate1_*.yml"):
              value = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit(f"invalid workflow: {path}")
          PY
          git diff --check
          git rm -f \
            .github/workflows/repair_gate1_orchestration.yml \
            .github/workflows/repair_gate1_orchestration_v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            .github/workflows/gate1_step3b_wildguard_q8_canonical.yml \
            .github/workflows/gate1_step3b_wildguard_wrapper_stability.yml \
            .github/workflows/gate1_step3b_confirmatory.yml \
            .github/workflows/gate1_step3b_final_eligibility.yml \
            .github/workflows/gate1_exact_oracle.yml \
            .github/workflows/gate1_full_orchestrator.yml \
            data/gate1/v2/wildguard_q8_operational_32357880091 \
            docs/GATE1_STEP3B5_WILDGUARD_Q8_OPERATIONAL_32357880091.md
          git diff --cached --check
          git commit -m "Connect the complete Gate 1 canonical run [skip ci]"
          git push origin HEAD:agent/gate1-contract
