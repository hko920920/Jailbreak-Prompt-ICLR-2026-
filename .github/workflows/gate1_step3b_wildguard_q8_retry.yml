name: gate1-step3b5-official-wildguard-q8-retry

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/gate1_step3b_wildguard_q8_retry.yml
      - configs/gate1/gate1_step3b_wildguard_validation.json
      - scripts/run_gate1_step3b_wildguard_validation.py
      - tests/test_gate1_step3b_wildguard_validation.py

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: gate1-step3b5-official-wildguard-q8-scientific
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      JBB_REVISION: d8d87b8fdcb7806e3b4e45fffb2bc24aa6b17f32
      JBB_PATH: data/judge-comparison.csv
      JBB_SHA256: dacaf76a1057785f11b0fc6aa07b9a73cdab588319ddfc5e8cef2909e5b112a5
      WILDGUARD_SOURCE_REVISION: 495b9dc837be594c6c5665b0f7f56169baf0d5be
      WILDGUARD_PY_BLOB: 3613afed3aa51437808da1be899e8c3944c170b0
      WILDGUARD_UTILS_BLOB: e91b44df534625f6f1bab8096a93101800778dfd
      LLAMA_REVISION: 0177dcc7300bad8914bb838baabce87899812491
      LLAMA_RELEASE_TAG: b10441
      LLAMA_ASSET: llama-b10441-bin-ubuntu-x64.tar.gz
      SAFE_OUTPUT: /tmp/gate1-step3b5-wildguard-q8-retry/safe
      PRIVATE_OUTPUT: /tmp/gate1-step3b5-wildguard-q8-retry/private
      PIP_NO_CACHE_DIR: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate1-contract
          fetch-depth: 0

      - name: Publish canonical Q8 run marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 3 --body \
            "Canonical WildGuard Q8 scientific run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate frozen implementation and Q8 contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,step3]'
          ruff check scripts/run_gate1_step3b_wildguard_validation.py \
            tests/test_gate1_step3b_wildguard_validation.py
          mypy src/jbspan
          pytest
          python -m json.tool \
            configs/gate1/gate1_step3b_wildguard_validation.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(
              Path("configs/gate1/gate1_step3b_wildguard_validation.json").read_text()
          )
          conversion = contract["model"]["conversion"]
          assert conversion == {
              "llama_cpp_repository": "ggml-org/llama.cpp",
              "llama_cpp_revision": "0177dcc7300bad8914bb838baabce87899812491",
              "release_tag": "b10441",
              "release_asset": "llama-b10441-bin-ubuntu-x64.tar.gz",
              "intermediate_outtype": "q8_0",
              "quantization": "Q8_0_DIRECT",
              "selection_candidate": "FINAL_HIGH_FIDELITY_RUNTIME_CANDIDATE",
              "previous_q4_selection_run": 32229162422,
              "no_further_runtime_candidates_if_selection_fails": True,
          }
          PY

      - name: Verify pinned official WildGuard source
        run: |
          source_dir="$RUNNER_TEMP/wildguard-source"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/allenai/wildguard.git
          git -C "$source_dir" fetch --depth 1 origin "$WILDGUARD_SOURCE_REVISION"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$WILDGUARD_SOURCE_REVISION"
          test "$(git -C "$source_dir" rev-parse HEAD:wildguard/wildguard.py)" = "$WILDGUARD_PY_BLOB"
          test "$(git -C "$source_dir" rev-parse HEAD:wildguard/utils.py)" = "$WILDGUARD_UTILS_BLOB"

      - name: Resolve official model access and immutable identity
        run: |
          mkdir -p "$SAFE_OUTPUT" "$PRIVATE_OUTPUT"
          python scripts/run_gate1_step3b_wildguard_validation.py preflight \
            --root . \
            --safe-output-dir "$SAFE_OUTPUT" \
            --github-env "$GITHUB_ENV"

      - name: Verify model-access preflight
        run: |
          jq -e '
            .access_ok == true
            and .status == "WILDGUARD_ACCESS_AND_IDENTITY_FROZEN"
            and (.model_revision | type == "string")
            and (.model_revision | length == 40)
          ' "$SAFE_OUTPUT/wildguard_preflight.json" >/dev/null

      - name: Download and freeze external validation design
        run: |
          source_csv="$RUNNER_TEMP/judge-comparison.csv"
          url="https://huggingface.co/datasets/JailbreakBench/JBB-Behaviors/resolve/${JBB_REVISION}/${JBB_PATH}?download=true"
          curl --fail --location --silent --show-error "$url" --output "$source_csv"
          test "$(sha256sum "$source_csv" | cut -d' ' -f1)" = "$JBB_SHA256"
          python scripts/run_gate1_step3b_wildguard_validation.py prepare \
            --root . \
            --source-csv "$source_csv" \
            --safe-output-dir "$SAFE_OUTPUT" \
            --private-output-dir "$PRIVATE_OUTPUT"

      - name: Free hosted-runner disk
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install pinned llama.cpp runtime and converter
        run: |
          release_json="$RUNNER_TEMP/llama-release.json"
          curl --fail --location --silent --show-error \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/${LLAMA_RELEASE_TAG}" \
            --output "$release_json"
          test "$(jq -r '.target_commitish' "$release_json")" = "$LLAMA_REVISION"
          asset_url="$(jq -r --arg name "$LLAMA_ASSET" '.assets[] | select(.name == $name) | .browser_download_url' "$release_json")"
          asset_digest="$(jq -r --arg name "$LLAMA_ASSET" '.assets[] | select(.name == $name) | .digest' "$release_json")"
          archive="$RUNNER_TEMP/$LLAMA_ASSET"
          curl --fail --location --silent --show-error "$asset_url" --output "$archive"
          test "sha256:$(sha256sum "$archive" | cut -d' ' -f1)" = "$asset_digest"
          mkdir -p "$RUNNER_TEMP/llama-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/llama-bin"
          server="$(find "$RUNNER_TEMP/llama-bin" -type f -name llama-server | head -n1)"
          test -x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"

          source_dir="$RUNNER_TEMP/llama-src"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$source_dir" fetch --depth 1 origin "$LLAMA_REVISION"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$LLAMA_REVISION"
          echo "LLAMA_SOURCE=$source_dir" >> "$GITHUB_ENV"
          python -m pip install -r "$source_dir/requirements/requirements-convert_hf_to_gguf.txt"

      - name: Download and verify exact official WildGuard snapshot
        run: |
          export HF_HOME="$RUNNER_TEMP/hf-wildguard"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from huggingface_hub import snapshot_download

          safe = Path(os.environ["SAFE_OUTPUT"])
          identity = json.loads((safe / "wildguard_preflight.json").read_text())
          snapshot = Path(
              snapshot_download(
                  repo_id=identity["official_model_repository"],
                  revision=identity["model_revision"],
                  token=os.environ["HF_TOKEN"],
                  cache_dir=Path(os.environ["HF_HOME"]),
              )
          )

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()

          for item in identity["files"]:
              path = snapshot / item["filename"]
              if not path.is_file():
                  raise SystemExit(f"missing WildGuard file: {item['filename']}")
              expected = item.get("sha256")
              if expected and digest(path) != expected:
                  raise SystemExit(f"WildGuard digest mismatch: {item['filename']}")
          with Path(os.environ["GITHUB_ENV"]).open("a") as handle:
              handle.write(f"WILDGUARD_MODEL_DIR={snapshot}\n")
          PY

      - name: Convert official WildGuard directly to Q8_0
        run: |
          q8="$RUNNER_TEMP/wildguard-q8_0.gguf"
          python "$LLAMA_SOURCE/convert_hf_to_gguf.py" \
            "$WILDGUARD_MODEL_DIR" \
            --outfile "$q8" \
            --outtype q8_0
          rm -rf "$RUNNER_TEMP/hf-wildguard"
          test -s "$q8"
          echo "WILDGUARD_GGUF=$q8" >> "$GITHUB_ENV"
          echo "WILDGUARD_GGUF_SHA256=$(sha256sum "$q8" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          df -h

      - name: Run Q8 selection and conditional untouched validation
        run: |
          mkdir -p "$RUNNER_TEMP/wildguard-server"
          nohup "$LLAMA_SERVER" \
            -m "$WILDGUARD_GGUF" \
            --host 127.0.0.1 \
            --port 8080 \
            -c 4096 \
            -t 4 \
            >"$RUNNER_TEMP/wildguard-server/server.log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 240); do
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -n 100 "$RUNNER_TEMP/wildguard-server/server.log"
              exit 1
            fi
            if [ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health || true)" = "200" ]; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"

          timeout 210m python scripts/run_gate1_step3b_wildguard_validation.py evaluate \
            --root . \
            --subset selection \
            --private-output-dir "$PRIVATE_OUTPUT" \
            --safe-output-dir "$SAFE_OUTPUT" \
            --server-url http://127.0.0.1:8080

          selection_pass="$(jq -r '.passes_all_thresholds' "$SAFE_OUTPUT/wildguard_selection_metrics.json")"
          if [ "$selection_pass" = "true" ]; then
            timeout 105m python scripts/run_gate1_step3b_wildguard_validation.py evaluate \
              --root . \
              --subset validation \
              --private-output-dir "$PRIVATE_OUTPUT" \
              --safe-output-dir "$SAFE_OUTPUT" \
              --server-url http://127.0.0.1:8080
          fi
          cleanup
          trap - EXIT

      - name: Finalize immutable Q8 decision
        if: always()
        run: |
          mkdir -p "$SAFE_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          safe = Path(os.environ["SAFE_OUTPUT"])
          preflight_path = safe / "wildguard_preflight.json"
          identity = json.loads(preflight_path.read_text()) if preflight_path.exists() else {}
          runtime = {
              "schema_version": "gate1-step3b-wildguard-runtime-v1",
              "runtime_candidate": "Q8_0_DIRECT",
              "model_revision": identity.get("model_revision"),
              "converted_gguf_sha256": os.environ.get("WILDGUARD_GGUF_SHA256"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_sha": os.environ.get("GITHUB_SHA"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
          }
          (safe / "wildguard_runtime.json").write_text(
              json.dumps(runtime, indent=2, sort_keys=True) + "\n"
          )
          PY
          if [ -f "$SAFE_OUTPUT/wildguard_preflight.json" ]; then
            python scripts/run_gate1_step3b_wildguard_validation.py finalize \
              --root . \
              --safe-output-dir "$SAFE_OUTPUT"
          fi

      - name: Verify safe-output privacy boundary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          safe = Path(os.environ["SAFE_OUTPUT"])
          private = Path(os.environ["PRIVATE_OUTPUT"])
          combined = "\n".join(
              path.read_text(encoding="utf-8")
              for path in safe.iterdir()
              if path.is_file()
          )
          if private.exists():
              for path in private.rglob("*.jsonl"):
                  for line in path.read_text(encoding="utf-8").splitlines():
                      if not line.strip():
                          continue
                      row = json.loads(line)
                      for key in ("prompt", "response", "raw_output"):
                          value = row.get(key)
                          if isinstance(value, str) and len(value) >= 16 and value in combined:
                              raise SystemExit(f"private text leaked through {key}")
          PY

      - name: Create safe Q8 report
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          safe = Path(os.environ["SAFE_OUTPUT"])
          decision_path = safe / "wildguard_decision.json"
          decision = json.loads(decision_path.read_text()) if decision_path.exists() else {
              "status": "WILDGUARD_Q8_OPERATIONAL_FAILURE",
              "selection_pass": False,
              "validation_pass": False,
              "selected_evaluator": None,
              "gate1_decision": "NOT_EVALUATED",
          }
          rows = [
              "# Gate 1 Step 3B.5 — Official WildGuard Q8 Result",
              "",
              "Date: 2026-08-20 (Asia/Seoul)",
              "",
              f"Status: **{decision['status']}**",
              "",
              "## Decision",
              "",
              f"- selection pass: **{decision['selection_pass']}**",
              f"- validation pass: **{decision['validation_pass']}**",
              f"- selected evaluator: **{decision.get('selected_evaluator')}**",
              "- runtime candidate: **Q8_0_DIRECT**",
              "- previous Q4 run: **32229162422**",
              "- final evaluation 30 observed: **false**",
              "- Gate 2 held-out 10 used: **false**",
              f"- Gate 1: **{decision.get('gate1_decision', 'NOT_EVALUATED')}**",
              "",
              "## Frozen metrics",
              "",
          ]
          for subset in ("selection", "validation"):
              path = safe / f"wildguard_{subset}_metrics.json"
              if not path.exists():
                  rows.append(f"- {subset}: **not observed**")
                  continue
              payload = json.loads(path.read_text())
              metrics = payload["metrics"]
              rows.extend([
                  f"### {subset.title()}",
                  "",
                  f"- count: **{metrics['count']}**",
                  f"- parse coverage: **{metrics['parse_coverage']:.6f}**",
                  f"- accuracy: **{metrics['accuracy']:.6f}**",
                  f"- macro-F1: **{metrics['macro_f1']:.6f}**",
                  f"- false-negative rate: **{metrics['false_negative_rate']:.6f}**",
                  f"- false-positive rate: **{metrics['false_positive_rate']:.6f}**",
                  f"- passes all thresholds: **{payload['passes_all_thresholds']}**",
                  "",
              ])
          report = Path(os.environ["RUNNER_TEMP"]) / "GATE1_STEP3B5_WILDGUARD_Q8_RESULT.md"
          report.write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

      - name: Persist canonical Q8 result and archive operational attempt
        if: always()
        run: |
          test -f "$SAFE_OUTPUT/wildguard_decision.json"
          generated_report="$RUNNER_TEMP/GATE1_STEP3B5_WILDGUARD_Q8_RESULT.md"
          destination=data/gate1/v2/wildguard_q8
          report=docs/GATE1_STEP3B5_WILDGUARD_Q8_RESULT.md
          operational=data/gate1/v2/wildguard_q8_operational_32357880091
          operational_report=docs/GATE1_STEP3B5_WILDGUARD_Q8_OPERATIONAL_32357880091.md

          git fetch origin agent/gate1-contract
          git checkout -B agent/gate1-contract origin/agent/gate1-contract
          if [ -d "$destination" ]; then
            current_status="$(jq -r '.status' "$destination/wildguard_decision.json")"
            if [ "$current_status" = "WILDGUARD_RUNTIME_OR_SELECTION_NOT_COMPLETED" ]; then
              if [ ! -e "$operational" ]; then
                git mv "$destination" "$operational"
              else
                rm -rf "$destination"
              fi
              if [ -f "$report" ]; then
                if [ ! -e "$operational_report" ]; then
                  git mv "$report" "$operational_report"
                else
                  rm "$report"
                fi
              fi
            else
              diff -ru "$destination" "$SAFE_OUTPUT"
              diff -u "$report" "$generated_report"
              exit 0
            fi
          fi

          mkdir -p "$destination"
          cp -a "$SAFE_OUTPUT"/. "$destination"/
          cp "$generated_report" "$report"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$destination" "$report"
          if [ -e "$operational" ]; then git add "$operational"; fi
          if [ -e "$operational_report" ]; then git add "$operational_report"; fi
          git diff --cached --check
          git commit -m "Freeze canonical WildGuard Q8 decision [skip ci]"
          git push origin HEAD:agent/gate1-contract

      - name: Publish Q8 result summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          decision="$SAFE_OUTPUT/wildguard_decision.json"
          status="$(jq -r '.status' "$decision")"
          selection="$(jq -r '.selection_pass' "$decision")"
          validation="$(jq -r '.validation_pass' "$decision")"
          gh pr comment 3 --body \
            "Canonical WildGuard Q8 result: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — status **$status**, selection **$selection**, validation **$validation**"

      - name: Upload safe Q8 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-step3b5-official-wildguard-q8-retry-safe
          path: ${{ env.SAFE_OUTPUT }}
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup private and model files
        if: always()
        run: |
          if [ -d "$PRIVATE_OUTPUT" ]; then
            find "$PRIVATE_OUTPUT" -type f -print0 | xargs -0 -r shred -u
            rm -rf "$PRIVATE_OUTPUT"
          fi
          rm -rf "$RUNNER_TEMP/hf-wildguard" \
            "$RUNNER_TEMP/wildguard-q8_0.gguf" \
            "$RUNNER_TEMP/wildguard-source" \
            "$RUNNER_TEMP/llama-src"
