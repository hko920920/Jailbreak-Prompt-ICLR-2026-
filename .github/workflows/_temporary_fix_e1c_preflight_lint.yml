name: temporary-fix-e1c-preflight-lint

on:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_fix_e1c_preflight_lint.yml

permissions:
  contents: write

concurrency:
  group: temporary-fix-e1c-preflight-lint
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/programmatic-agentharm-pivot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply exact formatting-only replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run_evaluator_panel_e1c_harmbench_preflight.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "def run(config_path: Path, source_root: Path, safe_output: Path, selection_output: Path) -> JsonObject:\n": (
                  "def run(\n"
                  "    config_path: Path,\n"
                  "    source_root: Path,\n"
                  "    safe_output: Path,\n"
                  "    selection_output: Path,\n"
                  ") -> JsonObject:\n"
              ),
              "    if predecessor_result.get(\"next_authorized_operation\") != predecessor[\"required_next_operation\"]:\n": (
                  "    if (\n"
                  "        predecessor_result.get(\"next_authorized_operation\")\n"
                  "        != predecessor[\"required_next_operation\"]\n"
                  "    ):\n"
              ),
              "    validation = load_object(source_root / str(as_object(contract[\"validation_data\"], where=\"validation_data\")[\"path\"]))\n": (
                  "    validation_data = as_object(\n"
                  "        contract[\"validation_data\"], where=\"validation_data\"\n"
                  "    )\n"
                  "    validation = load_object(source_root / str(validation_data[\"path\"]))\n"
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exact single lint target: {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate corrected file
        run: |
          python -m pip install 'ruff>=0.6' 'pytest>=8.2'
          ruff check \
            scripts/run_evaluator_panel_e1c_harmbench_preflight.py \
            tests/test_evaluator_panel_e1c_harmbench_preflight.py
          python -m pytest -q tests/test_evaluator_panel_e1c_harmbench_preflight.py

      - name: Commit correction and remove temporary workflow
        run: |
          git rm .github/workflows/_temporary_fix_e1c_preflight_lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_evaluator_panel_e1c_harmbench_preflight.py
          git commit -m "Fix E1C preflight lint without changing contract"
          git push origin HEAD:agent/programmatic-agentharm-pivot
