name: e1b-status-probe

on:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/e1b_status_probe.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: e1b-status-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_WORKFLOW: evaluator_panel_e1b_wildguard.yml
      TARGET_BRANCH: agent/programmatic-agentharm-pivot
      TARGET_TRIGGER_SHA: bdf26570ff835498cb9dc85b40eaf379a1080a12
      PR_NUMBER: "4"
    steps:
      - name: Resolve and record latest hardened E1B run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs_json="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?branch=${TARGET_BRANCH}&per_page=30")"

          run_json="$(jq -c --arg sha "$TARGET_TRIGGER_SHA" '
            [
              .workflow_runs[]
              | select(.event == "push" or .event == "workflow_dispatch")
            ]
            | (map(select(.head_sha == $sha)) + .)
            | unique_by(.id)
            | sort_by(.created_at)
            | reverse
            | .[0]
          ' <<<"$runs_json")"

          if [[ "$run_json" == "null" ]]; then
            echo "No E1B run was found." >&2
            exit 1
          fi

          run_id="$(jq -r '.id' <<<"$run_json")"
          status="$(jq -r '.status' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion // "pending"' <<<"$run_json")"
          event="$(jq -r '.event' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          created_at="$(jq -r '.created_at' <<<"$run_json")"
          updated_at="$(jq -r '.updated_at' <<<"$run_json")"
          html_url="$(jq -r '.html_url' <<<"$run_json")"

          jobs_json="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          job_summary="$(jq -r '
            [.jobs[] | "- `" + .name + "`: **" + .status + " / " + (.conclusion // "pending") + "**"]
            | join("\n")
          ' <<<"$jobs_json")"

          marker='<!-- e1b-status-probe -->'
          body="${marker}
          ## E1B hardened-run status probe

          - run: [\`${run_id}\`](${html_url})
          - event: \`${event}\`
          - head SHA: \`${head_sha}\`
          - trigger SHA expected: \`${TARGET_TRIGGER_SHA}\`
          - status: **${status}**
          - conclusion: **${conclusion}**
          - created: \`${created_at}\`
          - last updated: \`${updated_at}\`

          ### Jobs
          ${job_summary}

          This probe is operational metadata only. It changes no model, dataset, threshold, split, evaluator rule, or scientific claim boundary."

          comments="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
          comment_id="$(jq -r --arg marker "$marker" '
            [ .[] | select(.body | contains($marker)) ] | last | .id // empty
          ' <<<"$comments")"

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$body" >/dev/null
          else
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$body" >/dev/null
          fi

          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
