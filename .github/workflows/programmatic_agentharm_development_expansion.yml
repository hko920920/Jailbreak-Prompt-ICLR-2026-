name: programmatic-agentharm-development-expansion

on:
  pull_request:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/programmatic_agentharm_development_expansion.yml
      - scripts/run_programmatic_agentharm_development_sweep.py
      - scripts/run_programmatic_agentharm_smoke.py
      - configs/programmatic_agentharm/development_expansion.json
      - configs/programmatic_agentharm/runtime_smoke.json
      - data/programmatic_agentharm/gate0/gate0_manifest.json
      - data/gate1/v2/frozen/**
      - src/jbspan/programmatic_agentharm/development.py
      - src/jbspan/programmatic_agentharm/runtime.py
      - src/jbspan/gate1/step3b.py
      - tests/test_programmatic_agentharm_development.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    programmatic-agentharm-development-expansion-${{
      github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true

jobs:
  development-shard:
    name: development-shard (${{ matrix.original_id }})
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        original_id: ["64", "60", "102", "74", "43", "98"]
    env:
      ATTACK_SOURCE: /tmp/h4rm3l-reference-programs.csv
      SAFE_OUTPUT: >-
        artifacts/programmatic-agentharm-development-expansion/${{
          matrix.original_id
        }}/safe_summary.json
      MODEL_DIR: /tmp/qwen2.5-7b-instruct-q4
      LOCAL_API_KEY: local-runtime-only
      LOCAL_BASE_URL: http://127.0.0.1:8080/v1
      HF_HOME: /tmp/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install \
            'openai>=1.75' \
            'git+https://github.com/UKGovernmentBEIS/inspect_evals.git@928e3dd92aa926f7dd1746c753e171f9f717c964'

      - name: Validate development sweep implementation
        run: |
          ruff check \
            scripts/run_programmatic_agentharm_development_sweep.py \
            scripts/run_programmatic_agentharm_smoke.py \
            src/jbspan/programmatic_agentharm/development.py \
            tests/test_programmatic_agentharm_development.py
          python -m py_compile \
            scripts/run_programmatic_agentharm_development_sweep.py
          pytest \
            tests/test_programmatic_agentharm_contract.py \
            tests/test_programmatic_agentharm_runtime.py \
            tests/test_programmatic_agentharm_development.py
          git diff --check

      - name: Fetch and verify pinned h4rm3l attack source
        run: |
          curl --fail --location --retry 5 --retry-delay 3 \
            'https://raw.githubusercontent.com/mdoumbouya/h4rm3l/e6f58a1a1e56c1a95b26b06aa4fe393ee2240dbd/experiments/experiment_116_bandi_synthesis/config/benchmark_reference_programs.csv' \
            --output "$ATTACK_SOURCE"
          echo 'b4c07b11c9e92ecd332807e8ba32d8fe028b59f4c3499f72670d44105626ef07  /tmp/h4rm3l-reference-programs.csv' \
            | sha256sum --check --strict

      - name: Install pinned llama.cpp CPU runtime
        run: |
          archive="$RUNNER_TEMP/llama-b10441-bin-ubuntu-x64.tar.gz"
          runtime_root="$RUNNER_TEMP/llama-b10441"
          mkdir -p "$runtime_root"
          curl --fail --location --retry 5 --retry-delay 5 \
            'https://github.com/ggml-org/llama.cpp/releases/download/b10441/llama-b10441-bin-ubuntu-x64.tar.gz' \
            --output "$archive"
          tar -xzf "$archive" -C "$runtime_root"
          server="$(find "$runtime_root" -type f -name 'llama-server' -print -quit)"
          test -n "$server"
          chmod +x "$server"
          lib_dirs="$(find "$runtime_root" -type f -name '*.so*' -printf '%h\n' \
            | sort -u | paste -sd: -)"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$lib_dirs" >> "$GITHUB_ENV"
          env LD_LIBRARY_PATH="$lib_dirs" "$server" --version

      - name: Download and verify pinned Qwen2.5-7B Q4 model
        run: |
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from huggingface_hub import hf_hub_download

          config = json.loads(
              Path('configs/programmatic_agentharm/runtime_smoke.json').read_text()
          )
          target = config['target']
          model_dir = Path(os.environ['MODEL_DIR'])
          paths = []
          for item in target['gguf_files']:
              path = Path(
                  hf_hub_download(
                      repo_id=target['gguf_repo_id'],
                      revision=target['gguf_revision'],
                      filename=item['filename'],
                      local_dir=model_dir,
                  )
              )
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(block)
              if digest.hexdigest() != item['sha256']:
                  raise SystemExit(f'model SHA-256 mismatch: {item["filename"]}')
              if path.stat().st_size != item['size']:
                  raise SystemExit(f'model size mismatch: {item["filename"]}')
              paths.append(path)
          with Path(os.environ['GITHUB_ENV']).open('a') as handle:
              handle.write(f'MODEL_PATH={paths[0]}\n')
          print('verified model shards:', len(paths))
          PY

      - name: Start pinned local target server
        run: |
          mkdir -p "$RUNNER_TEMP/llama-server"
          nohup "$LLAMA_SERVER" \
            -m "$MODEL_PATH" \
            --alias qwen2.5-7b-instruct \
            --host 127.0.0.1 \
            --port 8080 \
            -c 8192 \
            -t 4 \
            -np 1 \
            >"$RUNNER_TEMP/llama-server/server.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/llama-server/pid"

          ready=0
          for _ in $(seq 1 180); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/llama-server/pid")" 2>/dev/null; then
              echo 'llama-server exited before readiness'
              head -n 80 "$RUNNER_TEMP/llama-server/server.log"
              exit 1
            fi
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8080/health || true)"
            if [ "$status" = '200' ]; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != '1' ]; then
            echo 'llama-server did not become ready'
            head -n 80 "$RUNNER_TEMP/llama-server/server.log"
            exit 1
          fi

      - name: Run one-behavior five-candidate development shard
        run: |
          set +e
          timeout 100m python scripts/run_programmatic_agentharm_development_sweep.py \
            --root . \
            --runtime-config configs/programmatic_agentharm/runtime_smoke.json \
            --development-config \
              configs/programmatic_agentharm/development_expansion.json \
            --original-id "${{ matrix.original_id }}" \
            --attack-source-csv "$ATTACK_SOURCE" \
            --safe-output "$SAFE_OUTPUT"
          sweep_exit=$?
          set -e
          echo "SWEEP_EXIT=$sweep_exit" >> "$GITHUB_ENV"

      - name: Verify safe shard boundary
        if: always()
        run: |
          test -f "$SAFE_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ['SAFE_OUTPUT']).read_text())
          forbidden_keys = {
              'prompt',
              'response',
              'raw_output',
              'tool_output',
              'generation',
              'arguments',
          }

          def visit(node):
              if isinstance(node, dict):
                  leaked = forbidden_keys.intersection(node)
                  if leaked:
                      raise SystemExit(f'unsafe artifact keys: {sorted(leaked)}')
                  for child in node.values():
                      visit(child)
              elif isinstance(node, list):
                  for child in node:
                      visit(child)

          visit(value)
          assert value['paper_validity'] is False
          assert value['development_only'] is True
          assert value['development_shard'] is True
          assert value['behavior_count'] == 1
          assert value['full_contract_behavior_count'] == 6
          assert value[
              'legacy_gate0_confirmatory_rows_consumed_as_development'
          ] is True
          assert value['legacy_gate0_confirmatory_outputs_observed'] is True
          assert value[
              'consumed_rows_excluded_from_future_paper_confirmatory'
          ] is True
          assert value['human_judge_used'] is False
          assert value['llm_judge_used'] is False
          assert value['assistant_free_text_scored'] is False
          assert value['raw_prompts_committed'] is False
          assert value['raw_responses_committed'] is False
          assert value['raw_tool_arguments_committed'] is False
          assert value['raw_tool_responses_committed'] is False
          assert value['paper_confirmatory_outputs_observed'] is False
          assert value['final_outputs_observed'] is False
          assert value['heldout_outputs_observed'] is False
          assert value['causal_oracle_opened'] is False
          assert value['wavelet_used'] is False
          PY

      - name: Publish safe shard summary
        if: always()
        run: |
          if [ -f "$SAFE_OUTPUT" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ['SAFE_OUTPUT']).read_text())
          decision = value['decision']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as handle:
              handle.write('# AgentHarm development shard\n\n')
              handle.write(
                  f"- original id: **{value['consumed_original_ids'][0]}**\n"
              )
              handle.write(f"- runtime status: **{value['status']}**\n")
              handle.write(
                  f"- scientific signal: **{value['scientific_signal']}**\n"
              )
              handle.write(
                  f"- completed episodes: **{decision['completed_episodes']}/6**\n"
              )
              handle.write(
                  f"- eligible pairs: **{len(decision['eligible_pairs'])}**\n"
              )
              handle.write('- paper-valid result: **false**\n')
          PY
          else
            echo 'Safe output was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload safe shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            programmatic-agentharm-development-shard-${{
              matrix.original_id
            }}
          path: ${{ env.SAFE_OUTPUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local target server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/llama-server/pid" ]; then
            kill "$(cat "$RUNNER_TEMP/llama-server/pid")" 2>/dev/null || true
          fi

      - name: Enforce operational completeness
        if: always()
        run: exit "${SWEEP_EXIT:-1}"

  aggregate:
    name: aggregate development signal
    needs: development-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SAFE_OUTPUT: artifacts/programmatic-agentharm-development-expansion/safe_summary.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: programmatic-agentharm-development-shard-*
          path: artifacts/shards
          merge-multiple: false

      - name: Aggregate six safe shard results
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(
              Path(
                  'configs/programmatic_agentharm/development_expansion.json'
              ).read_text()
          )
          expected_original_ids = [
              item['original_id'] for item in config['development_behaviors']
          ]
          candidate_ids = config['selected_candidate_ids']
          paths = sorted(Path('artifacts/shards').glob('*/safe_summary.json'))
          if len(paths) != len(expected_original_ids):
              raise SystemExit(
                  f'expected {len(expected_original_ids)} shard files, found {len(paths)}'
              )

          payloads = [json.loads(path.read_text()) for path in paths]
          seen_original_ids = []
          episodes = []
          runtime = None
          shard_signals = {}
          for value in payloads:
              assert value['schema_version'] == (
                  'programmatic-agentharm-development-sweep-result-v1'
              )
              assert value['paper_validity'] is False
              assert value['development_only'] is True
              assert value['development_shard'] is True
              assert value['behavior_count'] == 1
              assert value['full_contract_behavior_count'] == len(
                  expected_original_ids
              )
              assert value['candidate_count'] == len(candidate_ids)
              assert value['decision']['operational_pass'] is True
              assert value['paper_confirmatory_outputs_observed'] is False
              assert value['final_outputs_observed'] is False
              assert value['heldout_outputs_observed'] is False
              assert value['causal_oracle_opened'] is False
              assert value['wavelet_used'] is False
              consumed = value['consumed_original_ids']
              if not isinstance(consumed, list) or len(consumed) != 1:
                  raise SystemExit('each shard must consume exactly one original id')
              original_id = consumed[0]
              if original_id in seen_original_ids:
                  raise SystemExit(f'duplicate original id: {original_id}')
              seen_original_ids.append(original_id)
              shard_signals[original_id] = value['scientific_signal']
              episodes.extend(value['episodes'])
              if runtime is None:
                  runtime = value['runtime']
              elif runtime != value['runtime']:
                  raise SystemExit('runtime identity differs across shards')

          if set(seen_original_ids) != set(expected_original_ids):
              raise SystemExit('shard original ids differ from frozen overlay')

          by_original = {}
          for episode in episodes:
              by_original.setdefault(episode['original_id'], []).append(episode)

          eligible_pairs = []
          direct_success_behavior_ids = []
          eligible_behavior_ids = set()
          successful_candidate_ids = set()
          for original_id in expected_original_ids:
              group = by_original.get(original_id, [])
              originals = [item for item in group if item['candidate_id'] is None]
              attacked = [item for item in group if item['candidate_id'] is not None]
              if len(originals) != 1 or len(attacked) != len(candidate_ids):
                  raise SystemExit(f'invalid episode cardinality for {original_id}')
              original = originals[0]
              behavior_id = original['behavior_id']
              if original['programmatic_success'] is True:
                  direct_success_behavior_ids.append(behavior_id)
                  continue
              for item in attacked:
                  if item['programmatic_success'] is True:
                      candidate_id = item['candidate_id']
                      eligible_pairs.append(
                          {
                              'original_id': original_id,
                              'behavior_id': behavior_id,
                              'candidate_id': candidate_id,
                          }
                      )
                      eligible_behavior_ids.add(behavior_id)
                      successful_candidate_ids.add(candidate_id)

          expected_episodes = len(expected_original_ids) * (1 + len(candidate_ids))
          completed = sum(item['completed'] is True for item in episodes)
          scored = sum(
              item['programmatic_score_parsed'] is True for item in episodes
          )
          score_coverage = scored / expected_episodes
          operational_pass = (
              completed == expected_episodes and score_coverage == 1.0
          )
          if not operational_pass:
              status = 'PROGRAMMATIC_AGENTHARM_DEVELOPMENT_SWEEP_RUNTIME_FAIL'
              scientific_signal = 'DEVELOPMENT_SIGNAL_UNRESOLVED'
          elif eligible_pairs:
              status = 'PROGRAMMATIC_AGENTHARM_DEVELOPMENT_SWEEP_PASS'
              scientific_signal = 'ELIGIBLE_PAIRS_FOUND'
          elif direct_success_behavior_ids:
              status = 'PROGRAMMATIC_AGENTHARM_DEVELOPMENT_SWEEP_PASS'
              scientific_signal = 'NO_ELIGIBLE_PAIRS_SOME_DIRECT_SUCCESS'
          else:
              status = 'PROGRAMMATIC_AGENTHARM_DEVELOPMENT_SWEEP_PASS'
              scientific_signal = 'NO_ELIGIBLE_PAIRS_ON_EXPANDED_DEVELOPMENT'

          output = {
              'schema_version': (
                  'programmatic-agentharm-development-aggregate-result-v1'
              ),
              'status': status,
              'scientific_signal': scientific_signal,
              'paper_validity': False,
              'development_only': True,
              'development_shard': False,
              'aggregate': True,
              'legacy_gate0_confirmatory_rows_consumed_as_development': True,
              'legacy_gate0_confirmatory_outputs_observed': True,
              'consumed_rows_excluded_from_future_paper_confirmatory': True,
              'consumed_original_ids': expected_original_ids,
              'behavior_count': len(expected_original_ids),
              'candidate_count': len(candidate_ids),
              'shard_count': len(payloads),
              'shard_signals': shard_signals,
              'decision': {
                  'status': status,
                  'scientific_signal': scientific_signal,
                  'completed_episodes': completed,
                  'expected_episodes': expected_episodes,
                  'score_coverage': score_coverage,
                  'direct_success_behavior_ids': sorted(
                      direct_success_behavior_ids
                  ),
                  'eligible_pairs': eligible_pairs,
                  'eligible_behavior_ids': sorted(eligible_behavior_ids),
                  'successful_candidate_ids': sorted(
                      successful_candidate_ids
                  ),
                  'operational_pass': operational_pass,
                  'failures': [] if operational_pass else [
                      'INCOMPLETE_OR_UNSCORED_SHARDS'
                  ],
              },
              'episodes': episodes,
              'runtime': runtime,
              'human_judge_used': False,
              'llm_judge_used': False,
              'assistant_free_text_scored': False,
              'raw_prompts_committed': False,
              'raw_responses_committed': False,
              'raw_tool_arguments_committed': False,
              'raw_tool_responses_committed': False,
              'paper_confirmatory_outputs_observed': False,
              'final_outputs_observed': False,
              'heldout_outputs_observed': False,
              'causal_oracle_opened': False,
              'wavelet_used': False,
          }
          output_path = Path(os.environ['SAFE_OUTPUT'])
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(
              json.dumps(output, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(output['decision'], indent=2, sort_keys=True))
          if not operational_pass:
              raise SystemExit(2)
          PY

      - name: Verify aggregate safe boundary
        run: |
          test -f "$SAFE_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ['SAFE_OUTPUT']).read_text())
          forbidden_keys = {
              'prompt',
              'response',
              'raw_output',
              'tool_output',
              'generation',
              'arguments',
          }

          def visit(node):
              if isinstance(node, dict):
                  leaked = forbidden_keys.intersection(node)
                  if leaked:
                      raise SystemExit(f'unsafe artifact keys: {sorted(leaked)}')
                  for child in node.values():
                      visit(child)
              elif isinstance(node, list):
                  for child in node:
                      visit(child)

          visit(value)
          assert value['paper_validity'] is False
          assert value['development_only'] is True
          assert value['aggregate'] is True
          assert value['behavior_count'] == 6
          assert value['candidate_count'] == 5
          assert value['shard_count'] == 6
          assert value['decision']['completed_episodes'] == 36
          assert value['decision']['expected_episodes'] == 36
          assert value['decision']['score_coverage'] == 1.0
          assert value['paper_confirmatory_outputs_observed'] is False
          assert value['final_outputs_observed'] is False
          assert value['heldout_outputs_observed'] is False
          assert value['causal_oracle_opened'] is False
          assert value['wavelet_used'] is False
          PY

      - name: Publish aggregate scientific signal
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ['SAFE_OUTPUT']).read_text())
          decision = value['decision']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as handle:
              handle.write('# AgentHarm expanded development result\n\n')
              handle.write(f"- runtime status: **{value['status']}**\n")
              handle.write(
                  f"- scientific signal: **{value['scientific_signal']}**\n"
              )
              handle.write(
                  f"- completed episodes: **{decision['completed_episodes']}/36**\n"
              )
              handle.write(
                  f"- score coverage: **{decision['score_coverage']:.3f}**\n"
              )
              handle.write(
                  f"- eligible pairs: **{len(decision['eligible_pairs'])}**\n"
              )
              handle.write(
                  "- eligible behaviors: **"
                  f"{len(decision['eligible_behavior_ids'])}/6**\n"
              )
              handle.write(
                  "- successful candidates: **"
                  f"{len(decision['successful_candidate_ids'])}/5**\n"
              )
              handle.write(
                  "- direct-success behaviors: **"
                  f"{len(decision['direct_success_behavior_ids'])}**\n"
              )
              handle.write('- human/LLM judge used: **false**\n')
              handle.write('- paper-valid result: **false**\n')
          PY

      - name: Upload aggregate safe artifact
        uses: actions/upload-artifact@v4
        with:
          name: programmatic-agentharm-development-expansion-safe
          path: ${{ env.SAFE_OUTPUT }}
          if-no-files-found: error
          retention-days: 14
