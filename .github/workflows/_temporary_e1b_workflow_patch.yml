name: temporary-e1b-workflow-patch

on:
  pull_request:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/_temporary_e1b_workflow_patch.yml
      - scripts/_temporary_patch_e1b_workflow.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/programmatic-agentharm-pivot
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply and validate workflow-only E1B repair
        run: |
          python scripts/_temporary_patch_e1b_workflow.py
          git diff --check
          test -s .github/workflows/evaluator_panel_e1b_wildguard.yml

      - name: Upload patched E1B workflow for connector commit
        uses: actions/upload-artifact@v4
        with:
          name: patched-evaluator-panel-e1b-workflow
          path: .github/workflows/evaluator_panel_e1b_wildguard.yml
          if-no-files-found: error
          retention-days: 2
