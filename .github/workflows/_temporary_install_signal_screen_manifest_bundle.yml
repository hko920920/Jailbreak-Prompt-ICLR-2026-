name: temporary-install-signal-screen-manifest-bundle

"on":
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_install_signal_screen_manifest_bundle.yml

permissions:
  contents: write

concurrency:
  group: temporary-install-signal-screen-manifest-bundle
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/programmatic-agentharm-pivot

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore validated source bundle
        env:
          BUNDLE_SHA256: 33d1be52693b185c202adb1463439df6c95d54cf0e5ae3da47f0e40bfee3ec16
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import zlib
          from pathlib import Path

          encoded = ""
          raw = zlib.decompress(base64.b64decode(encoded))
          observed = hashlib.sha256(raw).hexdigest()
          assert observed == os.environ["BUNDLE_SHA256"], observed
          files = json.loads(raw)
          for relative, content in files.items():
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")
          PY

      - name: Validate restored implementation
        run: |
          python -m pip install 'pytest>=8.2' 'ruff==0.16.4'
          targets=(
            scripts/freeze_h4rm3l_gcg_signal_screen_input_manifest.py
            tests/test_h4rm3l_gcg_signal_screen_input_manifest.py
          )
          ruff check "${targets[@]}"
          python -m pytest -q \
            tests/test_h4rm3l_gcg_signal_screen_input_manifest.py
          python -m py_compile \
            scripts/freeze_h4rm3l_gcg_signal_screen_input_manifest.py
          python -m json.tool \
            configs/natural_language_localization/h4rm3l_gcg_signal_screen_input_manifest_v1.json \
            >/dev/null
          git diff --check

      - name: Commit implementation and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/freeze_h4rm3l_gcg_signal_screen_input_manifest.py \
            tests/test_h4rm3l_gcg_signal_screen_input_manifest.py \
            docs/H4RM3L_GCG_SIGNAL_SCREEN_INPUT_MANIFEST_V1.md \
            .github/workflows/h4rm3l_gcg_signal_screen_input_manifest.yml
          git rm \
            .github/workflows/_temporary_install_signal_screen_manifest_bundle.yml
          git commit -m \
            "Implement h4rm3l-GCG signal-screen input manifest freeze"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
