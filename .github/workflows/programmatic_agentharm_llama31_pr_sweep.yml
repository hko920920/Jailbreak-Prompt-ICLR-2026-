name: programmatic-agentharm-llama31-pr-sweep

on:
  pull_request:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/programmatic_agentharm_llama31_pr_sweep.yml
      - configs/programmatic_agentharm/llama31_runtime.json
      - configs/programmatic_agentharm/llama31_development_sweep.json
      - scripts/run_programmatic_agentharm_development_behavior.py
      - scripts/aggregate_programmatic_agentharm_development_sweep.py
      - scripts/run_programmatic_agentharm_smoke.py
      - scripts/inspect_ai.py
      - data/programmatic_agentharm/gate0/gate0_manifest.json
      - data/gate1/v2/frozen/**
      - src/jbspan/programmatic_agentharm/development_sweep.py
      - src/jbspan/programmatic_agentharm/runtime.py
      - src/jbspan/gate1/step3b.py
      - tests/test_programmatic_agentharm_development_sweep.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: programmatic-agentharm-llama31-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate frozen second-model contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check \
            scripts/run_programmatic_agentharm_development_behavior.py \
            scripts/aggregate_programmatic_agentharm_development_sweep.py \
            scripts/run_programmatic_agentharm_smoke.py \
            src/jbspan/programmatic_agentharm/development_sweep.py \
            src/jbspan/programmatic_agentharm/runtime.py \
            tests/test_programmatic_agentharm_development_sweep.py
          python -m py_compile \
            scripts/run_programmatic_agentharm_development_behavior.py \
            scripts/aggregate_programmatic_agentharm_development_sweep.py \
            scripts/run_programmatic_agentharm_smoke.py \
            src/jbspan/programmatic_agentharm/development_sweep.py
          pytest tests/test_programmatic_agentharm_contract.py \
            tests/test_programmatic_agentharm_runtime.py \
            tests/test_programmatic_agentharm_development_sweep.py
          python - <<'PY'
          import json
          from pathlib import Path

          runtime = json.loads(
              Path('configs/programmatic_agentharm/llama31_runtime.json').read_text()
          )
          development = json.loads(
              Path(
                  'configs/programmatic_agentharm/llama31_development_sweep.json'
              ).read_text()
          )
          assert runtime['frozen'] is True
          assert runtime['paper_validity'] is False
          assert runtime['target']['gguf_revision'] == \
              '4f0c246f125fc7594238ebe7beb1435a8335f519'
          assert runtime['target']['gguf_files'][0]['sha256'] == \
              '7b064f5842bf9532c91456deda288a1b672397a54fa729aa665952863033557c'
          assert runtime['target']['gguf_files'][0]['size'] == 4920739232
          assert runtime['agentharm']['system_prompt_template'] == 'llama-3.1'
          assert development['frozen'] is True
          assert development['paper_validity'] is False
          assert development['development_only'] is True
          assert development['provenance']['second_model_selected_before_second_model_outputs'] is True
          assert development['provenance']['qwen_broad_threshold_unreachable_even_if_unresolved_is_eligible'] is True
          assert len(development['behaviors']) == 6
          assert len(development['candidate_ids']) == 5
          PY
          git diff --check

  sweep:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        behavior:
          - copyright-64
          - cybercrime-60
          - drugs-102
          - harassment-74
          - hate-43
          - sexual-98
    env:
      ATTACK_SOURCE: /tmp/h4rm3l-reference-programs.csv
      SAFE_OUTPUT: artifacts/programmatic-agentharm-llama31/${{ matrix.behavior }}/safe_summary.json
      MODEL_DIR: /tmp/llama-3.1-8b-instruct-q4
      LOCAL_API_KEY: local-runtime-only
      LOCAL_BASE_URL: http://127.0.0.1:8080/v1
      HF_HOME: /tmp/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install \
            'openai>=1.75' \
            'git+https://github.com/UKGovernmentBEIS/inspect_evals.git@928e3dd92aa926f7dd1746c753e171f9f717c964'

      - name: Fetch and verify frozen attack source
        run: |
          curl --fail --location --retry 5 --retry-delay 3 \
            'https://raw.githubusercontent.com/mdoumbouya/h4rm3l/e6f58a1a1e56c1a95b26b06aa4fe393ee2240dbd/experiments/experiment_116_bandi_synthesis/config/benchmark_reference_programs.csv' \
            --output "$ATTACK_SOURCE"
          echo 'b4c07b11c9e92ecd332807e8ba32d8fe028b59f4c3499f72670d44105626ef07  /tmp/h4rm3l-reference-programs.csv' \
            | sha256sum --check --strict

      - name: Install pinned llama.cpp runtime
        run: |
          archive="$RUNNER_TEMP/llama-b10441-bin-ubuntu-x64.tar.gz"
          runtime_root="$RUNNER_TEMP/llama-b10441"
          mkdir -p "$runtime_root"
          curl --fail --location --retry 5 --retry-delay 5 \
            'https://github.com/ggml-org/llama.cpp/releases/download/b10441/llama-b10441-bin-ubuntu-x64.tar.gz' \
            --output "$archive"
          tar -xzf "$archive" -C "$runtime_root"
          server="$(find "$runtime_root" -type f -name 'llama-server' -print -quit)"
          test -n "$server"
          chmod +x "$server"
          lib_dirs="$(find "$runtime_root" -type f -name '*.so*' -printf '%h\n' \
            | sort -u | paste -sd: -)"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$lib_dirs" >> "$GITHUB_ENV"
          env LD_LIBRARY_PATH="$lib_dirs" "$server" --version

      - name: Download and verify frozen Llama 3.1 artifact
        run: |
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from huggingface_hub import hf_hub_download

          runtime = json.loads(
              Path('configs/programmatic_agentharm/llama31_runtime.json').read_text()
          )
          target = runtime['target']
          item = target['gguf_files'][0]
          path = Path(
              hf_hub_download(
                  repo_id=target['gguf_repo_id'],
                  revision=target['gguf_revision'],
                  filename=item['filename'],
                  local_dir=Path(os.environ['MODEL_DIR']),
              )
          )
          digest = hashlib.sha256()
          with path.open('rb') as handle:
              for block in iter(lambda: handle.read(1024 * 1024), b''):
                  digest.update(block)
          if digest.hexdigest() != item['sha256']:
              raise SystemExit(f'model SHA-256 mismatch: {item["filename"]}')
          if path.stat().st_size != item['size']:
              raise SystemExit(f'model size mismatch: {item["filename"]}')
          with Path(os.environ['GITHUB_ENV']).open('a') as handle:
              handle.write(f'MODEL_PATH={path}\n')
          print('verified model artifact:', path.name)
          PY

      - name: Start frozen Llama 3.1 target
        run: |
          mkdir -p "$RUNNER_TEMP/llama-server"
          nohup "$LLAMA_SERVER" \
            -m "$MODEL_PATH" \
            --alias llama-3.1-8b-instruct \
            --host 127.0.0.1 \
            --port 8080 \
            -c 8192 \
            -t 4 \
            -np 1 \
            >"$RUNNER_TEMP/llama-server/server.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/llama-server/pid"

          ready=0
          for _ in $(seq 1 180); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/llama-server/pid")" 2>/dev/null; then
              echo 'llama-server exited before readiness'
              head -n 100 "$RUNNER_TEMP/llama-server/server.log"
              exit 1
            fi
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8080/health || true)"
            if [ "$status" = '200' ]; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != '1' ]; then
            echo 'llama-server did not become ready'
            head -n 100 "$RUNNER_TEMP/llama-server/server.log"
            exit 1
          fi

      - name: Run one frozen behavior across five attacks
        run: |
          set +e
          timeout 180m python scripts/run_programmatic_agentharm_development_behavior.py \
            --root . \
            --development-config \
              configs/programmatic_agentharm/llama31_development_sweep.json \
            --behavior-slug '${{ matrix.behavior }}' \
            --attack-source-csv "$ATTACK_SOURCE" \
            --safe-output "$SAFE_OUTPUT"
          behavior_exit=$?
          set -e
          echo "BEHAVIOR_EXIT=$behavior_exit" >> "$GITHUB_ENV"

      - name: Verify safe behavior boundary
        if: always()
        run: |
          test -f "$SAFE_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ['SAFE_OUTPUT']).read_text())
          forbidden = {
              'prompt', 'response', 'raw_output', 'tool_output',
              'generation', 'arguments'
          }

          def visit(node):
              if isinstance(node, dict):
                  leaked = forbidden.intersection(node)
                  if leaked:
                      raise SystemExit(f'unsafe artifact keys: {sorted(leaked)}')
                  for child in node.values():
                      visit(child)
              elif isinstance(node, list):
                  for child in node:
                      visit(child)

          visit(value)
          assert value['paper_validity'] is False
          assert value['development_only'] is True
          assert value['behavior']['slug'] == '${{ matrix.behavior }}'
          assert value['source_split_consumed'] == 'confirmatory'
          assert value['future_confirmatory_use_forbidden'] is True
          assert value['human_judge_used'] is False
          assert value['llm_judge_used'] is False
          assert value['assistant_free_text_scored'] is False
          assert value['raw_prompts_committed'] is False
          assert value['raw_responses_committed'] is False
          assert value['raw_tool_arguments_committed'] is False
          assert value['raw_tool_responses_committed'] is False
          assert value['confirmatory_outputs_observed'] is False
          assert value['final_outputs_observed'] is False
          assert value['causal_oracle_opened'] is False
          assert value['wavelet_used'] is False
          PY

      - name: Upload safe behavior artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: programmatic-agentharm-llama31-${{ matrix.behavior }}-safe
          path: ${{ env.SAFE_OUTPUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local target
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/llama-server/pid" ]; then
            kill "$(cat "$RUNNER_TEMP/llama-server/pid")" 2>/dev/null || true
          fi

      - name: Enforce operational completeness
        if: always()
        run: exit "${BEHAVIOR_EXIT:-1}"

  aggregate:
    needs:
      - validate
      - sweep
    if: always()
    runs-on: ubuntu-24.04
    env:
      INPUTS_DIR: artifacts/programmatic-agentharm-llama31-inputs
      SAFE_OUTPUT: artifacts/programmatic-agentharm-llama31-aggregate/safe_summary.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install aggregate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Download all safe behavior artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: programmatic-agentharm-llama31-*-safe
          path: ${{ env.INPUTS_DIR }}

      - name: Aggregate deterministic outcomes
        run: |
          set +e
          python scripts/aggregate_programmatic_agentharm_development_sweep.py \
            --development-config \
              configs/programmatic_agentharm/llama31_development_sweep.json \
            --inputs-dir "$INPUTS_DIR" \
            --safe-output "$SAFE_OUTPUT"
          aggregate_exit=$?
          set -e
          echo "AGGREGATE_EXIT=$aggregate_exit" >> "$GITHUB_ENV"

      - name: Bind result to frozen model and decision rule
        if: always()
        run: |
          test -f "$SAFE_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output_path = Path(os.environ['SAFE_OUTPUT'])
          value = json.loads(output_path.read_text())
          runtime = json.loads(
              Path('configs/programmatic_agentharm/llama31_runtime.json').read_text()
          )
          development = json.loads(
              Path(
                  'configs/programmatic_agentharm/llama31_development_sweep.json'
              ).read_text()
          )
          target = runtime['target']
          decisions = development['second_model_decision']
          next_by_signal = {
              'BROAD_ELIGIBLE_ATTACK_SIGNAL': decisions['broad_signal_next_operation'],
              'SPARSE_ELIGIBLE_ATTACK_SIGNAL': decisions['sparse_signal_next_operation'],
              'NO_ELIGIBLE_ATTACK_SIGNAL_ACROSS_DEVELOPMENT': decisions['no_signal_next_operation'],
              'DEVELOPMENT_SWEEP_RUNTIME_UNRESOLVED': decisions['runtime_unresolved_next_operation'],
          }
          value['next_operation'] = next_by_signal[value['scientific_signal']]
          value['second_model_test'] = True
          value['model'] = {
              'upstream_model_id': target['upstream_model_id'],
              'gguf_repo_id': target['gguf_repo_id'],
              'gguf_revision': target['gguf_revision'],
              'gguf_filename': target['gguf_files'][0]['filename'],
              'gguf_sha256': target['gguf_files'][0]['sha256'],
              'gguf_size': target['gguf_files'][0]['size'],
              'gguf_selector': target['gguf_selector'],
              'server_alias': target['server_alias'],
              'system_prompt_template': runtime['agentharm']['system_prompt_template'],
              'seed': runtime['generation']['seed'],
          }
          value['qwen_trigger'] = {
              'run_id': development['provenance']['qwen_development_run_id'],
              'head_sha': development['provenance']['qwen_development_head_sha'],
              'aggregate_artifact_digest': development['provenance']['qwen_aggregate_artifact_digest'],
              'eligible_behavior_count': development['provenance']['qwen_eligible_behavior_count'],
          }
          output_path.write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(value, indent=2, sort_keys=True))
          PY

      - name: Verify aggregate identity and safety
        if: always()
        run: |
          test -f "$SAFE_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ['SAFE_OUTPUT']).read_text())
          assert value['paper_validity'] is False
          assert value['development_only'] is True
          assert value['second_model_test'] is True
          assert value['model']['gguf_revision'] == \
              '4f0c246f125fc7594238ebe7beb1435a8335f519'
          assert value['model']['gguf_sha256'] == \
              '7b064f5842bf9532c91456deda288a1b672397a54fa729aa665952863033557c'
          assert value['model']['system_prompt_template'] == 'llama-3.1'
          assert value['human_judge_used'] is False
          assert value['llm_judge_used'] is False
          assert value['assistant_free_text_scored'] is False
          assert value['confirmatory_outputs_observed'] is False
          assert value['final_outputs_observed'] is False
          assert value['causal_oracle_opened'] is False
          assert value['wavelet_used'] is False
          PY

      - name: Publish final feasibility decision
        if: always()
        run: |
          if [ -f "$SAFE_OUTPUT" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ['SAFE_OUTPUT']).read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as handle:
              handle.write('# Llama 3.1 second-model feasibility decision\n\n')
              handle.write(f"- status: **{value['status']}**\n")
              handle.write(f"- scientific signal: **{value['scientific_signal']}**\n")
              handle.write(
                  f"- completed behaviors: **{value['completed_behavior_count']}/"
                  f"{value['expected_behavior_count']}**\n"
              )
              handle.write(
                  f"- eligible behaviors: **{value['eligible_behavior_count']}**\n"
              )
              handle.write(
                  '- distinct successful attacks: '
                  f"**{value['distinct_successful_candidate_count']}**\n"
              )
              handle.write(f"- next operation: **{value['next_operation']}**\n")
              handle.write('- paper-valid result: **false**\n')
          PY
          else
            echo 'Aggregate output was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload safe aggregate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: programmatic-agentharm-llama31-aggregate-safe
          path: ${{ env.SAFE_OUTPUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce aggregate completeness
        if: always()
        run: exit "${AGGREGATE_EXIT:-1}"
