name: temporary-freeze-e1c-harmbench-live-contract

# One-shot static materialization. No model weights or inference.
"on":
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_freeze_e1c_harmbench_live_contract.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-freeze-e1c-harmbench-live-contract
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: agent/programmatic-agentharm-pivot
      HARM_BENCH_REVISION: 8e1604d1171fe8a48d8febecd22f600e462bdcdd
      SOURCE_ROOT: upstream/HarmBench
      BUNDLE_PATH: .agent/e1c_live_contract_nonworkflow.tgz
      BUNDLE_SHA256: da2b6e8beb13fab43bb0b35c1fef2bebc41e70d0f6cea35a9460248ee9f2bf15
      CONTRACT: configs/natural_language_localization/evaluator_panel_e1c_harmbench_live_contract_v1.json
      SAFE_DIR: artifacts/evaluator-panel-e1c-harmbench-live-contract/safe
      SAFE_RESULT: artifacts/evaluator-panel-e1c-harmbench-live-contract/safe/e1c_harmbench_live_contract.safe.json
      RECORD_RESULT: data/natural_language_localization/evaluator_panel_v1/e1c_harmbench_live_contract.safe.json
      RUN_RECORD: data/natural_language_localization/evaluator_panel_v1/e1c_harmbench_live_contract_run.safe.json
      PIP_NO_CACHE_DIR: "1"

    steps:
      - name: Check out current research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Check out immutable HarmBench source
        uses: actions/checkout@v4
        with:
          repository: centerforaisafety/HarmBench
          ref: ${{ env.HARM_BENCH_REVISION }}
          path: ${{ env.SOURCE_ROOT }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify and extract frozen contract bundle
        run: |
          set -euo pipefail
          test -f "$BUNDLE_PATH"
          test "$(sha256sum "$BUNDLE_PATH" | cut -d' ' -f1)" = "$BUNDLE_SHA256"
          tar -tzf "$BUNDLE_PATH" >/dev/null
          tar -xzf "$BUNDLE_PATH" -C .

      - name: Validate frozen implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8.2' 'ruff>=0.6'
          ruff check \
            scripts/run_evaluator_panel_e1c_harmbench_live_contract_freeze.py \
            tests/test_evaluator_panel_e1c_harmbench_live_contract_freeze.py
          python -m pytest -q \
            tests/test_evaluator_panel_e1c_harmbench_live_contract_freeze.py
          python -m json.tool "$CONTRACT" >/dev/null
          git diff --check

      - name: Verify immutable upstream checkout
        run: |
          test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = "$HARM_BENCH_REVISION"

      - name: Materialize thresholds and request identities
        id: freeze
        shell: bash
        run: |
          mkdir -p "$SAFE_DIR"
          set +e
          python scripts/run_evaluator_panel_e1c_harmbench_live_contract_freeze.py \
            --root . \
            --source-root "$SOURCE_ROOT" \
            --config "$CONTRACT" \
            --safe-output "$SAFE_RESULT"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -f "$SAFE_RESULT"

      - name: Audit safe result and sealed boundary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["SAFE_RESULT"])
          result = json.loads(path.read_text(encoding="utf-8"))
          assert result["paper_validity"] is False
          assert result["model_weight_downloaded"] is False
          assert result["model_inference_performed"] is False
          assert result["harmbench_live_predictions_generated"] is False
          assert result["new_harmful_attack_outputs_generated"] is False
          assert result["semantic_only_stage_a_opened"] is False
          assert result["cross_regime_stage_a_opened"] is False
          assert result["prior_evaluation_opened"] is False
          assert result["heldout_opened"] is False
          assert result["causal_oracle_opened"] is False
          assert result["keep_only_oracle_opened"] is False
          assert result["wavelet_used"] is False
          if result["operational_pass"] is True:
              assert result["status"] == (
                  "E1C_HARMBENCH_LIVE_CONTRACT_FREEZE_PASS"
              )
              assert result["next_authorized_operation"] == (
                  "EXECUTE_E1C_HARMBENCH_LIVE_REPRODUCTION_AND_"
                  "INJECTION_CANARIES"
              )
          serialized = path.read_text(encoding="utf-8").lower()
          for forbidden in (
              '"test_case"',
              '"generation_private"',
              '"behavior_private"',
              '"context_private"',
              '"rendered_prompt"',
          ):
              assert forbidden not in serialized
          PY

      - name: Upload safe contract artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-panel-e1c-harmbench-live-contract-safe
          path: ${{ env.SAFE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit non-workflow contract files and safe result
        if: always()
        run: |
          mkdir -p "$(dirname "$RECORD_RESULT")"
          cp "$SAFE_RESULT" "$RECORD_RESULT"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RECORD_RESULT"])
          result = json.loads(result_path.read_text(encoding="utf-8"))
          record = {
              "schema_version": "e1c-harmbench-live-contract-run-safe-v1",
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "head_sha_at_start": os.environ["GITHUB_SHA"],
              "status": result["status"],
              "operational_pass": result["operational_pass"],
              "result_sha256": hashlib.sha256(result_path.read_bytes()).hexdigest(),
              "model_weight_downloaded": False,
              "model_inference_performed": False,
              "harmbench_live_predictions_generated": False,
              "new_harmful_attack_outputs_generated": False,
              "stage_a_opened": False,
              "causal_oracle_opened": False,
              "wavelet_used": False,
          }
          Path(os.environ["RUN_RECORD"]).write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git rm "$BUNDLE_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            configs/natural_language_localization/evaluator_panel_e1c_harmbench_live_contract_v1.json \
            scripts/run_evaluator_panel_e1c_harmbench_live_contract_freeze.py \
            tests/test_evaluator_panel_e1c_harmbench_live_contract_freeze.py \
            docs/EVALUATOR_PANEL_E1C_HARMBENCH_LIVE_CONTRACT_V1.md \
            "$RECORD_RESULT" \
            "$RUN_RECORD"
          git commit -m "Freeze E1C HarmBench live qualification contract"

          git fetch origin "$TARGET_BRANCH"
          panel_dir=data/natural_language_localization/evaluator_panel_v1
          frozen_inputs=(
            "$panel_dir/e1c_prompt_source_freeze_v3.safe.json"
            "$panel_dir/e1c_harmbench_prompt_manifest_v3.safe.jsonl"
            "$panel_dir/e1c_harmbench_selection_v2.safe.jsonl"
          )
          if ! git diff --quiet "$GITHUB_SHA" "origin/$TARGET_BRANCH" -- \
            "${frozen_inputs[@]}"; then
            echo "Frozen predecessor changed while contract was computed." >&2
            exit 1
          fi
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Enforce static contract gate
        if: always()
        run: |
          test "${{ steps.freeze.outputs.exit_code }}" = "0"
