name: temporary-record-e1c-prompt-source-rerun

on:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_record_e1c_prompt_source_rerun.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: temporary-record-e1c-prompt-source-rerun
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_WORKFLOW: evaluator_panel_e1c_prompt_source_freeze.yml
      TARGET_HEAD_SHA: c5c9cb57a4bbf3c690b21c1609f36249e61c39aa
      TARGET_BRANCH: agent/programmatic-agentharm-pivot
      OUTPUT: data/natural_language_localization/evaluator_panel_v1/e1c_prompt_source_freeze_run.safe.json
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/programmatic-agentharm-pivot
          fetch-depth: 0

      - name: Locate retriggered prompt-source freeze run
        run: |
          mkdir -p "$(dirname "$OUTPUT")"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs" \
            -f branch="$TARGET_BRANCH" \
            -f event=push \
            -f per_page=30 \
            > "$RUNNER_TEMP/e1c-prompt-source-runs.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "e1c-prompt-source-runs.json").read_text(
                  encoding="utf-8"
              )
          )
          target_sha = os.environ["TARGET_HEAD_SHA"]
          selected = next(
              (
                  run
                  for run in source.get("workflow_runs", [])
                  if run.get("head_sha") == target_sha
              ),
              None,
          )
          if selected is None:
              raise SystemExit(f"prompt-source rerun not found for {target_sha}")
          safe = {
              "schema_version": "evaluator-panel-e1c-prompt-source-run-safe-v1",
              "workflow": selected.get("name"),
              "workflow_id": selected.get("workflow_id"),
              "run_id": selected.get("id"),
              "run_number": selected.get("run_number"),
              "event": selected.get("event"),
              "status_at_record": selected.get("status"),
              "conclusion_at_record": selected.get("conclusion"),
              "head_branch": selected.get("head_branch"),
              "head_sha": selected.get("head_sha"),
              "created_at": selected.get("created_at"),
              "updated_at": selected.get("updated_at"),
              "html_url": selected.get("html_url"),
              "paper_validity": False,
              "model_weight_downloaded_by_probe": False,
              "model_inference_performed_by_probe": False,
          }
          Path(os.environ["OUTPUT"]).write_text(
              json.dumps(safe, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(safe, sort_keys=True))
          PY

      - name: Commit identity and remove one-shot workflow
        run: |
          git rm .github/workflows/_temporary_record_e1c_prompt_source_rerun.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT"
          git commit -m "Record retriggered E1C prompt-source run identity"
          git push origin HEAD:agent/programmatic-agentharm-pivot
