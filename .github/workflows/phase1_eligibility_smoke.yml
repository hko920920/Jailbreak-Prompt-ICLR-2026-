name: phase1-eligibility-smoke

on:
  push:
    branches:
      - agent/phase1-core-experiment-prep
    paths:
      - .github/workflows/phase1_eligibility_smoke.yml
      - scripts/run_phase1_eligibility_smoke.py
      - configs/phase1_eligibility_smoke_cpu.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eligibility-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HOME: ${{ runner.temp }}/huggingface
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_NO_ADVISORY_WARNINGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and Hugging Face dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,hf]'
      - name: Assemble pinned 20-example development set
        run: python scripts/assemble_phase1_jbb_micro_pilot.py
      - name: Run CPU eligibility smoke
        run: |
          python scripts/run_phase1_eligibility_smoke.py \
            --config configs/phase1_eligibility_smoke_cpu.json
      - name: Print safe summary
        run: cat artifacts/phase1-eligibility-smoke-qwen15b-cpu-v1/summary.json
      - name: Upload private audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-eligibility-smoke-qwen15b-cpu-private
          path: |
            artifacts/phase1-eligibility-smoke-qwen15b-cpu-v1/summary.json
            artifacts/phase1-eligibility-smoke-qwen15b-cpu-v1/eligibility_audit.private.jsonl
          retention-days: 1
          if-no-files-found: error
