name: fix-step3-typing

on:
  push:
    branches:
      - agent/gate1-contract
    paths:
      - scripts/fix_step3_typing.py
      - .github/workflows/fix_step3_typing.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate1-contract
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply deterministic typing repair
        run: python scripts/fix_step3_typing.py

      - name: Validate repaired tree
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,step3]'
          ruff check .
          mypy src/jbspan
          pytest
          git diff --check

      - name: Commit repaired sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/jbspan/gate1/step3.py src/jbspan/adapters/hf.py
          if git diff --cached --quiet; then
            echo "No repair changes required"
          else
            git commit -m "Repair Gate 1 Step 3 strict typing [skip ci]"
            git push origin HEAD:agent/gate1-contract
          fi
