name: cancel-stale-research-workflows

on:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/cancel_stale_research_workflows.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-stale-research-workflows
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel superseded terminal-path runs
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_BRANCH: agent/programmatic-agentharm-pivot
        run: |
          set -euo pipefail
          runs_json="$(
            gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${ACTIVE_BRANCH}&per_page=100"
          )"

          mapfile -t stale_ids < <(
            jq -r --argjson current "${GITHUB_RUN_ID}" '
              .workflow_runs[]
              | select(.id != $current)
              | select(.status == "queued" or
                       .status == "in_progress" or
                       .status == "pending" or
                       .status == "waiting" or
                       .status == "requested")
              | select(
                  .name == "programmatic-agentharm-runtime-smoke" or
                  .name == "programmatic-agentharm-candidate-sweep" or
                  .name == "programmatic-agentharm-development-behavior-sweep" or
                  .name == "programmatic-agentharm-copyright-diagnostic" or
                  .name == "programmatic-agentharm-llama31-second-model" or
                  .name == "natural-language-calibration-packet" or
                  .name == "evaluator-panel-e1a-static-hardening"
                )
              | .id
            ' <<<"$runs_json"
          )

          printf 'stale run count: %s\n' "${#stale_ids[@]}"
          for run_id in "${stale_ids[@]}"; do
            echo "cancelling run ${run_id}"
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
              >/dev/null || true
          done

          echo 'E1B, CI, and this cleanup workflow were intentionally preserved.'
