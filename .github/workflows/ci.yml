name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src/jbspan
      - run: pytest
      - name: Validate frozen Automated Gate 1 contract
        if: matrix.python-version == '3.11'
        run: python scripts/validate_gate1_contract.py
      - name: Validate natural-language localization feasibility contract
        if: matrix.python-version == '3.11'
        run: python scripts/validate_natural_language_feasibility.py
      - name: Report safe Gate 1 contract identity
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("artifacts/gate1-contract/contract_manifest.json").read_text()
          )
          print(
              "::notice title=Automated Gate 1 contract::"
              f"status={manifest['status']}; "
              f"payloads={manifest['selected_payload_target']}; "
              f"primitives={manifest['primary_primitive_count']}; "
              f"families={manifest['primary_family_count']}; "
              f"neutralizers={manifest['primary_neutralizer_count']}; "
              f"projected_attacks={manifest['projected_gate1_attack_count']}; "
              f"contract_sha256={manifest['contract_sha256']}"
          )
          PY
      - name: Assemble pinned Phase 1 micro-pilot
        if: matrix.python-version == '3.11'
        run: python scripts/assemble_phase1_jbb_micro_pilot.py
      - name: Run Phase 1 validation-only path
        if: matrix.python-version == '3.11'
        run: >-
          python scripts/run_phase1_micro_pilot.py
          --config configs/phase1_micro_pilot.json
          --validate-only
      - name: Report safe Phase 1 manifest hashes
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          selection = json.loads(
              Path("data/manifests/phase1_micro_pilot_20.selection.json").read_text()
          )
          validated = json.loads(
              Path("artifacts/phase1-micro-pilot-v1/data_manifest.json").read_text()
          )
          print(
              "::notice title=Phase 1 data validation::"
              f"examples={validated['example_count']}; "
              f"families={validated['attack_family_counts']}; "
              f"source_sha256={validated['source_sha256']}; "
              f"ids_sha256={validated['ids_sha256']}; "
              f"selection_output_sha256={selection['output_sha256']}"
          )
          PY

  e1c-source-v3-one-shot:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/agent/programmatic-agentharm-pivot' &&
      github.event.head_commit.message == 'Carry E1C source-v3 through registered CI'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_BRANCH: agent/programmatic-agentharm-pivot
      HARM_BENCH_REVISION: 8e1604d1171fe8a48d8febecd22f600e462bdcdd
      SOURCE_ROOT: upstream/HarmBench
      CONFIG: configs/natural_language_localization/evaluator_panel_e1c_prompt_source_freeze_v3.json
      SAFE_DIR: artifacts/e1c-prompt-source-v3/safe
      SAFE_RESULT: artifacts/e1c-prompt-source-v3/safe/e1c_prompt_source_freeze_v3.safe.json
      RECORD_RESULT: >-
        data/natural_language_localization/evaluator_panel_v1/e1c_prompt_source_freeze_v3.safe.json
      RUN_RECORD: >-
        data/natural_language_localization/evaluator_panel_v1/e1c_prompt_source_freeze_v3_run.safe.json
      BUNDLE_PATH: .agent/e1c_source_v3_bundle.tgz
      BUNDLE_SHA256: 013362a1e402386dc773d32eaf29f879e84b9358bd59e742dc8ba28d8eb8ae33
      PIP_NO_CACHE_DIR: "1"

    steps:
      - name: Check out current research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Check out immutable HarmBench source
        uses: actions/checkout@v4
        with:
          repository: centerforaisafety/HarmBench
          ref: ${{ env.HARM_BENCH_REVISION }}
          path: ${{ env.SOURCE_ROOT }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract staged source-v3 bundle
        run: |
          test -f "$BUNDLE_PATH"
          test "$(sha256sum "$BUNDLE_PATH" | cut -d' ' -f1)" = "$BUNDLE_SHA256"
          tar -xzf "$BUNDLE_PATH" -C .

      - name: Validate frozen implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8.2' 'ruff>=0.6'
          ruff check \
            scripts/run_evaluator_panel_e1c_prompt_source_freeze_v3.py \
            tests/test_evaluator_panel_e1c_prompt_source_freeze_v3.py
          python -m pytest -q tests/test_evaluator_panel_e1c_prompt_source_freeze_v3.py
          python -m json.tool "$CONFIG" >/dev/null
          git diff --check

      - name: Verify immutable upstream checkout
        run: |
          test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = "$HARM_BENCH_REVISION"

      - name: Execute static prompt-source v3 freeze
        run: |
          mkdir -p "$SAFE_DIR"
          python scripts/run_evaluator_panel_e1c_prompt_source_freeze_v3.py \
            --root . \
            --source-root "$SOURCE_ROOT" \
            --config "$CONFIG" \
            --safe-output "$SAFE_RESULT"

      - name: Audit pass and sealed boundaries
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["SAFE_RESULT"])
          result = json.loads(path.read_text(encoding="utf-8"))
          assert result["status"] == "E1C_PROMPT_SOURCE_FREEZE_V3_PASS"
          assert result["operational_pass"] is True
          selection = result["repaired_selection"]
          assert selection["record_count"] == 200
          assert selection["label_counts"] == {"0": 100, "1": 100}
          assert selection["behavior_count"] == 166
          assert selection["reconstruction_missing_count"] == 0
          assert selection["reconstruction_mismatch_count"] == 0
          assert selection["registry_unresolved_count"] == 0
          assert selection["registry_unusable_count"] == 0
          assert result["production_prompt"]["canonical_family_sha256"] == (
              "3dea5cd9ab408e5fc39ae6a0614eeb9441dee552a5e52224d064d0a3b66d4d65"
          )
          assert result["model_weight_downloaded"] is False
          assert result["model_inference_performed"] is False
          assert result["harmbench_live_predictions_generated"] is False
          assert result["new_harmful_attack_outputs_generated"] is False
          assert result["semantic_only_stage_a_opened"] is False
          assert result["cross_regime_stage_a_opened"] is False
          assert result["causal_oracle_opened"] is False
          assert result["keep_only_oracle_opened"] is False
          assert result["wavelet_used"] is False
          assert result["next_authorized_operation"] == (
              "FREEZE_E1C_HARMBENCH_LIVE_REPRODUCTION_AND_CANARY_CONTRACT_"
              "WITH_REPAIRED_SELECTION"
          )
          serialized = path.read_text(encoding="utf-8").lower()
          for forbidden in (
              '"test_case"',
              '"generation"',
              '"behavior_id_private"',
              '"behavior_text"',
              '"prompt_text"',
          ):
              assert forbidden not in serialized
          PY

      - name: Upload safe source-v3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-panel-e1c-prompt-source-freeze-v3-safe
          path: ${{ env.SAFE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified source-v3 contract and restore CI
        run: |
          mkdir -p "$(dirname "$RECORD_RESULT")"
          cp "$SAFE_RESULT" "$RECORD_RESULT"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RECORD_RESULT"])
          record = {
              "schema_version": "evaluator-panel-e1c-prompt-source-v3-run-safe-v1",
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "job": "e1c-source-v3-one-shot",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "head_sha_at_start": os.environ["GITHUB_SHA"],
              "result_sha256": hashlib.sha256(result_path.read_bytes()).hexdigest(),
              "conclusion_at_record": "success",
              "paper_validity": False,
              "model_weight_downloaded": False,
              "model_inference_performed": False,
              "harmbench_live_predictions_generated": False,
              "new_harmful_attack_outputs_generated": False,
              "stage_a_opened": False,
              "causal_oracle_opened": False,
              "wavelet_used": False,
          }
          Path(os.environ["RUN_RECORD"]).write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat > .github/workflows/ci.yml <<'ORIGINAL_CI'
          name: ci
          
          on:
            push:
            pull_request:
          
          jobs:
            test:
              runs-on: ubuntu-latest
              strategy:
                matrix:
                  python-version: ["3.10", "3.11"]
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: ${{ matrix.python-version }}
                    cache: pip
                - run: python -m pip install --upgrade pip
                - run: python -m pip install -e '.[dev]'
                - run: ruff check .
                - run: mypy src/jbspan
                - run: pytest
                - name: Validate frozen Automated Gate 1 contract
                  if: matrix.python-version == '3.11'
                  run: python scripts/validate_gate1_contract.py
                - name: Validate natural-language localization feasibility contract
                  if: matrix.python-version == '3.11'
                  run: python scripts/validate_natural_language_feasibility.py
                - name: Report safe Gate 1 contract identity
                  if: matrix.python-version == '3.11'
                  run: |
                    python - <<'PY'
                    import json
                    from pathlib import Path
          
                    manifest = json.loads(
                        Path("artifacts/gate1-contract/contract_manifest.json").read_text()
                    )
                    print(
                        "::notice title=Automated Gate 1 contract::"
                        f"status={manifest['status']}; "
                        f"payloads={manifest['selected_payload_target']}; "
                        f"primitives={manifest['primary_primitive_count']}; "
                        f"families={manifest['primary_family_count']}; "
                        f"neutralizers={manifest['primary_neutralizer_count']}; "
                        f"projected_attacks={manifest['projected_gate1_attack_count']}; "
                        f"contract_sha256={manifest['contract_sha256']}"
                    )
                    PY
                - name: Assemble pinned Phase 1 micro-pilot
                  if: matrix.python-version == '3.11'
                  run: python scripts/assemble_phase1_jbb_micro_pilot.py
                - name: Run Phase 1 validation-only path
                  if: matrix.python-version == '3.11'
                  run: >-
                    python scripts/run_phase1_micro_pilot.py
                    --config configs/phase1_micro_pilot.json
                    --validate-only
                - name: Report safe Phase 1 manifest hashes
                  if: matrix.python-version == '3.11'
                  run: |
                    python - <<'PY'
                    import json
                    from pathlib import Path
          
                    selection = json.loads(
                        Path("data/manifests/phase1_micro_pilot_20.selection.json").read_text()
                    )
                    validated = json.loads(
                        Path("artifacts/phase1-micro-pilot-v1/data_manifest.json").read_text()
                    )
                    print(
                        "::notice title=Phase 1 data validation::"
                        f"examples={validated['example_count']}; "
                        f"families={validated['attack_family_counts']}; "
                        f"source_sha256={validated['source_sha256']}; "
                        f"ids_sha256={validated['ids_sha256']}; "
                        f"selection_output_sha256={selection['output_sha256']}"
                    )
                    PY
          ORIGINAL_CI
          git rm --ignore-unmatch \
            .github/workflows/_temporary_apply_e1c_prompt_source_v3.yml \
            .github/workflows/_temporary_apply_e1c_prompt_source_v3_retry.yml \
            "$BUNDLE_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/evaluator_panel_e1c_prompt_source_freeze_v3.yml \
            configs/natural_language_localization/evaluator_panel_e1c_prompt_source_freeze_v3.json \
            scripts/run_evaluator_panel_e1c_prompt_source_freeze_v3.py \
            tests/test_evaluator_panel_e1c_prompt_source_freeze_v3.py \
            docs/EVALUATOR_PANEL_E1C_PROMPT_SOURCE_FREEZE_V3.md \
            "$RECORD_RESULT" \
            "$RUN_RECORD"
          git commit -m "Freeze E1C HarmBench prompt source v3"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
