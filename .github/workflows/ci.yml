name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src/jbspan
      - run: pytest
      - name: Validate frozen Automated Gate 1 contract
        if: matrix.python-version == '3.11'
        run: python scripts/validate_gate1_contract.py
      - name: Validate natural-language localization feasibility contract
        if: matrix.python-version == '3.11'
        run: python scripts/validate_natural_language_feasibility.py
      - name: Report safe Gate 1 contract identity
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("artifacts/gate1-contract/contract_manifest.json").read_text()
          )
          print(
              "::notice title=Automated Gate 1 contract::"
              f"status={manifest['status']}; "
              f"payloads={manifest['selected_payload_target']}; "
              f"primitives={manifest['primary_primitive_count']}; "
              f"families={manifest['primary_family_count']}; "
              f"neutralizers={manifest['primary_neutralizer_count']}; "
              f"projected_attacks={manifest['projected_gate1_attack_count']}; "
              f"contract_sha256={manifest['contract_sha256']}"
          )
          PY
      - name: Assemble pinned Phase 1 micro-pilot
        if: matrix.python-version == '3.11'
        run: python scripts/assemble_phase1_jbb_micro_pilot.py
      - name: Run Phase 1 validation-only path
        if: matrix.python-version == '3.11'
        run: >-
          python scripts/run_phase1_micro_pilot.py
          --config configs/phase1_micro_pilot.json
          --validate-only
      - name: Report safe Phase 1 manifest hashes
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          selection = json.loads(
              Path("data/manifests/phase1_micro_pilot_20.selection.json").read_text()
          )
          validated = json.loads(
              Path("artifacts/phase1-micro-pilot-v1/data_manifest.json").read_text()
          )
          print(
              "::notice title=Phase 1 data validation::"
              f"examples={validated['example_count']}; "
              f"families={validated['attack_family_counts']}; "
              f"source_sha256={validated['source_sha256']}; "
              f"ids_sha256={validated['ids_sha256']}; "
              f"selection_output_sha256={selection['output_sha256']}"
          )
          PY

  verifiable-agent-screen:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/gate1-contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      MODEL_REF: Qwen/Qwen2.5-7B-Instruct-GGUF:Q4_K_M
      CONFIG: configs/gate1/gate1_verifiable_agent_screen.json
      SCREEN_OUTPUT: artifacts/gate1-verifiable-agent-screen/screen.json
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate1-contract
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Materialize pinned screen runtime bundle
        run: |
          test "$(sha256sum data/gate1/verifiable_agent_screen_runtime.zip | cut -d' ' -f1)" = \
            "7e9eddd22ca49a9f33369ba26d0fec4d42ac74fd6b603440b5ea98c7f74a373d"
          unzip -q data/gate1/verifiable_agent_screen_runtime.zip -d .

      - name: Validate frozen screen implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check \
            src/jbspan/gate1/verifiable_agent.py \
            scripts/run_verifiable_agent_screen.py \
            tests/test_verifiable_agent_screen.py
          mypy src/jbspan
          pytest tests/test_verifiable_agent_screen.py
          python -m json.tool "$CONFIG" >/dev/null
          git diff --check

      - name: Install official llama.cpp runtime
        run: |
          curl -LsSf https://llama.app/install.sh | \
            SKIP_CUDA=1 SKIP_ROCM=1 SKIP_VULKAN=1 sh
          ~/.llama-app/llama --version

      - name: Start Qwen2.5-7B-Instruct sandbox model
        run: |
          export HF_HOME="$RUNNER_TEMP/huggingface"
          mkdir -p "$HF_HOME" "$RUNNER_TEMP/llama-server"
          nohup ~/.llama-app/llama serve \
            -hf "$MODEL_REF" \
            --host 127.0.0.1 \
            --port 8080 \
            -c 6144 \
            -t 4 \
            >"$RUNNER_TEMP/llama-server/server.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/llama-server/pid"

          ready=0
          for _ in $(seq 1 180); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/llama-server/pid")" 2>/dev/null; then
              tail -n 100 "$RUNNER_TEMP/llama-server/server.log"
              exit 1
            fi
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8080/health || true)"
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = "1"

      - name: Run calibration and untouched confirmatory only
        run: |
          mkdir -p "$(dirname "$SCREEN_OUTPUT")"
          timeout 300m python scripts/run_verifiable_agent_screen.py \
            --config "$CONFIG" \
            --server-url http://127.0.0.1:8080 \
            --output "$SCREEN_OUTPUT"
          test "$(jq -r '.final_partition_observed' "$SCREEN_OUTPUT")" = "false"
          test "$(jq -r '.design.final_model_call_count' "$SCREEN_OUTPUT")" = "0"

      - name: Publish safe screen summary
        if: always()
        run: |
          if [ -f "$SCREEN_OUTPUT" ]; then
            {
              echo '# Verifiable-agent Gate 1 screen'
              echo
              echo "- status: **$(jq -r '.status' "$SCREEN_OUTPUT")**"
              echo "- selected programs: **$(jq -c '.selected_programs' "$SCREEN_OUTPUT")**"
              echo "- confirmatory eligible: **$(jq -r '.confirmatory_summary.eligible_count' "$SCREEN_OUTPUT") / 15**"
              echo "- eligible programs: **$(jq -c '.confirmatory_summary.eligible_programs' "$SCREEN_OUTPUT")**"
              echo "- baseline utility: **$(jq -r '.confirmatory_summary.baseline_utility_count' "$SCREEN_OUTPUT") / 15**"
              echo "- payload-only safe utility: **$(jq -r '.confirmatory_summary.payload_only_safe_utility_count' "$SCREEN_OUTPUT") / 15**"
              echo "- parse coverage: **$(jq -r '.confirmatory_summary.parse_coverage' "$SCREEN_OUTPUT")**"
              echo "- model calls: **$(jq -r '.model_call_count' "$SCREEN_OUTPUT")**"
              echo '- final partition observed: **false**'
              echo '- human/LLM judge used: **false**'
              echo '- real-world side effects: **false**'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload safe screen artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-verifiable-agent-screen
          path: ${{ env.SCREEN_OUTPUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local model server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/llama-server/pid" ]; then
            kill "$(cat "$RUNNER_TEMP/llama-server/pid")" 2>/dev/null || true
          fi
          rm -rf "$RUNNER_TEMP/huggingface"
