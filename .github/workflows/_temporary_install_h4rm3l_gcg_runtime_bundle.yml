name: temporary-install-h4rm3l-gcg-runtime-bundle

"on":
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_install_h4rm3l_gcg_runtime_bundle.yml

permissions:
  contents: write

concurrency:
  group: temporary-install-h4rm3l-gcg-runtime-bundle
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/programmatic-agentharm-pivot
  BUNDLE_SHA256: 8b61a85aebd186ea53d261e3d90b90e1dbfafd55d726b5bff589ffbac52de60a

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore validated runtime-bundle source
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import zlib
          from pathlib import Path

          encoded = ""
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          observed = hashlib.sha256(raw).hexdigest()
          if observed != os.environ["BUNDLE_SHA256"]:
              raise RuntimeError(f"bundle SHA mismatch: {observed}")
          files = json.loads(raw)
          expected = {
              ".github/workflows/h4rm3l_gcg_signal_screen_runtime_bundle.yml",
              "configs/natural_language_localization/"
              "h4rm3l_gcg_signal_screen_runtime_bundle_v1.json",
              "scripts/freeze_h4rm3l_gcg_signal_screen_runtime_bundle.py",
              "tests/test_h4rm3l_gcg_signal_screen_runtime_bundle.py",
              "docs/H4RM3L_GCG_SIGNAL_SCREEN_RUNTIME_BUNDLE_V1.md",
          }
          if set(files) != expected:
              raise RuntimeError("unexpected runtime-bundle membership")
          for relative in sorted(expected):
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(files[relative], encoding="utf-8")
          PY

      - name: Validate restored implementation
        run: |
          python -m pip install 'pytest>=8.2' 'ruff==0.16.4'
          targets=(
            scripts/freeze_h4rm3l_gcg_signal_screen_runtime_bundle.py
            tests/test_h4rm3l_gcg_signal_screen_runtime_bundle.py
          )
          ruff check "${targets[@]}"
          python -m pytest -q \
            tests/test_h4rm3l_gcg_signal_screen_runtime_bundle.py
          python -m py_compile \
            scripts/freeze_h4rm3l_gcg_signal_screen_runtime_bundle.py
          python -m json.tool \
            configs/natural_language_localization/h4rm3l_gcg_signal_screen_runtime_bundle_v1.json \
            >/dev/null
          git diff --check

      - name: Commit runtime-bundle implementation and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/h4rm3l_gcg_signal_screen_runtime_bundle.yml \
            configs/natural_language_localization/h4rm3l_gcg_signal_screen_runtime_bundle_v1.json \
            scripts/freeze_h4rm3l_gcg_signal_screen_runtime_bundle.py \
            tests/test_h4rm3l_gcg_signal_screen_runtime_bundle.py \
            docs/H4RM3L_GCG_SIGNAL_SCREEN_RUNTIME_BUNDLE_V1.md
          git rm .github/workflows/_temporary_install_h4rm3l_gcg_runtime_bundle.yml
          git commit -m "Freeze h4rm3l-GCG signal-screen runtime bundle"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
