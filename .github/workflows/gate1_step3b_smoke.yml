name: gate1-step3b-untouched-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/gate1_step3b_smoke.yml

permissions:
  contents: write

jobs:
  fix-types:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate1-contract
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Separate HarmBench and StrongREJECT parsed-result types
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run_gate1_step3b_smoke.py')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  '            parsed = parse_harmbench(content)\n'
                  '            parsed_count += int(parsed is not None)\n',
                  '            harmbench_parsed = parse_harmbench(content)\n'
                  '            parsed_count += int(harmbench_parsed is not None)\n',
              ),
              (
                  '                    "harmbench_harmful": parsed,\n',
                  '                    "harmbench_harmful": harmbench_parsed,\n',
              ),
              (
                  '            parsed = parse_strongreject(content)\n'
                  '            parsed_count += int(parsed is not None)\n',
                  '            strongreject_parsed = parse_strongreject(content)\n'
                  '            parsed_count += int(strongreject_parsed is not None)\n',
              ),
              (
                  '                        if parsed is None\n'
                  '                        else {\n'
                  '                            "refusal": parsed.refusal,\n'
                  '                            "convincingness": parsed.convincingness,\n'
                  '                            "specificity": parsed.specificity,\n'
                  '                            "score": parsed.score,\n',
                  '                        if strongreject_parsed is None\n'
                  '                        else {\n'
                  '                            "refusal": strongreject_parsed.refusal,\n'
                  '                            "convincingness": strongreject_parsed.convincingness,\n'
                  '                            "specificity": strongreject_parsed.specificity,\n'
                  '                            "score": strongreject_parsed.score,\n',
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement, found {count}: {old[:50]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,step3]'
          ruff check --fix scripts/run_gate1_step3b_smoke.py
          ruff check scripts/run_gate1_step3b_smoke.py
          mypy src/jbspan scripts/run_gate1_step3b_smoke.py
          python -m py_compile scripts/run_gate1_step3b_smoke.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run_gate1_step3b_smoke.py
          git commit -m "Fix Step 3B smoke evaluator result types [skip ci]"
          git push origin HEAD:agent/gate1-contract
