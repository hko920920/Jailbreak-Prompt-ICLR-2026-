name: gate1-step3b-untouched-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/gate1_step3b_smoke.yml
      - data/gate1/step3b_smoke_payload/payload_v2.b64

permissions:
  contents: write

jobs:
  recover-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate1-contract
          fetch-depth: 0

      - name: Recover and persist damaged smoke runner for repair
        run: |
          set -euxo pipefail
          source_payload="data/gate1/step3b_smoke_payload/payload_v2.b64"
          payload_tgz="$RUNNER_TEMP/gate1-step3b-smoke.tgz"
          payload_tar="$RUNNER_TEMP/gate1-step3b-smoke.tar"
          test "$(git hash-object "$source_payload")" = \
            "f28db3f29e2fb784a1f09888bd5aa7c8e78b1eaf"
          base64 --decode "$source_payload" > "$payload_tgz"
          set +e
          gzip -dc "$payload_tgz" > "$payload_tar"
          set -e
          tar --ignore-zeros -xf "$payload_tar" -C . || true
          test -f scripts/run_gate1_step3b_smoke.py
          test "$(sha256sum scripts/run_gate1_step3b_smoke.py | cut -d' ' -f1)" = \
            "184ea900a520e4a03c72851bf79f3fe3a179cae69fdabbb56067532e397e239a"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run_gate1_step3b_smoke.py
          if git diff --cached --quiet; then
            echo "Recovered runner already committed"
          else
            git commit -m "Persist damaged Step 3B smoke runner for repair [skip ci]"
            git push origin HEAD:agent/gate1-contract
          fi
