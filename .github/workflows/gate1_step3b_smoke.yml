name: gate1-step3b-untouched-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/gate1_step3b_smoke.yml

permissions:
  contents: write

jobs:
  format-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate1-contract
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply deterministic Ruff import fix
        run: |
          python -m pip install 'ruff>=0.16,<0.17'
          ruff check --fix scripts/run_gate1_step3b_smoke.py
          ruff check scripts/run_gate1_step3b_smoke.py
          python -m py_compile scripts/run_gate1_step3b_smoke.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run_gate1_step3b_smoke.py
          if git diff --cached --quiet; then
            echo "No formatting change required"
          else
            git commit -m "Format repaired Step 3B smoke runner [skip ci]"
            git push origin HEAD:agent/gate1-contract
          fi
