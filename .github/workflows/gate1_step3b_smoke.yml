name: gate1-step3b-untouched-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/gate1_step3b_smoke.yml
      - data/gate1/step3b_smoke_payload/payload_v2.b64

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate1-contract
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Materialize frozen untouched-smoke implementation
        run: |
          set -euxo pipefail
          source_payload="data/gate1/step3b_smoke_payload/payload_v2.b64"
          payload_tgz="$RUNNER_TEMP/gate1-step3b-smoke.tgz"
          payload_tar="$RUNNER_TEMP/gate1-step3b-smoke.tar"
          observed_blob="$(git hash-object "$source_payload")"
          echo "observed payload Git blob: $observed_blob"
          test "$observed_blob" = \
            "f28db3f29e2fb784a1f09888bd5aa7c8e78b1eaf"
          base64 --decode "$source_payload" > "$payload_tgz"

          # The published payload's gzip trailer is damaged, but gzip emits the
          # complete tar stream before reporting the trailer error. Treat the
          # tar container and the required extracted files—not the trailer—as
          # the integrity boundary, then pin their hashes in the job log.
          set +e
          gzip -dc "$payload_tgz" > "$payload_tar"
          gzip_status=$?
          set -e
          echo "gzip trailer status: $gzip_status"
          test -s "$payload_tar"
          tar -tf "$payload_tar" >/dev/null
          tar -xf "$payload_tar" -C .
          test -f scripts/run_gate1_step3b_smoke.py
          test -f scripts/run_gate1_step3b_smoke_workflow.sh
          test -f configs/gate1/gate1_step3b_smoke.json
          sha256sum \
            scripts/run_gate1_step3b_smoke.py \
            scripts/run_gate1_step3b_smoke_workflow.sh \
            configs/gate1/gate1_step3b_smoke.json
          chmod +x scripts/run_gate1_step3b_smoke_workflow.sh
          python -m py_compile scripts/run_gate1_step3b_smoke.py
          python -m json.tool \
            configs/gate1/gate1_step3b_smoke.json >/dev/null
          bash -n scripts/run_gate1_step3b_smoke_workflow.sh

      - name: Execute sealed untouched-smoke protocol
        run: bash scripts/run_gate1_step3b_smoke_workflow.sh

      - name: Upload safe untouched-smoke outputs
        uses: actions/upload-artifact@v4
        with:
          name: gate1-step3b-safe-untouched-smoke
          path: artifacts/gate1-step3b-smoke/safe
          if-no-files-found: error
          retention-days: 7
