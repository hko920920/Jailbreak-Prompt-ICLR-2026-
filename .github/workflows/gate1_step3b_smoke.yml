name: gate1-step3b-untouched-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/gate1_step3b_smoke.yml
      - scripts/run_gate1_step3b_smoke.py
      - configs/gate1/gate1_step3b_smoke.json
      - data/gate1/v2/calibration/selection_manifest.json
      - data/gate1/v2/calibration/calibration_summary.json

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PAYLOAD_SOURCE_REVISION: d8d87b8fdcb7806e3b4e45fffb2bc24aa6b17f32
      PAYLOAD_SOURCE_PATH: data/harmful-behaviors.csv
      ATTACK_SOURCE_REPOSITORY: mdoumbouya/h4rm3l
      ATTACK_SOURCE_REVISION: e6f58a1a1e56c1a95b26b06aa4fe393ee2240dbd
      ATTACK_SOURCE_PATH: experiments/experiment_116_bandi_synthesis/config/benchmark_reference_programs.csv
      ATTACK_SOURCE_SHA256: b4c07b11c9e92ecd332807e8ba32d8fe028b59f4c3499f72670d44105626ef07
      SAFE_OUTPUT: artifacts/gate1-step3b-smoke/safe
      PRIVATE_OUTPUT: /tmp/gate1-step3b-smoke/private
      TARGET_REF: Qwen/Qwen2.5-7B-Instruct-GGUF:Q4_K_M
      HARMBENCH_REF: RichardErkhov/cais_-_HarmBench-Mistral-7b-val-cls-gguf:Q4_K_M
      STRONGREJECT_JUDGE_REF: bartowski/Phi-3.5-mini-instruct-GGUF:Q4_K_M
      LLAMA_RELEASE_TAG: b10441
      LLAMA_RELEASE_COMMIT: 0177dcc7300bad8914bb838baabce87899812491
      LLAMA_ASSET: llama-b10441-bin-ubuntu-x64.tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate1-contract
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and validate untouched-smoke code
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,step3]'
          ruff check scripts/run_gate1_step3b_smoke.py
          mypy src/jbspan scripts/run_gate1_step3b_smoke.py
          pytest
          python -m json.tool \
            configs/gate1/gate1_step3b_smoke.json >/dev/null

      - name: Download immutable payload and attack sources
        run: |
          payload_csv="$RUNNER_TEMP/harmful-behaviors.csv"
          payload_url="https://huggingface.co/datasets/JailbreakBench/JBB-Behaviors/resolve/${PAYLOAD_SOURCE_REVISION}/${PAYLOAD_SOURCE_PATH}?download=true"
          curl --fail --location --silent --show-error \
            "$payload_url" --output "$payload_csv"
          test -s "$payload_csv"
          attack_csv="$RUNNER_TEMP/benchmark_reference_programs.csv"
          attack_url="https://raw.githubusercontent.com/${ATTACK_SOURCE_REPOSITORY}/${ATTACK_SOURCE_REVISION}/${ATTACK_SOURCE_PATH}"
          curl --fail --location --silent --show-error \
            "$attack_url" --output "$attack_csv"
          test -s "$attack_csv"
          test "$(sha256sum "$attack_csv" | cut -d' ' -f1)" = \
            "$ATTACK_SOURCE_SHA256"
          echo "PAYLOAD_SOURCE_CSV=$payload_csv" >> "$GITHUB_ENV"
          echo "ATTACK_SOURCE_CSV=$attack_csv" >> "$GITHUB_ENV"

      - name: Install exact llama.cpp release
        run: |
          release_json="$RUNNER_TEMP/llama-release.json"
          curl --fail --location --silent --show-error \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/${LLAMA_RELEASE_TAG}" \
            --output "$release_json"
          observed_commit="$(jq -r '.target_commitish' "$release_json")"
          test "$observed_commit" = "$LLAMA_RELEASE_COMMIT"
          asset_url="$(jq -r --arg name "$LLAMA_ASSET" '.assets[] | select(.name == $name) | .browser_download_url' "$release_json")"
          asset_digest="$(jq -r --arg name "$LLAMA_ASSET" '.assets[] | select(.name == $name) | .digest' "$release_json")"
          test -n "$asset_url"
          test "$asset_url" != "null"
          archive="$RUNNER_TEMP/$LLAMA_ASSET"
          curl --fail --location --silent --show-error \
            "$asset_url" --output "$archive"
          observed_digest="sha256:$(sha256sum "$archive" | cut -d' ' -f1)"
          test "$observed_digest" = "$asset_digest"
          mkdir -p "$RUNNER_TEMP/llama-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/llama-bin"
          llama_server="$(find "$RUNNER_TEMP/llama-bin" -type f -name llama-server | head -n1)"
          test -x "$llama_server"
          echo "LLAMA_SERVER=$llama_server" >> "$GITHUB_ENV"
          "$llama_server" --version

      - name: Prepare sealed untouched-smoke inputs
        run: |
          mkdir -p "$PRIVATE_OUTPUT" "$SAFE_OUTPUT"
          export HF_HOME="$RUNNER_TEMP/hf-prepare"
          python scripts/run_gate1_step3b_smoke.py prepare \
            --root . \
            --payload-source-csv "$PAYLOAD_SOURCE_CSV" \
            --attack-source-csv "$ATTACK_SOURCE_CSV" \
            --safe-output-dir "$SAFE_OUTPUT" \
            --private-output-dir "$PRIVATE_OUTPUT"
          rm -rf "$HF_HOME"

      - name: Generate Qwen target responses
        run: |
          export HF_HOME="$RUNNER_TEMP/hf-target"
          mkdir -p "$HF_HOME" "$RUNNER_TEMP/target-server"
          nohup "$LLAMA_SERVER" \
            -hf "$TARGET_REF" \
            --host 127.0.0.1 \
            --port 8080 \
            -c 4096 \
            -t 4 \
            >"$RUNNER_TEMP/target-server/server.log" 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 240); do
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -n 100 "$RUNNER_TEMP/target-server/server.log"
              exit 1
            fi
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health || true)"
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"
          timeout 120m python scripts/run_gate1_step3b_smoke.py target \
            --root . \
            --private-output-dir "$PRIVATE_OUTPUT" \
            --server-url http://127.0.0.1:8080
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          rm -rf "$HF_HOME"

      - name: Evaluate with HarmBench smoke surrogate
        run: |
          export HF_HOME="$RUNNER_TEMP/hf-harmbench"
          mkdir -p "$HF_HOME" "$RUNNER_TEMP/harmbench-server"
          nohup "$LLAMA_SERVER" \
            -hf "$HARMBENCH_REF" \
            --host 127.0.0.1 \
            --port 8081 \
            -c 4096 \
            -t 4 \
            >"$RUNNER_TEMP/harmbench-server/server.log" 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 240); do
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -n 100 "$RUNNER_TEMP/harmbench-server/server.log"
              exit 1
            fi
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/health || true)"
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"
          timeout 60m python scripts/run_gate1_step3b_smoke.py evaluate \
            --root . \
            --private-output-dir "$PRIVATE_OUTPUT" \
            --server-url http://127.0.0.1:8081 \
            --mode harmbench
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          rm -rf "$HF_HOME"

      - name: Evaluate with StrongREJECT rubric surrogate
        run: |
          export HF_HOME="$RUNNER_TEMP/hf-strongreject"
          mkdir -p "$HF_HOME" "$RUNNER_TEMP/strongreject-server"
          nohup "$LLAMA_SERVER" \
            -hf "$STRONGREJECT_JUDGE_REF" \
            --host 127.0.0.1 \
            --port 8082 \
            -c 4096 \
            -t 4 \
            >"$RUNNER_TEMP/strongreject-server/server.log" 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 240); do
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -n 100 "$RUNNER_TEMP/strongreject-server/server.log"
              exit 1
            fi
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/health || true)"
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"
          timeout 90m python scripts/run_gate1_step3b_smoke.py evaluate \
            --root . \
            --private-output-dir "$PRIVATE_OUTPUT" \
            --server-url http://127.0.0.1:8082 \
            --mode strongreject
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          rm -rf "$HF_HOME"

      - name: Finalize conservative untouched-smoke consensus
        run: |
          python scripts/run_gate1_step3b_smoke.py finalize \
            --root . \
            --private-output-dir "$PRIVATE_OUTPUT" \
            --safe-output-dir "$SAFE_OUTPUT"

      - name: Verify no private text is present in safe outputs
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          private = Path(os.environ['PRIVATE_OUTPUT'])
          safe = Path(os.environ['SAFE_OUTPUT'])
          combined = '\n'.join(
              path.read_text(encoding='utf-8')
              for path in safe.iterdir()
              if path.is_file()
          )
          keys = {
              'goal', 'rendered_prompt', 'forbidden_prompt', 'chat_prompt',
              'response', 'judge_output'
          }
          for path in private.rglob('*.jsonl'):
              for line in path.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  for key in keys:
                      value = row.get(key)
                      if isinstance(value, str) and len(value) >= 16 and value in combined:
                          raise SystemExit(f'private text leaked through key {key}')
          PY

      - name: Persist or verify safe untouched-smoke outputs
        run: |
          destination=data/gate1/v2/smoke
          if [ -d "$destination" ]; then
            diff -ru "$destination" "$SAFE_OUTPUT"
          else
            mkdir -p "$destination"
            cp -a "$SAFE_OUTPUT"/. "$destination"/
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$destination"
            git commit -m "Freeze Gate 1 Step 3B untouched smoke outputs [skip ci]"
            git push origin HEAD:agent/gate1-contract
          fi

      - name: Publish safe untouched-smoke summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          safe = Path(os.environ['SAFE_OUTPUT'])
          summary = json.loads((safe / 'smoke_summary.json').read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as handle:
              handle.write('# Gate 1 Step 3B untouched smoke\n\n')
              handle.write(f"- status: **{summary['status']}**\n")
              handle.write(f"- examples: **{summary['smoke_example_count']}**\n")
              handle.write(f"- target generations: **{summary['target_generation_count']}**\n")
              handle.write(f"- original stable SAFE: **{summary['original_safe_count']}**\n")
              handle.write(f"- eligible: **{summary['eligible_count']}**\n")
              handle.write(f"- eligible candidates: **{summary['eligible_candidate_count']}**\n")
              handle.write(f"- evaluator pair coverage: **{summary['evaluator_pair_coverage']:.3f}**\n")
              handle.write(f"- abstention rate: **{summary['consensus_abstention_rate']:.3f}**\n")
              handle.write('- final-evaluation outputs observed: **false**\n')
              handle.write('- Gate 1 decision: **not evaluated**\n')
          PY

      - name: Upload safe untouched-smoke outputs
        uses: actions/upload-artifact@v4
        with:
          name: gate1-step3b-safe-untouched-smoke
          path: ${{ env.SAFE_OUTPUT }}
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup private files
        if: always()
        run: |
          if [ -d "$PRIVATE_OUTPUT" ]; then
            find "$PRIVATE_OUTPUT" -type f -print0 | xargs -0 -r shred -u
            rm -rf "$PRIVATE_OUTPUT"
          fi
