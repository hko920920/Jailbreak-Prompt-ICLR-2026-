name: e0-gcg-status-probe

# Refreshed after the formatting-only repair; this probe changes no experiment.
on:
  pull_request:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/e0_gcg_status_probe.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: e0-gcg-status-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIVE_BRANCH: agent/programmatic-agentharm-pivot
      TARGET_WORKFLOW: e0-gcg-static-adapter-audit
      TARGET_HEAD_SHA: c422029815e2e92c7f9c901a844471b418734064
    steps:
      - name: Query latest GCG audit run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/e0-gcg-status-probe
          all_runs="$(
            gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${ACTIVE_BRANCH}&per_page=100"
          )"
          jq --arg name "$TARGET_WORKFLOW" --arg branch "$ACTIVE_BRANCH" --arg sha "$TARGET_HEAD_SHA" '
            [ .workflow_runs[] | select(.name == $name) ]
            | (map(select(.head_sha == $sha)) + .)
            | unique_by(.id)
            | sort_by(.created_at)
            | reverse
            | {
                schema_version: "e0-gcg-status-probe-v1",
                queried_branch: $branch,
                expected_head_sha: $sha,
                workflow_name: $name,
                latest: (.[0] // null | if . == null then null else {
                  id,
                  run_number,
                  run_attempt,
                  event,
                  head_sha,
                  status,
                  conclusion,
                  created_at,
                  updated_at,
                  run_started_at,
                  html_url
                } end),
                recent: [ .[:5][] | {
                  id,
                  run_number,
                  event,
                  head_sha,
                  status,
                  conclusion,
                  created_at,
                  updated_at
                } ],
                raw_prompt_or_response_included: false,
                scientific_contract_changed: false,
                target_model_called_by_probe: false,
                causal_oracle_opened_by_probe: false,
                wavelet_used_by_probe: false
              }
          ' <<<"$all_runs" > artifacts/e0-gcg-status-probe/latest.safe.json
          cat artifacts/e0-gcg-status-probe/latest.safe.json

      - name: Upload safe status artifact
        uses: actions/upload-artifact@v4
        with:
          name: e0-gcg-status-probe-safe
          path: artifacts/e0-gcg-status-probe/latest.safe.json
          if-no-files-found: error
          retention-days: 7
