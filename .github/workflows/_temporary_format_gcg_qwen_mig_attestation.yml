name: temporary-format-gcg-qwen-mig-attestation

"on":
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_format_gcg_qwen_mig_attestation.yml

permissions:
  contents: write

concurrency:
  group: temporary-format-gcg-qwen-mig-attestation
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/programmatic-agentharm-pivot

jobs:
  format-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply pinned formatting and validate
        run: |
          python -m pip install 'pytest==8.3.5' 'ruff==0.16.4'
          targets=(
            scripts/attest_gcg_qwen_self_hosted_runner.py
            tests/test_gcg_qwen_self_hosted_attestation.py
          )
          ruff format "${targets[@]}"
          ruff check "${targets[@]}"
          ruff format --check "${targets[@]}"
          python -m py_compile \
            scripts/attest_gcg_qwen_self_hosted_runner.py
          python -m pytest -q \
            tests/test_gcg_qwen_self_hosted_attestation.py
          git diff --check

      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/attest_gcg_qwen_self_hosted_runner.py \
            tests/test_gcg_qwen_self_hosted_attestation.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format GCG-Qwen MIG attestation sources"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
