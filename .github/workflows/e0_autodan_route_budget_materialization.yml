name: e0-autodan-route-budget-materialization

on:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/e0_autodan_route_budget_materialization.yml
      - configs/natural_language_localization/e0_autodan_route_budget_materialization_v1.json
      - docs/E0_AUTODAN_ROUTE_BUDGET_MATERIALIZATION_V1.md
      - scripts/run_e0_autodan_route_budget_materialization.py
      - tests/test_e0_autodan_route_budget_materialization.py
      - data/natural_language_localization/e0_attack_family_provenance_v1/autodan_static_audit.safe.json
      - data/natural_language_localization/e0_attack_family_provenance_v1/autodan_qwen_adapter_smoke.safe.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e0-autodan-route-budget-materialization
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AUTODAN_REPOSITORY: https://github.com/SheltonLiu-N/AutoDAN.git
      AUTODAN_REVISION: 34062e964185693e81a6775b4f0d00bfd7507612
      CONTRACT: configs/natural_language_localization/e0_autodan_route_budget_materialization_v1.json
      SAFE_OUTPUT: artifacts/e0-autodan-route-budget-materialization/e0_autodan_route_budget_materialization.safe.json
      PIP_NO_CACHE_DIR: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.11.0'
          python -m pip install \
            'pytest==9.1.1' \
            'ruff==0.16.4'

      - name: Validate implementation and frozen contract
        run: |
          ruff check \
            scripts/run_e0_autodan_route_budget_materialization.py \
            tests/test_e0_autodan_route_budget_materialization.py
          pytest -q tests/test_e0_autodan_route_budget_materialization.py
          python -m json.tool "$CONTRACT" >/dev/null
          git diff --check

      - name: Check out exact AutoDAN source revision
        run: |
          source_root="$RUNNER_TEMP/autodan-source"
          git init -q "$source_root"
          git -C "$source_root" remote add origin "$AUTODAN_REPOSITORY"
          git -C "$source_root" fetch -q --depth 1 origin "$AUTODAN_REVISION"
          git -C "$source_root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$source_root" rev-parse HEAD)" = "$AUTODAN_REVISION"
          echo "AUTODAN_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"

      - name: Execute harmless fixed-route materialization smoke
        run: |
          python scripts/run_e0_autodan_route_budget_materialization.py \
            --root . \
            --config "$CONTRACT" \
            --source-root "$AUTODAN_SOURCE_ROOT" \
            --output "$SAFE_OUTPUT"

      - name: Verify pass result and sealed boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["SAFE_OUTPUT"]).read_text())
          assert result["status"] == (
              "E0_AUTODAN_ROUTE_BUDGET_MATERIALIZATION_PASS_REMAIN_PREOUTPUT"
          )
          assert result["operational_pass"] is True
          assert result["paper_validity"] is False
          assert result["family_admitted_to_balanced_signal_screen"] is False
          assert result["real_harmful_payload_used"] is False
          assert result["target_model_weights_downloaded"] is False
          assert result["target_model_called"] is False
          assert result["target_model_generation_performed"] is False
          assert result["external_api_called"] is False
          assert result["cross_regime_stage_a_opened"] is False
          assert result["prior_evaluation_opened"] is False
          assert result["heldout_opened"] is False
          assert result["causal_oracle_opened"] is False
          assert result["keep_only_oracle_opened"] is False
          assert result["wavelet_used"] is False
          assert all(result["mandatory_checks"].values())

          forbidden = {
              "raw_candidate",
              "raw_materialized",
              "prompt",
              "response",
              "harmful_payload",
          }
          stack = [result]
          while stack:
              value = stack.pop()
              if isinstance(value, dict):
                  leaked = forbidden.intersection(value)
                  if leaked:
                      raise SystemExit(f"unsafe raw fields: {sorted(leaked)}")
                  stack.extend(value.values())
              elif isinstance(value, list):
                  stack.extend(value)
          PY

      - name: Publish safe summary
        if: always()
        run: |
          if [ -f "$SAFE_OUTPUT" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["SAFE_OUTPUT"]).read_text())
          representative = result["harmless_simulation"]["representative"]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as handle:
              handle.write("# E0 AutoDAN route and budget smoke\n\n")
              handle.write(f"- status: **{result['status']}**\n")
              handle.write(
                  f"- source references: **{result['prompt_group']['total_count']}**\n"
              )
              handle.write(
                  "- valid exact-placeholder references: "
                  f"**{result['prompt_group']['valid_exact_placeholder_count']}**\n"
              )
              handle.write(
                  f"- materialized candidates: **{representative['candidate_count']}**\n"
              )
              handle.write(
                  "- crossover candidates repaired by guard: "
                  f"**{representative['guard_repair_count']}**\n"
              )
              handle.write(
                  "- deterministic / exact payload once: "
                  f"**{result['harmless_simulation']['deterministic']} / "
                  f"{representative['all_materialized_payload_exact_once']}**\n"
              )
              handle.write("- target model / external API: **false / false**\n")
              handle.write(
                  "- Stage A / causal oracle / wavelet: **closed / closed / closed**\n"
              )
          PY
          else
            echo "Safe AutoDAN smoke output was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload safe AutoDAN materialization artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e0-autodan-route-budget-materialization-safe
          path: artifacts/e0-autodan-route-budget-materialization
          if-no-files-found: warn
          retention-days: 30
