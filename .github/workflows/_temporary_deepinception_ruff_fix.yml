name: temporary-deepinception-ruff-fix

on:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_deepinception_ruff_fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/programmatic-agentharm-pivot
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply exact formatting-only repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run_e0_deepinception_static_audit.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '    unit_ids = [str(fragment["owner"]) for fragment in fragments '
              'if fragment["kind"] == "attack_unit"]\n'
          )
          new = (
              '    unit_ids = [\n'
              '        str(fragment["owner"])\n'
              '        for fragment in fragments\n'
              '        if fragment["kind"] == "attack_unit"\n'
              '    ]\n'
          )
          if old not in text:
              raise SystemExit("frozen Ruff target line not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m pip install 'ruff==0.16.4'
          ruff check scripts/run_e0_deepinception_static_audit.py
          git diff --check

      - name: Commit formatting-only repair
        run: |
          if git diff --quiet -- scripts/run_e0_deepinception_static_audit.py; then
            echo 'No repair was required.'
            exit 0
          fi
          git config user.name 'Taewook-git'
          git config user.email 'lkhd3329@naver.com'
          git add scripts/run_e0_deepinception_static_audit.py
          git commit -m 'Fix DeepInception E0 Ruff formatting'
          git push origin HEAD:agent/programmatic-agentharm-pivot
