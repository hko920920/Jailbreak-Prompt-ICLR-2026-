name: apply-step3b-calibration-type-fix

on:
  push:
    branches:
      - agent/gate1-contract
    paths:
      - scripts/apply_step3b_calibration_type_fix.py
      - .github/workflows/apply_step3b_calibration_type_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate1-contract
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,step3]'

      - name: Apply strict typing fix before model execution
        run: |
          python scripts/apply_step3b_calibration_type_fix.py
          ruff format src/jbspan/gate1/step3b_calibration.py
          rm scripts/apply_step3b_calibration_type_fix.py

      - name: Validate corrected calibration code
        run: |
          ruff check .
          mypy src/jbspan
          pytest
          git diff --check

      - name: Commit the validated non-result correction
        run: |
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git add src/jbspan/gate1/step3b_calibration.py \
            scripts/apply_step3b_calibration_type_fix.py
          git diff --cached --check
          git commit -m \
            "Fix strict typing before Step 3B calibration [skip ci]"
          git push origin HEAD:agent/gate1-contract

      - name: Publish correction status
        run: |
          {
            echo '# Step 3B calibration pre-output type correction'
            echo
            echo '- model outputs observed before fix: **false**'
            echo '- ruff: **PASS**'
            echo '- strict mypy: **PASS**'
            echo '- tests: **PASS**'
          } >> "$GITHUB_STEP_SUMMARY"
