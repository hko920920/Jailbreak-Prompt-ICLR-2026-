name: evaluator-panel-e1c-selection-repair

# Static selection repair only. No weights, model inference, or attack outputs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluator-panel-e1c-selection-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HARM_BENCH_REVISION: 8e1604d1171fe8a48d8febecd22f600e462bdcdd
      SOURCE_ROOT: upstream/HarmBench
      CONFIG: configs/natural_language_localization/evaluator_panel_e1c_selection_repair_v1.json
      SAFE_DIR: artifacts/evaluator-panel-e1c-selection-repair/safe
      SAFE_RESULT: artifacts/evaluator-panel-e1c-selection-repair/safe/e1c_selection_repair.safe.json
      SAFE_SELECTION: artifacts/evaluator-panel-e1c-selection-repair/safe/e1c_harmbench_selection_v2.safe.jsonl

    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out immutable HarmBench source
        uses: actions/checkout@v4
        with:
          repository: centerforaisafety/HarmBench
          ref: ${{ env.HARM_BENCH_REVISION }}
          path: ${{ env.SOURCE_ROOT }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate frozen repair implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8.2' 'ruff>=0.6'
          ruff check \
            scripts/run_evaluator_panel_e1c_selection_repair.py \
            tests/test_evaluator_panel_e1c_selection_repair.py
          python -m pytest -q tests/test_evaluator_panel_e1c_selection_repair.py
          python -m json.tool "$CONFIG" >/dev/null
          git diff --check

      - name: Verify immutable upstream checkout
        run: |
          test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = "$HARM_BENCH_REVISION"

      - name: Rebuild balanced selection from registry-resolvable behaviors
        run: |
          mkdir -p "$SAFE_DIR"
          python scripts/run_evaluator_panel_e1c_selection_repair.py \
            --root . \
            --source-root "$SOURCE_ROOT" \
            --config "$CONFIG" \
            --safe-output "$SAFE_RESULT" \
            --selection-output "$SAFE_SELECTION"

      - name: Audit repaired selection and sealed boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["SAFE_RESULT"])
          selection_path = Path(os.environ["SAFE_SELECTION"])
          result = json.loads(result_path.read_text(encoding="utf-8"))
          assert result["status"] == "E1C_SELECTION_REPAIR_PASS"
          assert result["operational_pass"] is True
          assert result["old_selection"]["missing_registry_row_count"] == 3
          assert len(result["old_selection"]["missing_behavior_hashes"]) == 2
          assert result["new_selection"]["record_count"] == 200
          assert result["new_selection"]["label_counts"] == {"0": 100, "1": 100}
          assert result["new_selection"]["dropped_record_count"] == 3
          assert result["new_selection"]["added_record_count"] == 3
          assert result["new_selection"]["missing_registry_row_count"] == 0
          assert result["new_selection"]["deterministic"] is True
          assert result["model_weight_downloaded"] is False
          assert result["model_inference_performed"] is False
          assert result["harmbench_live_predictions_generated"] is False
          assert result["new_harmful_attack_outputs_generated"] is False
          assert result["cross_regime_stage_a_opened"] is False
          assert result["causal_oracle_opened"] is False
          assert result["keep_only_oracle_opened"] is False
          assert result["wavelet_used"] is False
          assert len(selection_path.read_text(encoding="utf-8").splitlines()) == 200
          serialized = result_path.read_text(encoding="utf-8")
          for forbidden in (
              '"behavior_id_private"',
              '"test_case"',
              '"generation"',
              '"behavior_text"',
              '"prompt_text"',
          ):
              assert forbidden not in serialized
          PY

      - name: Upload safe repair artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-panel-e1c-selection-repair-safe
          path: ${{ env.SAFE_DIR }}
          if-no-files-found: error
          retention-days: 30
