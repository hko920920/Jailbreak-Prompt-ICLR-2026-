name: temporary-cancel-duplicate-e1c-live

"on":
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_cancel_duplicate_e1c_live.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: temporary-cancel-duplicate-e1c-live
  cancel-in-progress: false

jobs:
  cancel-duplicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: agent/programmatic-agentharm-pivot
      PRIMARY_RUN_ID: "32822371869"
      DUPLICATE_RUN_ID: "32833530955"
      SAFE_RECORD: data/natural_language_localization/evaluator_panel_v1/e1c_duplicate_live_cancellation.safe.json
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Cancel only the duplicate pending run
        run: |
          set -euo pipefail
          primary="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRIMARY_RUN_ID")"
          duplicate_before="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$DUPLICATE_RUN_ID")"
          primary_status="$(jq -r '.status' <<<"$primary")"
          primary_conclusion="$(jq -r '.conclusion // "pending"' <<<"$primary")"
          duplicate_before_status="$(jq -r '.status' <<<"$duplicate_before")"
          duplicate_before_conclusion="$(jq -r '.conclusion // "pending"' <<<"$duplicate_before")"

          cancel_requested=false
          if [[ "$duplicate_before_status" != "completed" ]]; then
            gh api --method POST \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$DUPLICATE_RUN_ID/cancel" \
              >/dev/null
            cancel_requested=true
          fi

          duplicate_after="$duplicate_before"
          for _ in $(seq 1 60); do
            duplicate_after="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$DUPLICATE_RUN_ID")"
            if [[ "$(jq -r '.status' <<<"$duplicate_after")" == "completed" ]]; then
              break
            fi
            sleep 5
          done
          duplicate_after_status="$(jq -r '.status' <<<"$duplicate_after")"
          duplicate_after_conclusion="$(jq -r '.conclusion // "pending"' <<<"$duplicate_after")"
          test "$duplicate_after_status" = "completed"

          mkdir -p "$(dirname "$SAFE_RECORD")"
          jq -n \
            --arg primary_run_id "$PRIMARY_RUN_ID" \
            --arg primary_status "$primary_status" \
            --arg primary_conclusion "$primary_conclusion" \
            --arg duplicate_run_id "$DUPLICATE_RUN_ID" \
            --arg duplicate_before_status "$duplicate_before_status" \
            --arg duplicate_before_conclusion "$duplicate_before_conclusion" \
            --arg duplicate_after_status "$duplicate_after_status" \
            --arg duplicate_after_conclusion "$duplicate_after_conclusion" \
            --argjson cancel_requested "$cancel_requested" \
            '{
              schema_version: "e1c-duplicate-live-cancellation-safe-v1",
              classification: "OPERATIONAL_DUPLICATE_CANCELLATION_NOT_SCIENTIFIC_FAILURE",
              primary_run: {
                id: ($primary_run_id | tonumber),
                status_at_cancellation: $primary_status,
                conclusion_at_cancellation: $primary_conclusion
              },
              duplicate_run: {
                id: ($duplicate_run_id | tonumber),
                status_before: $duplicate_before_status,
                conclusion_before: $duplicate_before_conclusion,
                cancellation_requested: $cancel_requested,
                status_after: $duplicate_after_status,
                conclusion_after: $duplicate_after_conclusion
              },
              model_changed: false,
              data_changed: false,
              selection_changed: false,
              thresholds_changed: false,
              parser_changed: false,
              stage_a_opened: false,
              heldout_opened: false,
              causal_oracle_opened: false,
              keep_only_oracle_opened: false,
              wavelet_used: false
            }' > "$SAFE_RECORD"

      - name: Commit safe cancellation record and remove one-shot workflow
        run: |
          git rm .github/workflows/_temporary_cancel_duplicate_e1c_live.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SAFE_RECORD"
          git commit -m "Record duplicate E1C live run cancellation"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
