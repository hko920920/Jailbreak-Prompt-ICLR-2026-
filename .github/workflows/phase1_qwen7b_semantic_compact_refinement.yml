name: phase1-qwen7b-semantic-compact-refinement

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase1-core-experiment-prep
    paths:
      - .github/workflows/phase1_qwen7b_semantic_compact_refinement.yml
      - scripts/run_phase1_llama_cpp_semantic_compact_refinement.py
      - data/manifests/phase1_semantic_compact_refinement.json
      - security/phase1_semantic_refine_recipient_cert.pem

permissions:
  contents: read

jobs:
  qwen7b-semantic-compact-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      MODEL_REF: Qwen/Qwen2.5-7B-Instruct-GGUF:Q4_K_M
      DATA_PATH: data/processed/phase1_micro_pilot_20.local.jsonl
      MANIFEST_PATH: data/manifests/phase1_semantic_compact_refinement.json
      SAFE_OUTPUT: artifacts/phase1-qwen7b-semantic-compact-refinement/safe_summary.json
      ENCRYPTED_OUTPUT: artifacts/phase1-qwen7b-semantic-compact-refinement/private_refinement.cms
      RECIPIENT_CERT: security/phase1_semantic_refine_recipient_cert.pem
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and validate project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check scripts/run_phase1_llama_cpp_semantic_compact_refinement.py
          python -m py_compile scripts/run_phase1_llama_cpp_semantic_compact_refinement.py
          mypy src/jbspan scripts/run_phase1_llama_cpp_compact_oracle.py

      - name: Assemble pinned input
        run: |
          python scripts/assemble_phase1_jbb_micro_pilot.py \
            --output "$DATA_PATH" \
            --manifest data/manifests/phase1_micro_pilot_20.selection.semantic-refinement.json

      - name: Install official llama.cpp runtime
        run: |
          curl -LsSf https://llama.app/install.sh | \
            SKIP_CUDA=1 SKIP_ROCM=1 SKIP_VULKAN=1 sh
          ~/.llama-app/llama --version

      - name: Start Qwen2.5-7B-Instruct Q4 server
        run: |
          export HF_HOME="$RUNNER_TEMP/huggingface"
          mkdir -p "$HF_HOME" "$RUNNER_TEMP/llama-server"
          nohup ~/.llama-app/llama serve \
            -hf "$MODEL_REF" \
            --host 127.0.0.1 \
            --port 8080 \
            -c 4608 \
            -t 4 \
            >"$RUNNER_TEMP/llama-server/server.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/llama-server/pid"

          ready=0
          for _ in $(seq 1 180); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/llama-server/pid")" 2>/dev/null; then
              echo "llama server exited before readiness"
              tail -n 100 "$RUNNER_TEMP/llama-server/server.log"
              exit 1
            fi
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8080/health || true)"
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            sleep 10
          done

          if [ "$ready" != "1" ]; then
            echo "llama server did not become ready"
            tail -n 100 "$RUNNER_TEMP/llama-server/server.log"
            exit 1
          fi

      - name: Capture semantic refinement privately
        run: |
          private_output="$RUNNER_TEMP/phase1_qwen7b_semantic_compact_refinement.jsonl"
          echo "PRIVATE_OUTPUT=$private_output" >> "$GITHUB_ENV"
          timeout 80m python scripts/run_phase1_llama_cpp_semantic_compact_refinement.py \
            --data "$DATA_PATH" \
            --manifest "$MANIFEST_PATH" \
            --private-output "$private_output" \
            --safe-output "$SAFE_OUTPUT" \
            --model "$MODEL_REF" \
            --max-tokens 256 \
            --temperature 0.0

      - name: Encrypt refinement bundle and remove plaintext
        run: |
          mkdir -p "$(dirname "$ENCRYPTED_OUTPUT")"
          archive="$RUNNER_TEMP/phase1_qwen7b_semantic_compact_refinement.tar.gz"
          tar -C "$(dirname "$PRIVATE_OUTPUT")" -czf "$archive" \
            "$(basename "$PRIVATE_OUTPUT")"
          openssl cms -encrypt -binary -aes256 \
            -in "$archive" \
            -out "$ENCRYPTED_OUTPUT" \
            -outform DER \
            "$RECIPIENT_CERT"
          openssl dgst -sha256 "$ENCRYPTED_OUTPUT"
          shred -u "$PRIVATE_OUTPUT" "$archive"
          test ! -e "$PRIVATE_OUTPUT"

      - name: Publish safe aggregate summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["SAFE_OUTPUT"]).read_text(encoding="utf-8"))
          public = {key: value for key, value in payload.items() if key != "cases"}
          print(json.dumps(public, indent=2, sort_keys=True))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("# Qwen2.5-7B semantic compact refinement\n\n")
              handle.write(f"- cases: **{payload['case_count']}**\n")
              handle.write(f"- semantic candidates: **{payload['candidate_count']}**\n")
              handle.write(f"- generations: **{payload['generation_count']}**\n")
              handle.write(f"- max tokens: **{payload['max_tokens']}**\n")
              handle.write("- plaintext prompts/responses uploaded: **false**\n")
              handle.write("- encrypted refinement bundle uploaded: **true**\n")
              handle.write("\nExplicit response and prompt-validity audit is required.\n")
          PY

      - name: Upload encrypted refinement and safe summary
        uses: actions/upload-artifact@v4
        with:
          name: phase1-qwen7b-encrypted-semantic-compact-refinement
          path: |
            ${{ env.ENCRYPTED_OUTPUT }}
            ${{ env.SAFE_OUTPUT }}
          if-no-files-found: error
          retention-days: 3

      - name: Stop local model server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/llama-server/pid" ]; then
            kill "$(cat "$RUNNER_TEMP/llama-server/pid")" 2>/dev/null || true
          fi
