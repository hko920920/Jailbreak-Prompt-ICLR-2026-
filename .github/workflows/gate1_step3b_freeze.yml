name: gate1-step3b-freeze

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/gate1_step3b_freeze.yml
      - configs/gate1/gate1_step3b.json
      - src/jbspan/gate1/step3b.py
      - scripts/run_gate1_step3b.py
      - tests/test_gate1_step3b.py
      - docs/GATE1_STEP3B_PROTOCOL.md

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REPOSITORY: mdoumbouya/h4rm3l
      SOURCE_REVISION: e6f58a1a1e56c1a95b26b06aa4fe393ee2240dbd
      SOURCE_PATH: experiments/experiment_116_bandi_synthesis/config/benchmark_reference_programs.csv
      SOURCE_BLOB_SHA: 220a255d39c1cad769e2414448fbad514e2823dd
      SAFE_OUTPUT: artifacts/gate1-step3b-freeze/safe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and validate Step 3B freeze code
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,step3]'
          ruff check .
          mypy src/jbspan
          pytest
          git diff --check

      - name: Download and verify pinned h4rm3l source
        run: |
          source_csv="$RUNNER_TEMP/benchmark_reference_programs.csv"
          url="https://raw.githubusercontent.com/${SOURCE_REPOSITORY}/${SOURCE_REVISION}/${SOURCE_PATH}"
          curl --fail --location --silent --show-error "$url" --output "$source_csv"
          test -s "$source_csv"
          observed_blob="$(python - "$source_csv" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          data = Path(sys.argv[1]).read_bytes()
          header = f"blob {len(data)}\0".encode("ascii")
          print(hashlib.sha1(header + data).hexdigest())
          PY
          )"
          test "$observed_blob" = "$SOURCE_BLOB_SHA"
          echo "SOURCE_CSV=$source_csv" >> "$GITHUB_ENV"

      - name: Freeze v2 source identities, candidate hashes, and split
        run: |
          python scripts/run_gate1_step3b.py freeze \
            --root . \
            --source-csv "$SOURCE_CSV" \
            --safe-output-dir "$SAFE_OUTPUT"

      - name: Persist or verify frozen Step 3B outputs
        run: |
          destination=data/gate1/v2/frozen
          if [ -d "$destination" ]; then
            diff -ru "$destination" "$SAFE_OUTPUT"
          else
            mkdir -p "$destination"
            cp -a "$SAFE_OUTPUT"/. "$destination"/
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$destination"
            git commit -m "Freeze Gate 1 Step 3B source and split"
            git push origin HEAD:agent/gate1-contract
          fi

      - name: Publish safe Step 3B freeze summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          safe = Path(os.environ['SAFE_OUTPUT'])
          manifest = json.loads((safe / 'freeze_manifest.json').read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as handle:
              handle.write('# Gate 1 Step 3B Source Freeze\n\n')
              handle.write(f"- status: **{manifest['status']}**\n")
              handle.write(f"- candidates: **{manifest['candidate_count']}**\n")
              handle.write(
                  f"- calibration/smoke/final-evaluation payloads: "
                  f"**{manifest['calibration_payload_count']}/"
                  f"{manifest['smoke_payload_count']}/"
                  f"{manifest['evaluation_payload_count']}**\n"
              )
              handle.write('- target outputs observed: **false**\n')
              handle.write('- raw wrapper text committed: **false**\n')
          PY

      - name: Upload safe freeze artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate1-step3b-safe-freeze
          path: ${{ env.SAFE_OUTPUT }}
          if-no-files-found: error
          retention-days: 7
