name: temporary-fix-e1c-canary-length-evidence

"on":
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_fix_e1c_canary_length_evidence.yml

permissions:
  contents: write

concurrency:
  group: temporary-fix-e1c-canary-length-evidence
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/programmatic-agentharm-pivot

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact fixer commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove invented predecessor length evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          script = Path(
              "scripts/run_evaluator_panel_e1c_canary_requalification_freeze.py"
          )
          text = script.read_text(encoding="utf-8")
          text = text.replace(
              '    output_lengths = {row.get("raw_output_length") for row in rows}\n',
              "",
          )
          text = text.replace(
              '        "single_expected_output_length": output_lengths\n'
              '        == {int(predecessor["required_uniform_output_length"])},\n',
              '        "raw_output_length_not_recorded": all(\n'
              '            "raw_output_length" not in row for row in rows\n'
              '        ),\n',
          )
          text = text.replace(
              '        "uniform_raw_output_length": next(iter(output_lengths)),\n',
              '        "uniform_raw_output_length_recorded": False,\n',
          )
          if "output_lengths" in text or "required_uniform_output_length" in text:
              raise SystemExit("obsolete length evidence remains in freeze implementation")
          if '"raw_output_length_not_recorded"' not in text:
              raise SystemExit("length-evidence absence check was not installed")
          script.write_text(text, encoding="utf-8")

          config = Path(
              "configs/natural_language_localization/"
              "evaluator_panel_e1c_canary_requalification_freeze_v1.json"
          )
          value = json.loads(config.read_text(encoding="utf-8"))
          value["predecessor"].pop("required_uniform_output_length", None)
          config.write_text(
              json.dumps(value, indent=2, sort_keys=False) + "\n",
              encoding="utf-8",
          )

          test = Path(
              "tests/test_evaluator_panel_e1c_canary_requalification_freeze.py"
          )
          body = test.read_text(encoding="utf-8")
          body = body.replace('                        "raw_output_length": 2,\n', "")
          body = body.replace('            "required_uniform_output_length": 2,\n', "")
          assertion = (
              '    assert summary["uniform_raw_output_length_recorded"] is False\n'
          )
          anchor = (
              '    assert summary["demonstrated_transformation_specific_flip"] '
              'is False\n'
          )
          if assertion not in body:
              body = body.replace(anchor, anchor + assertion)
          new_test = '''def test_canary_pattern_rejects_unfrozen_length_metadata() -> None:
              rows = canary_rows()
              rows[0]["raw_output_length"] = 2
              try:
                  freeze.validate_canary_failure(result(), rows, contract())
              except ValueError:
                  pass
              else:
                  raise AssertionError(
                      "unrecorded predecessor metadata must not be invented"
                  )


'''.replace("              ", "")
          insertion = (
              'def test_stratified_selection_is_deterministic_disjoint_and_balanced() '
              '-> None:\n'
          )
          if "test_canary_pattern_rejects_unfrozen_length_metadata" not in body:
              body = body.replace(insertion, new_test + insertion)
          test.write_text(body, encoding="utf-8")

          doc = Path(
              "docs/EVALUATOR_PANEL_E1C_CANARY_REQUALIFICATION_FREEZE_V1.md"
          )
          documentation = doc.read_text(encoding="utf-8")
          note = (
              "The old safe rows do not contain raw-output length. Uniform output "
              "identity is therefore\n"
              "verified only from the recorded SHA-256 field; the freeze explicitly "
              "verifies that no length\n"
              "metadata is present rather than inferring an unrecorded value.\n\n"
          )
          anchor = (
              "The old canary block produced a uniform negative prediction for all "
              "24 requests:\n"
          )
          if note not in documentation:
              documentation = documentation.replace(anchor, anchor + "\n" + note)
          doc.write_text(documentation, encoding="utf-8")
          PY

      - name: Validate corrected evidence contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8.2' 'ruff>=0.6'
          ruff check \
            scripts/run_evaluator_panel_e1c_canary_requalification_freeze.py \
            tests/test_evaluator_panel_e1c_canary_requalification_freeze.py
          python -m pytest -q \
            tests/test_evaluator_panel_e1c_canary_requalification_freeze.py \
            tests/test_evaluator_panel_e1c_canary_requalification_live.py
          python -m py_compile \
            scripts/run_evaluator_panel_e1c_canary_requalification_freeze.py \
            scripts/run_evaluator_panel_e1c_canary_requalification_live.py
          python -m json.tool \
            configs/natural_language_localization/evaluator_panel_e1c_canary_requalification_freeze_v1.json \
            >/dev/null
          git diff --check

      - name: Commit corrected non-workflow evidence files
        run: |
          files=(
            scripts/run_evaluator_panel_e1c_canary_requalification_freeze.py
            tests/test_evaluator_panel_e1c_canary_requalification_freeze.py
            configs/natural_language_localization/evaluator_panel_e1c_canary_requalification_freeze_v1.json
            docs/EVALUATOR_PANEL_E1C_CANARY_REQUALIFICATION_FREEZE_V1.md
          )
          git add "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix E1C predecessor output evidence contract"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
