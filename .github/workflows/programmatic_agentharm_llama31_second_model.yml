name: programmatic-agentharm-llama31-second-model

on:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/programmatic_agentharm_llama31_second_model.yml
      - scripts/prepare_programmatic_agentharm_llama31_runtime.sh
      - configs/programmatic_agentharm/runtime_llama31_second_model.json
      - configs/programmatic_agentharm/second_model_llama31_sweep.json
      - data/programmatic_agentharm/development/qwen_development_decision.json
      - docs/programmatic_agentharm_second_model_llama31_contract.md
      - tests/test_programmatic_agentharm_second_model.py
      - scripts/run_programmatic_agentharm_development_behavior.py
      - scripts/aggregate_programmatic_agentharm_development_sweep.py
      - scripts/run_programmatic_agentharm_smoke.py
      - scripts/inspect_ai.py
      - data/programmatic_agentharm/gate0/gate0_manifest.json
      - data/gate1/v2/frozen/**
      - src/jbspan/programmatic_agentharm/development_sweep.py
      - src/jbspan/programmatic_agentharm/runtime.py
      - src/jbspan/gate1/step3b.py
  pull_request:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/programmatic_agentharm_llama31_second_model.yml
      - scripts/prepare_programmatic_agentharm_llama31_runtime.sh
      - configs/programmatic_agentharm/runtime_llama31_second_model.json
      - configs/programmatic_agentharm/second_model_llama31_sweep.json
      - data/programmatic_agentharm/development/qwen_development_decision.json
      - docs/programmatic_agentharm_second_model_llama31_contract.md
      - tests/test_programmatic_agentharm_second_model.py
      - scripts/run_programmatic_agentharm_development_behavior.py
      - scripts/aggregate_programmatic_agentharm_development_sweep.py
      - scripts/run_programmatic_agentharm_smoke.py
      - scripts/inspect_ai.py
      - data/programmatic_agentharm/gate0/gate0_manifest.json
      - data/gate1/v2/frozen/**
      - src/jbspan/programmatic_agentharm/development_sweep.py
      - src/jbspan/programmatic_agentharm/runtime.py
      - src/jbspan/gate1/step3b.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: programmatic-agentharm-llama31-second-model
  cancel-in-progress: false

env:
  RUNTIME_CONFIG: configs/programmatic_agentharm/runtime_llama31_second_model.json
  DEVELOPMENT_CONFIG: configs/programmatic_agentharm/second_model_llama31_sweep.json
  ATTACK_SOURCE: /tmp/h4rm3l-reference-programs.csv
  LOCAL_API_KEY: local-runtime-only
  LOCAL_BASE_URL: http://127.0.0.1:8080/v1
  HF_HOME: /tmp/huggingface
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: matrix
        name: Freeze matched second-model matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          config = json.loads(Path(
              "configs/programmatic_agentharm/second_model_llama31_sweep.json"
          ).read_text())
          assert config["frozen"] is True
          assert config["development_only"] is True
          assert config["paper_validity"] is False
          assert config["provenance"]["second_model_outputs_observed"] is False
          assert config["claim_boundary"]["second_model_is_terminal_feasibility_test"] is True
          behaviors = config["behaviors"]
          assert len(behaviors) == 6
          assert len({item["slug"] for item in behaviors}) == 6
          print("matrix=" + json.dumps({"behavior": behaviors}, separators=(",", ":")))
          PY

  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SAFE_OUTPUT: artifacts/programmatic-agentharm-llama31-probe/safe_summary.json
      MODEL_DIR: /tmp/meta-llama-3.1-8b-instruct-q4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install \
            'openai>=1.75' \
            'git+https://github.com/UKGovernmentBEIS/inspect_evals.git@928e3dd92aa926f7dd1746c753e171f9f717c964'

      - name: Validate frozen second-model contracts
        run: |
          ruff check \
            scripts/run_programmatic_agentharm_smoke.py \
            scripts/run_programmatic_agentharm_development_behavior.py \
            scripts/aggregate_programmatic_agentharm_development_sweep.py \
            src/jbspan/programmatic_agentharm/development_sweep.py \
            src/jbspan/programmatic_agentharm/runtime.py \
            tests/test_programmatic_agentharm_second_model.py
          bash -n scripts/prepare_programmatic_agentharm_llama31_runtime.sh
          pytest \
            tests/test_programmatic_agentharm_contract.py \
            tests/test_programmatic_agentharm_runtime.py \
            tests/test_programmatic_agentharm_development_sweep.py \
            tests/test_programmatic_agentharm_second_model.py
          python -m json.tool "$RUNTIME_CONFIG" >/dev/null
          python -m json.tool "$DEVELOPMENT_CONFIG" >/dev/null
          git diff --check

      - name: Prepare pinned Llama 3.1 runtime
        run: bash scripts/prepare_programmatic_agentharm_llama31_runtime.sh

      - name: Run judge-free Llama 3.1 operational probe
        run: |
          set +e
          timeout 90m python scripts/run_programmatic_agentharm_smoke.py \
            --root . \
            --config "$RUNTIME_CONFIG" \
            --attack-source-csv "$ATTACK_SOURCE" \
            --safe-output "$SAFE_OUTPUT"
          probe_exit=$?
          set -e
          echo "PROBE_EXIT=$probe_exit" >> "$GITHUB_ENV"

      - name: Verify probe and safe artifact boundary
        if: always()
        run: |
          test -f "$SAFE_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["SAFE_OUTPUT"]).read_text())
          forbidden_keys = {
              "prompt", "response", "raw_output", "tool_output",
              "generation", "arguments",
          }

          def visit(node):
              if isinstance(node, dict):
                  leaked = forbidden_keys.intersection(node)
                  if leaked:
                      raise SystemExit(f"unsafe artifact keys: {sorted(leaked)}")
                  for child in node.values():
                      visit(child)
              elif isinstance(node, list):
                  for child in node:
                      visit(child)

          visit(value)
          decision = value["decision"]
          assert value["paper_validity"] is False
          assert value["human_judge_used"] is False
          assert value["llm_judge_used"] is False
          assert value["assistant_free_text_scored"] is False
          assert decision["operational_pass"] is True
          assert decision["completed_episodes"] == 3
          assert decision["score_coverage"] == 1.0
          assert decision["forced_first_tool_calls"] >= 1
          assert value["confirmatory_outputs_observed"] is False
          assert value["final_outputs_observed"] is False
          assert value["causal_oracle_opened"] is False
          assert value["wavelet_used"] is False
          PY

      - name: Publish Llama 3.1 probe summary
        if: always()
        run: |
          if [ -f "$SAFE_OUTPUT" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["SAFE_OUTPUT"]).read_text())
          decision = value["decision"]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as handle:
              handle.write("# Llama 3.1 AgentHarm operational probe\n\n")
              handle.write(f"- runtime: **{value['status']}**\n")
              handle.write(f"- scientific signal: **{value['scientific_signal']}**\n")
              handle.write(
                  f"- completed episodes: **{decision['completed_episodes']}/3**\n"
              )
              handle.write(
                  f"- score coverage: **{decision['score_coverage']:.3f}**\n"
              )
              handle.write(
                  f"- forced-first tool calls: **{decision['forced_first_tool_calls']}**\n"
              )
              handle.write("- paper-valid result: **false**\n")
          PY
          fi

      - name: Upload safe Llama 3.1 probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: programmatic-agentharm-llama31-probe-safe
          path: ${{ env.SAFE_OUTPUT }}
          if-no-files-found: error
          retention-days: 14

      - name: Stop local target server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/llama-server/pid" ]; then
            kill "$(cat "$RUNNER_TEMP/llama-server/pid")" 2>/dev/null || true
          fi

      - name: Enforce operational probe
        if: always()
        run: exit "${PROBE_EXIT:-1}"

  sweep:
    needs:
      - plan
      - probe
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SAFE_OUTPUT: artifacts/programmatic-agentharm-llama31-development/${{ matrix.behavior.slug }}/safe_summary.json
      MODEL_DIR: /tmp/meta-llama-3.1-8b-instruct-q4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install \
            'openai>=1.75' \
            'git+https://github.com/UKGovernmentBEIS/inspect_evals.git@928e3dd92aa926f7dd1746c753e171f9f717c964'

      - name: Validate matched sweep implementation
        run: |
          ruff check \
            scripts/run_programmatic_agentharm_development_behavior.py \
            scripts/aggregate_programmatic_agentharm_development_sweep.py \
            scripts/run_programmatic_agentharm_smoke.py \
            src/jbspan/programmatic_agentharm/development_sweep.py \
            src/jbspan/programmatic_agentharm/runtime.py \
            tests/test_programmatic_agentharm_second_model.py
          bash -n scripts/prepare_programmatic_agentharm_llama31_runtime.sh
          pytest \
            tests/test_programmatic_agentharm_contract.py \
            tests/test_programmatic_agentharm_runtime.py \
            tests/test_programmatic_agentharm_development_sweep.py \
            tests/test_programmatic_agentharm_second_model.py
          git diff --check

      - name: Prepare pinned Llama 3.1 runtime
        run: bash scripts/prepare_programmatic_agentharm_llama31_runtime.sh

      - name: Run frozen matched behavior sweep
        run: |
          set +e
          timeout 180m python scripts/run_programmatic_agentharm_development_behavior.py \
            --root . \
            --development-config "$DEVELOPMENT_CONFIG" \
            --behavior-slug '${{ matrix.behavior.slug }}' \
            --attack-source-csv "$ATTACK_SOURCE" \
            --safe-output "$SAFE_OUTPUT"
          behavior_exit=$?
          set -e
          echo "BEHAVIOR_EXIT=$behavior_exit" >> "$GITHUB_ENV"

      - name: Verify safe behavior artifact boundary
        if: always()
        run: |
          test -f "$SAFE_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["SAFE_OUTPUT"]).read_text())
          forbidden_keys = {
              "prompt", "response", "raw_output", "tool_output",
              "generation", "arguments",
          }

          def visit(node):
              if isinstance(node, dict):
                  leaked = forbidden_keys.intersection(node)
                  if leaked:
                      raise SystemExit(f"unsafe artifact keys: {sorted(leaked)}")
                  for child in node.values():
                      visit(child)
              elif isinstance(node, list):
                  for child in node:
                      visit(child)

          visit(value)
          assert value["paper_validity"] is False
          assert value["development_only"] is True
          assert value["behavior"]["slug"] == "${{ matrix.behavior.slug }}"
          assert value["source_split_consumed"] == "confirmatory"
          assert value["future_confirmatory_use_forbidden"] is True
          assert value["human_judge_used"] is False
          assert value["llm_judge_used"] is False
          assert value["assistant_free_text_scored"] is False
          assert value["confirmatory_outputs_observed"] is False
          assert value["final_outputs_observed"] is False
          assert value["causal_oracle_opened"] is False
          assert value["wavelet_used"] is False
          PY

      - name: Publish behavior result
        if: always()
        run: |
          if [ -f "$SAFE_OUTPUT" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["SAFE_OUTPUT"]).read_text())
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as handle:
              handle.write("# Llama 3.1 matched AgentHarm sweep\n\n")
              handle.write(f"- behavior: **{value['behavior']['slug']}**\n")
              handle.write(f"- runtime: **{value['status']}**\n")
              handle.write(f"- signal: **{value['scientific_signal']}**\n")
              handle.write(
                  "- original success: "
                  f"**{value['original_programmatic_success']}**\n"
              )
              handle.write(
                  "- successful attacks: "
                  f"**{len(value['successful_candidate_ids'])}/"
                  f"{value['candidate_count']}**\n"
              )
              handle.write("- paper-valid result: **false**\n")
          PY
          fi

      - name: Upload safe matched behavior artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: programmatic-agentharm-llama31-development-${{ matrix.behavior.slug }}-safe
          path: ${{ env.SAFE_OUTPUT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local target server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/llama-server/pid" ]; then
            kill "$(cat "$RUNNER_TEMP/llama-server/pid")" 2>/dev/null || true
          fi

      - name: Enforce behavior operational completeness
        if: always()
        run: exit "${BEHAVIOR_EXIT:-1}"

  aggregate:
    needs:
      - plan
      - probe
      - sweep
    if: always()
    runs-on: ubuntu-24.04
    env:
      INPUTS_DIR: artifacts/programmatic-agentharm-llama31-inputs
      RAW_AGGREGATE: artifacts/programmatic-agentharm-llama31-aggregate/raw_summary.json
      SAFE_OUTPUT: artifacts/programmatic-agentharm-llama31-aggregate/safe_summary.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install aggregation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Download matched behavior artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: programmatic-agentharm-llama31-development-*-safe
          path: ${{ env.INPUTS_DIR }}

      - name: Aggregate matched second-model results
        run: |
          set +e
          python scripts/aggregate_programmatic_agentharm_development_sweep.py \
            --development-config "$DEVELOPMENT_CONFIG" \
            --inputs-dir "$INPUTS_DIR" \
            --safe-output "$RAW_AGGREGATE"
          aggregate_exit=$?
          set -e
          echo "AGGREGATE_EXIT=$aggregate_exit" >> "$GITHUB_ENV"

      - name: Apply frozen terminal decision rule
        if: always()
        run: |
          test -f "$RAW_AGGREGATE"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw_path = Path(os.environ["RAW_AGGREGATE"])
          output_path = Path(os.environ["SAFE_OUTPUT"])
          value = json.loads(raw_path.read_text())
          signal = value["scientific_signal"]
          decisions = {
              "BROAD_ELIGIBLE_ATTACK_SIGNAL":
                  "FREEZE_ELIGIBLE_CASES_THEN_BUILD_DEVELOPMENT_EXACT_COMPONENT_ORACLE",
              "SPARSE_ELIGIBLE_ATTACK_SIGNAL":
                  "STOP_AGENTHARM_AS_MAIN_PAPER_RETAIN_ONLY_CONTROLLED_CASE",
              "NO_ELIGIBLE_ATTACK_SIGNAL_ACROSS_DEVELOPMENT":
                  "STOP_AGENTHARM_PIVOT_RETURN_TO_NATURAL_LANGUAGE_LOCALIZATION",
              "DEVELOPMENT_SWEEP_RUNTIME_UNRESOLVED":
                  "FIX_RUNTIME_ONCE_WITHOUT_CHANGING_FROZEN_EXPERIMENT",
          }
          value["schema_version"] = (
              "programmatic-agentharm-llama31-terminal-decision-v1"
          )
          value["model_family"] = "Meta Llama 3.1"
          value["model_repo_id"] = (
              "bartowski/Meta-Llama-3.1-8B-Instruct-GGUF"
          )
          value["model_revision"] = (
              "bf5b95e96dac0462e2a09145ec66cae9a3f12067"
          )
          value["prior_qwen_signal"] = (
              "NO_ELIGIBLE_ATTACK_SIGNAL_ACROSS_DEVELOPMENT"
          )
          value["second_model_terminal_decision"] = decisions[signal]
          value["causal_oracle_opened"] = False
          value["wavelet_used"] = False
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(value, indent=2, sort_keys=True))
          PY

      - name: Verify terminal artifact boundary
        if: always()
        run: |
          test -f "$SAFE_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["SAFE_OUTPUT"]).read_text())
          forbidden_keys = {
              "prompt", "response", "raw_output", "tool_output",
              "generation", "arguments",
          }

          def visit(node):
              if isinstance(node, dict):
                  leaked = forbidden_keys.intersection(node)
                  if leaked:
                      raise SystemExit(f"unsafe artifact keys: {sorted(leaked)}")
                  for child in node.values():
                      visit(child)
              elif isinstance(node, list):
                  for child in node:
                      visit(child)

          visit(value)
          assert value["paper_validity"] is False
          assert value["development_only"] is True
          assert value["prior_qwen_signal"] == (
              "NO_ELIGIBLE_ATTACK_SIGNAL_ACROSS_DEVELOPMENT"
          )
          assert value["human_judge_used"] is False
          assert value["llm_judge_used"] is False
          assert value["assistant_free_text_scored"] is False
          assert value["confirmatory_outputs_observed"] is False
          assert value["final_outputs_observed"] is False
          assert value["causal_oracle_opened"] is False
          assert value["wavelet_used"] is False
          PY

      - name: Publish terminal feasibility decision
        if: always()
        run: |
          if [ -f "$SAFE_OUTPUT" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["SAFE_OUTPUT"]).read_text())
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as handle:
              handle.write("# AgentHarm second-model terminal decision\n\n")
              handle.write(f"- operational status: **{value['status']}**\n")
              handle.write(f"- scientific signal: **{value['scientific_signal']}**\n")
              handle.write(
                  f"- eligible behaviors: **{value['eligible_behavior_count']}/6**\n"
              )
              handle.write(
                  "- distinct successful candidates: "
                  f"**{value['distinct_successful_candidate_count']}/5**\n"
              )
              handle.write(
                  "- terminal decision: "
                  f"**{value['second_model_terminal_decision']}**\n"
              )
              handle.write("- causal oracle opened: **false**\n")
              handle.write("- paper-valid result: **false**\n")
          PY
          fi

      - name: Upload safe terminal decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: programmatic-agentharm-llama31-terminal-decision-safe
          path: ${{ env.SAFE_OUTPUT }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce operational completeness
        if: always()
        run: exit "${AGGREGATE_EXIT:-1}"
