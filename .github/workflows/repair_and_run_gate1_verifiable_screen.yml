name: repair-and-run-verifiable-agent-screen

on:
  push:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/repair_and_run_gate1_verifiable_screen.yml

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: repair-and-run-verifiable-agent-screen
  cancel-in-progress: true

jobs:
  materialize-and-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MODEL_REF: Qwen/Qwen2.5-7B-Instruct-GGUF:Q4_K_M
      CONFIG: configs/gate1/gate1_verifiable_agent.json
      SCREEN_OUTPUT: artifacts/gate1-verifiable-agent-screen/screen.json
      PIP_NO_CACHE_DIR: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate1-contract
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decode the already-uploaded frozen screen-v2 payload
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import re
          from pathlib import Path

          source = Path(
              ".github/workflows/bootstrap_and_run_gate1_verifiable_screen_v2.yml"
          )
          text = source.read_text(encoding="utf-8")
          match = re.search(
              r"<<'PAYLOAD_B64'\n(.*?)\n\s*PAYLOAD_B64",
              text,
              flags=re.DOTALL,
          )
          if match is None:
              raise SystemExit("frozen screen-v2 payload marker not found")
          encoded = "".join(line.strip() for line in match.group(1).splitlines())
          payload = base64.b64decode(encoded, validate=True)
          observed = hashlib.sha256(payload).hexdigest()
          expected = "461ae720c45f4bd0e20d2f8589de9428f07d6d75614890c09e97695b9825a189"
          if observed != expected:
              raise SystemExit(
                  f"frozen payload digest mismatch: observed={observed} expected={expected}"
              )
          Path("/tmp/gate1-verifiable-agent-screen-v2.tar.gz").write_bytes(payload)
          PY
          tar -xzf /tmp/gate1-verifiable-agent-screen-v2.tar.gz -C .
          rm -f .github/workflows/gate1_verifiable_agent.yml

      - name: Repair the two operational defects without changing the scientific contract
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/jbspan/gate1/verifiable_agent.py")
          text = source.read_text(encoding="utf-8")
          text = text.replace(
              "from dataclasses import asdict, dataclass\n"
              "from pathlib import Path\n"
              "from typing import Iterable, Protocol\n",
              "from collections.abc import Iterable\n"
              "from dataclasses import asdict, dataclass\n"
              "from pathlib import Path\n"
              "from typing import Protocol\n",
          )
          source.write_text(text, encoding="utf-8")

          runner = Path("scripts/run_verifiable_agent_gate1.py")
          text = runner.read_text(encoding="utf-8")
          text = text.replace(
              "from dataclasses import asdict\n"
              "from pathlib import Path\n"
              "from typing import Iterable\n",
              "from collections.abc import Iterable\n"
              "from dataclasses import asdict\n"
              "from pathlib import Path\n",
          )
          runner.write_text(text, encoding="utf-8")

          for workflow in (
              Path(".github/workflows/gate1_verifiable_agent_screen.yml"),
              Path(".github/workflows/gate1_verifiable_agent_final_oracle.yml"),
          ):
              text = workflow.read_text(encoding="utf-8")
              workflow.write_text(text.replace("          cache: pip\n", ""), encoding="utf-8")

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          old = (
              "  verifiable-agent-screen:\n"
              "    if: github.event_name == 'pull_request' && "
              "github.head_ref == 'agent/gate1-contract'\n"
          )
          new = (
              "  verifiable-agent-screen:\n"
              "    if: false  # superseded by the physically separated screen workflow\n"
          )
          if old in text:
              ci.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif "    if: false  # superseded by the physically separated screen workflow" not in text:
              raise SystemExit("superseded CI screen condition not found")
          PY
          git rm -f --ignore-unmatch data/gate1/verifiable_agent_screen_runtime.zip

      - name: Validate code, contracts, mocks, and physical seals
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' pyyaml
          python -m json.tool "$CONFIG" >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in (
              Path(".github/workflows/gate1_verifiable_agent_screen.yml"),
              Path(".github/workflows/gate1_verifiable_agent_final_oracle.yml"),
          ):
              value = yaml.safe_load(path.read_text(encoding="utf-8"))
              assert isinstance(value, dict)
          config = json.loads(Path("configs/gate1/gate1_verifiable_agent.json").read_text())
          assert config["schema_version"] == "gate1-verifiable-agent-v2"
          assert config["pipeline_revision"] == "screen-final-physical-separation-v1"
          assert config["claim_boundary"]["final_split_physically_sealed_during_screen"]
          assert config["claim_boundary"]["oracle_physically_sealed_during_screen"]
          PY
          ruff check --fix \
            src/jbspan/gate1/verifiable_agent.py \
            scripts/run_verifiable_agent_gate1.py \
            tests/test_verifiable_agent_gate1.py
          ruff check \
            src/jbspan/gate1/verifiable_agent.py \
            scripts/run_verifiable_agent_gate1.py \
            tests/test_verifiable_agent_gate1.py
          mypy src/jbspan
          pytest tests/test_verifiable_agent_gate1.py
          git diff --check

      - name: Commit the physically separated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f --ignore-unmatch \
            .github/workflows/gate1_verifiable_agent.yml \
            .github/workflows/bootstrap_and_run_gate1_verifiable_screen_v2.yml \
            .github/workflows/repair_and_run_gate1_verifiable_screen.yml
          git add -- \
            .github/workflows/ci.yml \
            .github/workflows/gate1_verifiable_agent_screen.yml \
            .github/workflows/gate1_verifiable_agent_final_oracle.yml \
            configs/gate1/gate1_verifiable_agent.json \
            docs/GATE1_VERIFIABLE_AGENT_PROTOCOL.md \
            scripts/run_verifiable_agent_gate1.py \
            src/jbspan/gate1/verifiable_agent.py \
            tests/test_verifiable_agent_gate1.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Repair and run physically separated verifiable-agent Gate 1 screen"
            git push origin HEAD:agent/gate1-contract
          fi

      - name: Install official llama.cpp runtime
        run: |
          curl -LsSf https://llama.app/install.sh | \
            SKIP_CUDA=1 SKIP_ROCM=1 SKIP_VULKAN=1 sh
          ~/.llama-app/llama --version

      - name: Start Qwen2.5-7B-Instruct sandbox model
        run: |
          export HF_HOME="$RUNNER_TEMP/huggingface"
          mkdir -p "$HF_HOME" "$RUNNER_TEMP/llama-server"
          nohup ~/.llama-app/llama serve \
            -hf "$MODEL_REF" \
            --host 127.0.0.1 \
            --port 8080 \
            -c 6144 \
            -t 4 \
            >"$RUNNER_TEMP/llama-server/server.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/llama-server/pid"
          ready=0
          for _ in $(seq 1 180); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/llama-server/pid")" 2>/dev/null; then
              tail -n 100 "$RUNNER_TEMP/llama-server/server.log"
              exit 1
            fi
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8080/health || true)"
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = "1"

      - name: Run actual calibration and untouched confirmatory screen only
        run: |
          mkdir -p "$(dirname "$SCREEN_OUTPUT")"
          timeout 250m python scripts/run_verifiable_agent_gate1.py screen \
            --config "$CONFIG" \
            --server-url http://127.0.0.1:8080 \
            --output "$SCREEN_OUTPUT"

      - name: Verify that final and oracle outputs remain sealed
        run: |
          test "$(jq -r '.sealed_state.final_outputs_observed' "$SCREEN_OUTPUT")" = "false"
          test "$(jq -r '.sealed_state.oracle_outputs_observed' "$SCREEN_OUTPUT")" = "false"
          test "$(jq -r 'has("final_records")' "$SCREEN_OUTPUT")" = "false"
          test "$(jq -r 'has("oracle_selected_keys")' "$SCREEN_OUTPUT")" = "false"
          {
            echo '# Actual programmatically verifiable Gate 1 screen'
            echo
            echo "- status: **$(jq -r '.status' "$SCREEN_OUTPUT")**"
            echo "- selected programs: **$(jq -c '.selected_programs' "$SCREEN_OUTPUT")**"
            echo "- confirmatory eligible: **$(jq -r '.confirmatory_summary.eligible_count' "$SCREEN_OUTPUT")/15**"
            echo "- eligible programs: **$(jq -r '.confirmatory_summary.eligible_programs | length' "$SCREEN_OUTPUT")**"
            echo "- baseline utility: **$(jq -r '.confirmatory_summary.baseline_utility_count' "$SCREEN_OUTPUT")/15**"
            echo "- payload-only safe utility: **$(jq -r '.confirmatory_summary.payload_only_safe_utility_count' "$SCREEN_OUTPUT")/15**"
            echo "- parse coverage: **$(jq -r '.confirmatory_summary.parse_coverage' "$SCREEN_OUTPUT")**"
            echo "- model calls: **$(jq -r '.model_call_count' "$SCREEN_OUTPUT")**"
            echo '- final/oracle outputs observed: **false**'
            echo '- human/LLM judge used: **false**'
            echo '- real-world side effects: **false**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe screen artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-verifiable-agent-screen-repaired
          path: ${{ env.SCREEN_OUTPUT }}
          if-no-files-found: warn
          retention-days: 30

      - name: Persist immutable safe screen result
        if: success()
        run: |
          target="data/gate1/verifiable_agent_screen"
          rm -rf "$target"
          mkdir -p "$target"
          cp "$SCREEN_OUTPUT" "$target/screen.json"
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg sha "$(git rev-parse HEAD)" \
            '{github_run_id:$run_id,github_run_url:$run_url,implementation_sha:$sha}' \
            >"$target/runtime.json"
          git fetch origin agent/gate1-contract
          git rebase origin/agent/gate1-contract
          git add -- "$target"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Record repaired verifiable-agent Gate 1 screen [skip ci]"
            git push origin HEAD:agent/gate1-contract
          fi

      - name: Report result to PR 3
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$SCREEN_OUTPUT" ]; then
            result="$(jq -r '.status' "$SCREEN_OUTPUT")"
            eligible="$(jq -r '.confirmatory_summary.eligible_count' "$SCREEN_OUTPUT")"
            programs="$(jq -r '.confirmatory_summary.eligible_programs | length' "$SCREEN_OUTPUT")"
          else
            result="OPERATIONAL_FAILURE"
            eligible="n/a"
            programs="n/a"
          fi
          gh pr comment 3 --body "Repaired verifiable-agent Gate 1 screen: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — status **$result**, eligible **$eligible/15**, eligible programs **$programs**. Final/oracle remained sealed; human/LLM judge used: false; real-world side effects: false." || true

      - name: Stop local model server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/llama-server/pid" ]; then
            kill "$(cat "$RUNNER_TEMP/llama-server/pid")" 2>/dev/null || true
          fi
          rm -rf "$RUNNER_TEMP/huggingface"
