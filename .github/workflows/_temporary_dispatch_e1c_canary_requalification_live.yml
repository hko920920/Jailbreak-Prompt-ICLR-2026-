name: temporary-repair-e1c-canary-requalification-dispatch

"on":
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_dispatch_e1c_canary_requalification_live.yml

permissions:
  contents: write

concurrency:
  group: temporary-repair-e1c-canary-requalification-dispatch
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out current research branch
        uses: actions/checkout@v4
        with:
          ref: agent/programmatic-agentharm-pivot
          fetch-depth: 0

      - name: Repair feature-branch trigger and preserve failure evidence
        env:
          TARGET_BRANCH: agent/programmatic-agentharm-pivot
          FAILED_RUN_ID: "32925146558"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          live = Path(
              ".github/workflows/"
              "evaluator_panel_e1c_canary_requalification_live.yml"
          )
          text = live.read_text(encoding="utf-8")
          trigger = (
              "      - .github/workflows/"
              "evaluator_panel_e1c_canary_requalification_live.yml\n"
          )
          anchor = (
              "      - data/natural_language_localization/evaluator_panel_v1/"
              "e1c_canary_requalification_selection_v1.safe.jsonl\n"
          )
          if trigger not in text:
              if anchor not in text:
                  raise SystemExit("live workflow push-path anchor is missing")
              text = text.replace(anchor, anchor + trigger, 1)
              live.write_text(text, encoding="utf-8")
          if text.count(trigger) != 1:
              raise SystemExit("live workflow self-trigger is not unique")

          record = {
              "schema_version": (
                  "e1c-canary-requalification-dispatch-repair-safe-v1"
              ),
              "classification": (
                  "OPERATIONAL_WORKFLOW_DISPATCH_404_NOT_SCIENTIFIC_FAILURE"
              ),
              "failed_run_id": int(os.environ["FAILED_RUN_ID"]),
              "failure_stage": "workflow_dispatch_lookup",
              "failure_reason": (
                  "workflow file was not present on the default branch"
              ),
              "model_weight_downloaded": False,
              "model_inference_performed": False,
              "paired_invariance_predictions_generated": False,
              "scientific_contract_changed": False,
              "model_changed": False,
              "selection_changed": False,
              "prompt_changed": False,
              "thresholds_changed": False,
              "parser_changed": False,
              "repair": (
                  "add feature-branch push self-trigger to the frozen live workflow"
              ),
              "stage_a_opened": False,
              "heldout_opened": False,
              "causal_oracle_opened": False,
              "keep_only_oracle_opened": False,
              "wavelet_used": False,
              "raw_text_recorded": False,
          }
          record_path = Path(
              "data/natural_language_localization/evaluator_panel_v1/"
              "e1c_canary_requalification_dispatch_repair.safe.json"
          )
          record_path.parent.mkdir(parents=True, exist_ok=True)
          record_path.write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          rm -f \
            .github/workflows/_temporary_dispatch_e1c_canary_requalification_live.yml
          python - <<'PY'
          from pathlib import Path

          live = Path(
              ".github/workflows/"
              "evaluator_panel_e1c_canary_requalification_live.yml"
          ).read_text(encoding="utf-8")
          assert (
              "      - .github/workflows/"
              "evaluator_panel_e1c_canary_requalification_live.yml\n"
          ) in live
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/evaluator_panel_e1c_canary_requalification_live.yml \
            .github/workflows/_temporary_dispatch_e1c_canary_requalification_live.yml \
            data/natural_language_localization/evaluator_panel_v1/e1c_canary_requalification_dispatch_repair.safe.json
          git commit -m \
            "Repair E1C paired-invariance feature-branch trigger"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
