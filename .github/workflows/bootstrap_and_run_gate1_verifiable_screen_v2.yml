name: bootstrap-and-run-verifiable-agent-screen-v2

on:
  push:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/bootstrap_and_run_gate1_verifiable_screen_v2.yml

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: bootstrap-and-run-verifiable-agent-screen-v2
  cancel-in-progress: true

