name: temporary-fix-gcg-status-probe

on:
  pull_request:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/_temporary_fix_gcg_status_probe.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query lint repair run
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_BRANCH: agent/programmatic-agentharm-pivot
          TARGET_NAME: temporary-fix-gcg-audit-lint
        run: |
          set -euo pipefail
          mkdir -p artifacts/fix-gcg-status
          runs="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${ACTIVE_BRANCH}&per_page=100")"
          jq --arg name "$TARGET_NAME" '
            [ .workflow_runs[] | select(.name == $name) ]
            | sort_by(.created_at) | reverse
            | {
                schema_version: "temporary-fix-gcg-status-v1",
                latest: (.[0] // null | if . == null then null else {
                  id, run_number, head_sha, status, conclusion,
                  created_at, updated_at, run_started_at, html_url
                } end),
                raw_prompt_or_response_included: false,
                scientific_contract_changed: false
              }
          ' <<<"$runs" > artifacts/fix-gcg-status/latest.safe.json
          cat artifacts/fix-gcg-status/latest.safe.json

      - uses: actions/upload-artifact@v4
        with:
          name: temporary-fix-gcg-status-safe
          path: artifacts/fix-gcg-status/latest.safe.json
          if-no-files-found: error
          retention-days: 2
