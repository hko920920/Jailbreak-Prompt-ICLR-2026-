name: evaluator-panel-e1a-static-hardening

on:
  pull_request:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/evaluator_panel_e1a_static_hardening.yml
      - configs/natural_language_localization/evaluator_panel_e1a_static_hardening_v1.json
      - docs/EVALUATOR_PANEL_E1A_STATIC_HARDENING.md
      - scripts/run_evaluator_panel_e1a.py
      - src/jbspan/evaluator_panel.py
      - tests/test_evaluator_panel.py
      - data/gate1/v2/wildguard_q8/wildguard_selection_metrics.json
      - data/gate1/v2/wildguard_q8/wildguard_decision.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluator-panel-e1a-static-hardening
  cancel-in-progress: false

jobs:
  e1a:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONTRACT: configs/natural_language_localization/evaluator_panel_e1a_static_hardening_v1.json
      SAFE_OUTPUT: artifacts/evaluator-panel-e1a/e1a_static_hardening.safe.json
      WILDGUARD_REVISION: 495b9dc837be594c6c5665b0f7f56169baf0d5be
      HARMBENCH_REVISION: 8e1604d1171fe8a48d8febecd22f600e462bdcdd
      STRONG_REJECT_REVISION: 7a551d5b440ec7b75d4f6f5bb7c1719965b76b47

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and validate E1A code
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check \
            src/jbspan/evaluator_panel.py \
            scripts/run_evaluator_panel_e1a.py \
            tests/test_evaluator_panel.py
          mypy src/jbspan
          pytest tests/test_evaluator_panel.py
          python -m json.tool "$CONTRACT" >/dev/null
          git diff --check

      - name: Verify pinned official source and blob identities
        run: |
          verify_repo() {
            repository="$1"
            revision="$2"
            shift 2
            work="$RUNNER_TEMP/$(basename "$repository")-${revision:0:8}"
            git init -q "$work"
            git -C "$work" remote add origin "https://github.com/${repository}.git"
            git -C "$work" fetch -q --depth 1 origin "$revision"
            git -C "$work" checkout -q --detach FETCH_HEAD
            test "$(git -C "$work" rev-parse HEAD)" = "$revision"
            while [ "$#" -gt 0 ]; do
              path="$1"
              expected_blob="$2"
              shift 2
              test "$(git -C "$work" rev-parse "HEAD:$path")" = "$expected_blob"
            done
          }

          verify_repo allenai/wildguard "$WILDGUARD_REVISION" \
            wildguard/wildguard.py 3613afed3aa51437808da1be899e8c3944c170b0 \
            wildguard/utils.py e91b44df534625f6f1bab8096a93101800778dfd

          verify_repo centerforaisafety/HarmBench "$HARMBENCH_REVISION" \
            eval_utils.py be95edd9523de0cde2a7823217b26983d57c496b \
            evaluate_completions.py b6aff5e0bfe303333ad7c88cb268fb7533cb9596 \
            configs/model_configs/models.yaml 024dc7fd61233c6efcd8234bea648e0735d67b72

          verify_repo dsbowen/strong_reject "$STRONG_REJECT_REVISION" \
            strong_reject/evaluate.py 13186e182ffe9893c456d602dc0e88387098e101 \
            strong_reject/eval_files/judge_templates.json d5cf8ebbd627181fbe81adf0529c0bfaaaf8bd9d

      - name: Execute frozen E1A static hardening gate
        run: |
          python scripts/run_evaluator_panel_e1a.py \
            --root . \
            --contract "$CONTRACT" \
            --safe-output "$SAFE_OUTPUT"

      - name: Verify safe result and sealed boundaries
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["SAFE_OUTPUT"]).read_text())
          assert result["status"] == "EVALUATOR_PANEL_E1A_STATIC_HARDENING_PASS"
          assert result["operational_pass"] is True
          assert result["paper_validity"] is False
          assert result["static_check_count"] == 18
          assert result["static_check_pass_count"] == 18
          assert result["failed_static_checks"] == []
          assert result["wildguard_predecessor"]["identity_match"] is True
          assert result["wildguard_predecessor"]["selection_passed_former_gate"] is False
          assert result["stage_a_opened"] is False
          assert result["gate1_evaluation_30_opened"] is False
          assert result["gate2_heldout_opened"] is False
          assert result["causal_oracle_opened"] is False
          assert result["wavelet_used"] is False
          assert result["next_authorized_operation"] == (
              "E1B_WILDGUARD_LIVE_REPRODUCTION_AND_CANARIES"
          )
          PY

      - name: Publish E1A summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["SAFE_OUTPUT"]).read_text())
          wildguard = result["wildguard_predecessor"]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as handle:
              handle.write("# Evaluator Panel E1A\n\n")
              handle.write(f"- status: **{result['status']}**\n")
              handle.write(
                  f"- static checks: **{result['static_check_pass_count']}/"
                  f"{result['static_check_count']}**\n"
              )
              handle.write(
                  "- official source identities: **verified by exact commit and blob**\n"
              )
              handle.write(
                  f"- predecessor WildGuard macro-F1: "
                  f"**{wildguard['metrics']['macro_f1']:.10f}**\n"
              )
              handle.write("- predecessor primary-judge decision: **fail preserved**\n")
              handle.write("- Stage A / causal oracle / wavelet: **closed / closed / closed**\n")
          PY

      - name: Upload safe E1A artifact
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-panel-e1a-static-hardening-safe
          path: ${{ env.SAFE_OUTPUT }}
          if-no-files-found: error
          retention-days: 30
