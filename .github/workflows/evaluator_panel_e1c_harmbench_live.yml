name: evaluator-panel-e1c-harmbench-live

# Frozen component qualification only. This evaluates the predeclared 200-record
# human-majority validation selection plus repeatability and injection canaries.
"on":
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/evaluator_panel_e1c_harmbench_live.yml
      - configs/natural_language_localization/evaluator_panel_e1c_harmbench_live_contract_v1.json
      - scripts/run_evaluator_panel_e1c_harmbench_live.py
      - scripts/run_evaluator_panel_e1c_harmbench_live_ci.sh
      - tests/test_evaluator_panel_e1c_harmbench_live.py
      - docs/EVALUATOR_PANEL_E1C_HARMBENCH_LIVE_EXECUTION_V1.md
      - data/natural_language_localization/evaluator_panel_v1/e1c_harmbench_live_contract.safe.json
      - data/natural_language_localization/evaluator_panel_v1/e1c_prompt_source_freeze_v3.safe.json
      - data/natural_language_localization/evaluator_panel_v1/e1c_harmbench_prompt_manifest_v3.safe.jsonl
      - data/natural_language_localization/evaluator_panel_v1/e1c_harmbench_selection_v2.safe.jsonl
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evaluator-panel-e1c-harmbench-live
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TARGET_BRANCH: agent/programmatic-agentharm-pivot
      ROOT: ${{ github.workspace }}
      SOURCE_ROOT: upstream/HarmBench
      CONTRACT: configs/natural_language_localization/evaluator_panel_e1c_harmbench_live_contract_v1.json
      SAFE_DIR: artifacts/evaluator-panel-e1c-harmbench-live/safe
      SAFE_RESULT: artifacts/evaluator-panel-e1c-harmbench-live/safe/e1c_harmbench_live.safe.json
      PRIVATE_DIR: /tmp/e1c-harmbench-private
      MODEL_DIR: /tmp/e1c-harmbench-model
      TOOLS_DIR: /tmp/e1c-harmbench-tools
      SERVER_URL: http://127.0.0.1:8081
      RECORD_ROOT: data/natural_language_localization/evaluator_panel_v1
      RECORD_DIR: data/natural_language_localization/evaluator_panel_v1/e1c_harmbench_live
      RECORD_RESULT: data/natural_language_localization/evaluator_panel_v1/e1c_harmbench_live.safe.json
      RUN_RECORD: data/natural_language_localization/evaluator_panel_v1/e1c_harmbench_live_run.safe.json
      PIP_NO_CACHE_DIR: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out frozen research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Check out immutable HarmBench source
        uses: actions/checkout@v4
        with:
          repository: centerforaisafety/HarmBench
          ref: 8e1604d1171fe8a48d8febecd22f600e462bdcdd
          path: ${{ env.SOURCE_ROOT }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate frozen live implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8.2' 'ruff>=0.6'
          ruff check \
            scripts/run_evaluator_panel_e1c_harmbench_live.py \
            tests/test_evaluator_panel_e1c_harmbench_live.py
          python -m pytest -q tests/test_evaluator_panel_e1c_harmbench_live.py
          python -m py_compile scripts/run_evaluator_panel_e1c_harmbench_live.py
          bash -n scripts/run_evaluator_panel_e1c_harmbench_live_ci.sh
          python -m json.tool "$CONTRACT" >/dev/null
          test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = \
            "8e1604d1171fe8a48d8febecd22f600e462bdcdd"
          git diff --check

      - name: Execute frozen 448-request HarmBench qualification
        run: bash scripts/run_evaluator_panel_e1c_harmbench_live_ci.sh

      - name: Audit safe result and privacy boundary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          safe_dir = Path(os.environ["SAFE_DIR"])
          result_path = Path(os.environ["SAFE_RESULT"])
          if not result_path.is_file():
              raise SystemExit("E1C live harness produced no terminal safe result")
          result = json.loads(result_path.read_text(encoding="utf-8"))
          allowed = {
              "E1C_HARMBENCH_COMPONENT_PASS",
              "E1C_HARMBENCH_COMPONENT_SCIENTIFIC_FAIL",
              "E1C_HARMBENCH_COMPONENT_OPERATIONAL_FAIL",
          }
          if result.get("status") not in allowed:
              raise SystemExit(f"unexpected E1C terminal status: {result.get('status')}")
          assert result["paper_validity"] is False
          assert result["new_harmful_attack_outputs_generated"] is False
          assert result["semantic_only_stage_a_opened"] is False
          assert result["cross_regime_stage_a_opened"] is False
          assert result["prior_evaluation_opened"] is False
          assert result["heldout_opened"] is False
          assert result["causal_oracle_opened"] is False
          assert result["keep_only_oracle_opened"] is False
          assert result["wavelet_used"] is False
          forbidden = (
              '"raw_output":',
              '"prompt":',
              '"raw_prompt_private":',
              '"hardened_prompt_private":',
              '"generation_private":',
              '"behavior_private":',
              '"context_private":',
              '"test_case":',
              '"generation":',
              '"behavior_text":',
          )
          for path in safe_dir.rglob("*"):
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8").lower()
              for token in forbidden:
                  if token in text:
                      raise SystemExit(f"forbidden raw field in safe artifact: {path}: {token}")
          print(json.dumps({
              "status": result["status"],
              "operational_pass": result["operational_pass"],
              "scientific_pass": result["scientific_pass"],
              "next_authorized_operation": result["next_authorized_operation"],
          }, sort_keys=True))
          PY

      - name: Upload complete safe E1C artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-panel-e1c-harmbench-live-safe
          path: ${{ env.SAFE_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Commit terminal safe records
        if: always()
        run: |
          test -f "$SAFE_RESULT"
          rm -rf "$RECORD_DIR"
          mkdir -p "$RECORD_DIR" "$RECORD_ROOT"
          cp -a "$SAFE_DIR"/. "$RECORD_DIR"/
          cp "$SAFE_RESULT" "$RECORD_RESULT"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RECORD_RESULT"])
          result = json.loads(result_path.read_text(encoding="utf-8"))
          record_dir = Path(os.environ["RECORD_DIR"])
          files = sorted(path for path in record_dir.rglob("*") if path.is_file())
          run_record = {
              "schema_version": "e1c-harmbench-live-run-safe-v1",
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "head_sha_at_start": os.environ["GITHUB_SHA"],
              "terminal_status": result["status"],
              "operational_pass": result["operational_pass"],
              "scientific_pass": result["scientific_pass"],
              "next_authorized_operation": result["next_authorized_operation"],
              "result_sha256": hashlib.sha256(result_path.read_bytes()).hexdigest(),
              "safe_file_count": len(files),
              "safe_file_manifest_sha256": hashlib.sha256(
                  "\n".join(
                      f"{path.relative_to(record_dir)}:{hashlib.sha256(path.read_bytes()).hexdigest()}"
                      for path in files
                  ).encode("utf-8")
              ).hexdigest(),
              "paper_validity": False,
              "new_harmful_attack_outputs_generated": False,
              "stage_a_opened": False,
              "heldout_opened": False,
              "causal_oracle_opened": False,
              "keep_only_oracle_opened": False,
              "wavelet_used": False,
              "raw_text_recorded": False,
          }
          Path(os.environ["RUN_RECORD"]).write_text(
              json.dumps(run_record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RECORD_DIR" "$RECORD_RESULT" "$RUN_RECORD"
          if git diff --cached --quiet; then
            echo "Terminal safe records are already current."
            exit 0
          fi
          git commit -m "Record E1C HarmBench live qualification result"
          git fetch origin "$TARGET_BRANCH"
          frozen_inputs=(
            configs/natural_language_localization/evaluator_panel_e1c_harmbench_live_contract_v1.json
            "$RECORD_ROOT/e1c_harmbench_live_contract.safe.json"
            "$RECORD_ROOT/e1c_prompt_source_freeze_v3.safe.json"
            "$RECORD_ROOT/e1c_harmbench_prompt_manifest_v3.safe.jsonl"
            "$RECORD_ROOT/e1c_harmbench_selection_v2.safe.jsonl"
          )
          if ! git diff --quiet "$GITHUB_SHA" "origin/$TARGET_BRANCH" -- \
            "${frozen_inputs[@]}"; then
            echo "Frozen E1C inputs changed during live execution." >&2
            exit 1
          fi
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Surface operational failure after preserving evidence
        if: always()
        run: |
          test -f "$SAFE_RESULT"
          status="$(jq -r '.status' "$SAFE_RESULT")"
          if [[ "$status" == "E1C_HARMBENCH_COMPONENT_OPERATIONAL_FAIL" ]]; then
            echo "E1C live qualification ended in an operational failure." >&2
            exit 1
          fi
