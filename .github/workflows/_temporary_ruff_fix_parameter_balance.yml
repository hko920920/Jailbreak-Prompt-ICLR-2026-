name: temporary-ruff-fix-parameter-balance

on:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_ruff_fix_parameter_balance.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-ruff-fix-parameter-balance
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/programmatic-agentharm-pivot
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply only Ruff's deterministic import fix
        run: |
          python -m pip install 'ruff==0.16.4'
          ruff check --fix scripts/run_e0_deepinception_parameter_balance.py
          ruff check scripts/run_e0_deepinception_parameter_balance.py
          git diff --check

      - name: Commit deterministic formatting fix
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No Ruff changes were required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_e0_deepinception_parameter_balance.py
          git commit -m 'Apply Ruff import ordering to parameter audit'
          git push origin HEAD:agent/programmatic-agentharm-pivot
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
