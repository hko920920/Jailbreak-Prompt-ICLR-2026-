name: temporary-sanitize-gcg-safe-output

on:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_sanitize_gcg_safe_output.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-sanitize-gcg-safe-output
  cancel-in-progress: false

jobs:
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIVE_BRANCH: agent/programmatic-agentharm-pivot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACTIVE_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove raw control text from safe aggregate only
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run_e0_gcg_static_audit.py")
          text = path.read_text(encoding="utf-8")
          old = '''        "observed_template_defaults": {
              **defaults_checked,
              "control_init_lexical_units": observed_control_units,
              "control_init_sha256": sha256_bytes(control_init.encode("utf-8")),
          },'''
          new = '''        "observed_template_defaults": {
              **{
                  key: value
                  for key, value in defaults_checked.items()
                  if key != "control_init"
              },
              "control_init_lexical_units": observed_control_units,
              "control_init_sha256": sha256_bytes(control_init.encode("utf-8")),
          },'''
          if text.count(old) != 1:
              raise SystemExit("GCG safe-default block did not match exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m pip install 'pytest==9.1.1' 'ruff==0.16.4'
          ruff check scripts/run_e0_gcg_static_audit.py tests/test_e0_gcg_static_audit.py
          pytest -q tests/test_e0_gcg_static_audit.py
          git diff --check

      - name: Commit safe-record-only repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/run_e0_gcg_static_audit.py
          git commit -m "Sanitize GCG static audit safe aggregate"
          for attempt in 1 2 3; do
            git fetch origin "$ACTIVE_BRANCH"
            git rebase "origin/$ACTIVE_BRANCH"
            if git push origin "HEAD:$ACTIVE_BRANCH"; then
              exit 0
            fi
          done
          exit 1
