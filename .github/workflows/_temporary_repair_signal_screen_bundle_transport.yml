name: temporary-repair-signal-screen-bundle-transport

"on":
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_repair_signal_screen_bundle_transport.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/programmatic-agentharm-pivot
  INSTALLER: .github/workflows/_temporary_install_signal_screen_manifest_bundle.yml
  EXPECTED_RAW_SHA256: 33d1be52693b185c202adb1463439df6c95d54cf0e5ae3da47f0e40bfee3ec16

jobs:
  repair-and-install-non-workflow-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore verified non-workflow files from repaired bundle
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import zlib
          from pathlib import Path

          installer = Path(os.environ["INSTALLER"])
          text = installer.read_text(encoding="utf-8")
          old = "IFvRx6hAKEWZE"
          new = "IFvRx6jAKEWZE"
          if text.count(old) != 1:
              raise RuntimeError("expected exactly one corrupted transport symbol")
          repaired = text.replace(old, new, 1)
          match = re.search(r'encoded = "([A-Za-z0-9+/=]+)"', repaired)
          if match is None:
              raise RuntimeError("embedded bundle not found")
          raw = zlib.decompress(base64.b64decode(match.group(1), validate=True))
          observed = hashlib.sha256(raw).hexdigest()
          if observed != os.environ["EXPECTED_RAW_SHA256"]:
              raise RuntimeError(f"repaired bundle SHA mismatch: {observed}")
          files = json.loads(raw)
          allowed = {
              "scripts/freeze_h4rm3l_gcg_signal_screen_input_manifest.py",
              "tests/test_h4rm3l_gcg_signal_screen_input_manifest.py",
              "docs/H4RM3L_GCG_SIGNAL_SCREEN_INPUT_MANIFEST_V1.md",
          }
          expected_workflow = (
              ".github/workflows/"
              "h4rm3l_gcg_signal_screen_input_manifest.yml"
          )
          if set(files) != allowed | {expected_workflow}:
              raise RuntimeError("unexpected validated-bundle membership")
          for relative in sorted(allowed):
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(files[relative], encoding="utf-8")
          PY

      - name: Validate restored implementation
        run: |
          python -m pip install 'pytest>=8.2' 'ruff==0.16.4'
          targets=(
            scripts/freeze_h4rm3l_gcg_signal_screen_input_manifest.py
            tests/test_h4rm3l_gcg_signal_screen_input_manifest.py
          )
          ruff check "${targets[@]}"
          python -m pytest -q \
            tests/test_h4rm3l_gcg_signal_screen_input_manifest.py
          python -m py_compile \
            scripts/freeze_h4rm3l_gcg_signal_screen_input_manifest.py
          python -m json.tool \
            configs/natural_language_localization/h4rm3l_gcg_signal_screen_input_manifest_v1.json \
            >/dev/null
          git diff --check

      - name: Commit verified non-workflow implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/freeze_h4rm3l_gcg_signal_screen_input_manifest.py \
            tests/test_h4rm3l_gcg_signal_screen_input_manifest.py \
            docs/H4RM3L_GCG_SIGNAL_SCREEN_INPUT_MANIFEST_V1.md
          git commit -m \
            "Install verified h4rm3l-GCG manifest implementation"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
