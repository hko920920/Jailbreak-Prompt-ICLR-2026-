name: temporary-repair-signal-screen-bundle-transport

"on":
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_repair_signal_screen_bundle_transport.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/programmatic-agentharm-pivot
  INSTALLER: .github/workflows/_temporary_install_signal_screen_manifest_bundle.yml
  EXPECTED_RAW_SHA256: 33d1be52693b185c202adb1463439df6c95d54cf0e5ae3da47f0e40bfee3ec16

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Repair one corrupted base64 symbol and verify full bundle
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          import re
          import zlib
          from pathlib import Path

          path = Path(os.environ["INSTALLER"])
          text = path.read_text(encoding="utf-8")
          old = "IFvRx6hAKEWZE"
          new = "IFvRx6jAKEWZE"
          if text.count(old) != 1:
              raise RuntimeError("expected exactly one corrupted transport symbol")
          repaired = text.replace(old, new, 1)
          match = re.search(r'encoded = "([A-Za-z0-9+/=]+)"', repaired)
          if match is None:
              raise RuntimeError("embedded bundle not found")
          raw = zlib.decompress(base64.b64decode(match.group(1), validate=True))
          observed = hashlib.sha256(raw).hexdigest()
          if observed != os.environ["EXPECTED_RAW_SHA256"]:
              raise RuntimeError(f"repaired bundle SHA mismatch: {observed}")
          path.write_text(repaired, encoding="utf-8")
          PY
          git diff --check

      - name: Commit verified transport repair and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$INSTALLER"
          git rm \
            .github/workflows/_temporary_repair_signal_screen_bundle_transport.yml
          git commit -m "Repair signal-screen manifest bundle transport"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
