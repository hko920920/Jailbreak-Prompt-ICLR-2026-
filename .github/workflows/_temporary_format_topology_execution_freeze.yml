name: temporary-format-topology-execution-freeze

"on":
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_format_topology_execution_freeze.yml

permissions:
  contents: write

concurrency:
  group: temporary-format-topology-execution-freeze
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/programmatic-agentharm-pivot

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply mechanical Ruff remediation and verify
        run: |
          python -m pip install 'pytest>=8.2' 'ruff==0.16.4'
          targets=(
            scripts/run_topology_micro_pilot_execution_freeze.py
            tests/test_topology_micro_pilot_execution_freeze.py
          )
          ruff check --fix --unsafe-fixes "${targets[@]}" || true
          ruff format "${targets[@]}"
          ruff check "${targets[@]}"
          python -m pytest -q tests/test_topology_micro_pilot_execution_freeze.py
          python -m py_compile scripts/run_topology_micro_pilot_execution_freeze.py
          git diff --check

      - name: Record and push formatting-only repair
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          record = {
              "schema_version": "topology-execution-freeze-ruff-repair-safe-v1",
              "classification": "OPERATIONAL_STATIC_FORMAT_REPAIR_NOT_SCIENTIFIC_CHANGE",
              "failed_run_id": 33049419891,
              "failed_job_id": 98440998007,
              "scientific_contract_changed": False,
              "model_changed": False,
              "payload_source_changed": False,
              "decoding_changed": False,
              "thresholds_changed": False,
              "model_weight_downloaded": False,
              "model_inference_performed": False,
              "attack_success_observed": False,
              "stage_a_opened": False,
              "heldout_opened": False,
              "causal_oracle_opened": False,
              "keep_only_oracle_opened": False,
              "wavelet_used": False,
              "raw_text_recorded": False,
          }
          path = Path(
              "data/natural_language_localization/topology_micro_pilot_v1/"
              "topology_micro_pilot_execution_freeze_ruff_repair.safe.json"
          )
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/run_topology_micro_pilot_execution_freeze.py \
            tests/test_topology_micro_pilot_execution_freeze.py \
            data/natural_language_localization/topology_micro_pilot_v1/topology_micro_pilot_execution_freeze_ruff_repair.safe.json
          git commit -m "Apply mechanical Ruff repair to topology execution freeze"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
