name: bootstrap-gate1-step3b5-source

on:
  push:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/bootstrap_step3b5_source.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate1-contract
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Materialize frozen Step 3B.5 source
        run: python scripts/bootstrap_step3b5_judge_validation.py

      - name: Validate generated source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check .
          mypy src/jbspan
          pytest
          python -m json.tool \
            configs/gate1/gate1_step3b_judge_validation.json >/dev/null
          git diff --check

      - name: Commit source and remove transport files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/jbspan/gate1/jbb_judge_validation_core.py \
            src/jbspan/gate1/jbb_judge_validation.py \
            scripts/run_gate1_step3b_judge_validation.py \
            tests/test_gate1_step3b_judge_validation.py \
            docs/GATE1_STEP3B_JUDGE_COMPARISON_PROTOCOL.md
          git rm \
            data/gate1/step3b5_source.part01 \
            data/gate1/step3b5_source.part02 \
            scripts/bootstrap_step3b5_judge_validation.py
          git commit -m "Freeze Gate 1 Step 3B.5 judge-validation source"
          git push origin HEAD:agent/gate1-contract
