name: e0-gcg-qwen-tokenizer-preflight

on:
  workflow_dispatch:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - configs/natural_language_localization/e0_gcg_qwen_preflight_v1.json
      - scripts/gcg_qwen_adapter.py
      - scripts/run_e0_gcg_qwen_preflight.py
      - scripts/install_gcg_qwen_preflight_result.py
      - tests/test_e0_gcg_qwen_preflight.py
      - docs/E0_GCG_QWEN_PREFLIGHT_V1.md
      - .github/workflows/e0_gcg_qwen_preflight.yml

permissions:
  contents: write

concurrency:
  group: e0-gcg-qwen-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/programmatic-agentharm-pivot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tokenizer-only dependencies
        run: |
          python -m pip install \
            'huggingface-hub==0.28.1' \
            'jinja2==3.1.6' \
            'pytest==8.3.5' \
            'ruff==0.16.4' \
            'transformers==4.48.3'

      - name: Enforce no-model safety boundary
        run: |
          ! grep -R -n -E 'AutoModel|AutoModelFor|torch\.load|generate\(' \
            scripts/gcg_qwen_adapter.py \
            scripts/run_e0_gcg_qwen_preflight.py \
            scripts/install_gcg_qwen_preflight_result.py

      - name: Static validation
        run: |
          ruff check \
            scripts/gcg_qwen_adapter.py \
            scripts/run_e0_gcg_qwen_preflight.py \
            scripts/install_gcg_qwen_preflight_result.py \
            tests/test_e0_gcg_qwen_preflight.py
          ruff format --check \
            scripts/gcg_qwen_adapter.py \
            scripts/run_e0_gcg_qwen_preflight.py \
            scripts/install_gcg_qwen_preflight_result.py \
            tests/test_e0_gcg_qwen_preflight.py
          python -m py_compile \
            scripts/gcg_qwen_adapter.py \
            scripts/run_e0_gcg_qwen_preflight.py \
            scripts/install_gcg_qwen_preflight_result.py
          python -m pytest -q tests/test_e0_gcg_qwen_preflight.py

      - name: Execute frozen tokenizer-only audit
        run: |
          PYTHONPATH=scripts python scripts/run_e0_gcg_qwen_preflight.py \
            --root . \
            --config \
              configs/natural_language_localization/e0_gcg_qwen_preflight_v1.json \
            --output /tmp/e0_gcg_qwen_preflight.safe.json

      - name: Install sanitized terminal record
        run: |
          python scripts/install_gcg_qwen_preflight_result.py \
            --source /tmp/e0_gcg_qwen_preflight.safe.json \
            --destination \
              data/natural_language_localization/e0_attack_family_provenance_v1/gcg_qwen_preflight.safe.json

      - name: Upload safe result
        uses: actions/upload-artifact@v4
        with:
          name: e0-gcg-qwen-preflight-safe
          path: data/natural_language_localization/e0_attack_family_provenance_v1/gcg_qwen_preflight.safe.json
          if-no-files-found: error

      - name: Commit terminal record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/natural_language_localization/e0_attack_family_provenance_v1/gcg_qwen_preflight.safe.json
          if git diff --cached --quiet; then
            echo 'Terminal record already matches.'
          else
            git commit -m 'Record GCG-Qwen tokenizer preflight result'
            git pull --rebase origin agent/programmatic-agentharm-pivot
            git push origin HEAD:agent/programmatic-agentharm-pivot
          fi

      - name: Apply frozen compatibility gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              'data/natural_language_localization/'
              'e0_attack_family_provenance_v1/'
              'gcg_qwen_preflight.safe.json'
          )
          result = json.loads(path.read_text(encoding='utf-8'))
          print(result['status'])
          if result['status'] != 'E0_GCG_QWEN_PREFLIGHT_PASS':
              raise SystemExit(1)
          PY
