# Retry marker after formatting-only repair; scientific contract unchanged.
name: topology-micro-pilot-execution-freeze

"on":
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/topology_micro_pilot_execution_freeze.yml
      - configs/natural_language_localization/topology_micro_pilot_execution_freeze_v1.json
      - scripts/run_topology_micro_pilot_execution_freeze.py
      - tests/test_topology_micro_pilot_execution_freeze.py
      - docs/TOPOLOGY_MICRO_PILOT_EXECUTION_FREEZE_V1.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topology-micro-pilot-execution-freeze
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/programmatic-agentharm-pivot
  SOURCE_ROOT: upstream/HarmBench
  HARM_BENCH_REVISION: 8e1604d1171fe8a48d8febecd22f600e462bdcdd
  CONFIG: configs/natural_language_localization/topology_micro_pilot_execution_freeze_v1.json
  SAFE_DIR: artifacts/topology-micro-pilot-execution-freeze-v1
  SAFE_RESULT: artifacts/topology-micro-pilot-execution-freeze-v1/topology_micro_pilot_execution_freeze_v1.safe.json
  SAFE_MANIFEST: artifacts/topology-micro-pilot-execution-freeze-v1/topology_micro_pilot_payload_manifest_v1.safe.jsonl
  RECORD_DIR: data/natural_language_localization/topology_micro_pilot_v1

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pre-outcome contract commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out immutable HarmBench payload source
        uses: actions/checkout@v4
        with:
          repository: centerforaisafety/HarmBench
          ref: ${{ env.HARM_BENCH_REVISION }}
          path: ${{ env.SOURCE_ROOT }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate implementation and freeze immutable identities
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8.2' 'ruff>=0.6' 'huggingface_hub==0.36.2'
          ruff check \
            scripts/run_topology_micro_pilot_execution_freeze.py \
            tests/test_topology_micro_pilot_execution_freeze.py
          python -m pytest -q tests/test_topology_micro_pilot_execution_freeze.py
          python -m py_compile scripts/run_topology_micro_pilot_execution_freeze.py
          python -m json.tool "$CONFIG" >/dev/null
          mkdir -p "$SAFE_DIR"
          python scripts/run_topology_micro_pilot_execution_freeze.py \
            --root . \
            --source-root "$SOURCE_ROOT" \
            --config "$CONFIG" \
            --safe-output "$SAFE_RESULT" \
            --payload-manifest-output "$SAFE_MANIFEST"
          test "$(jq -r '.status' "$SAFE_RESULT")" = \
            "TOPOLOGY_MICRO_PILOT_EXECUTION_FREEZE_PASS"
          test "$(jq -r '.next_authorized_operation' "$SAFE_RESULT")" = \
            "FREEZE_H4RM3L_GCG_SIGNAL_SCREEN_INPUT_MANIFEST"
          test "$(jq -r '.model_inference_performed' "$SAFE_RESULT")" = "false"
          test "$(wc -l < "$SAFE_MANIFEST")" = "4"
          git diff --check

      - name: Audit safe-output privacy boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = (
              '"Behavior":',
              '"raw_payload":',
              '"payload_text":',
              '"prompt_private":',
              '"response_private":',
              '"generation_private":',
          )
          safe_dir = Path("artifacts/topology-micro-pilot-execution-freeze-v1")
          for path in safe_dir.rglob("*"):
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              for token in forbidden:
                  assert token not in text, (path, token)
          PY

      - name: Upload safe execution-freeze artifact
        uses: actions/upload-artifact@v4
        with:
          name: topology-micro-pilot-execution-freeze-v1-safe
          path: ${{ env.SAFE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit safe execution-freeze records
        run: |
          mkdir -p "$RECORD_DIR"
          cp "$SAFE_RESULT" \
            "$RECORD_DIR/topology_micro_pilot_execution_freeze_v1.safe.json"
          cp "$SAFE_MANIFEST" \
            "$RECORD_DIR/topology_micro_pilot_payload_manifest_v1.safe.jsonl"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "$RECORD_DIR/topology_micro_pilot_execution_freeze_v1.safe.json" \
            "$RECORD_DIR/topology_micro_pilot_payload_manifest_v1.safe.jsonl"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record topology micro-pilot execution freeze"
          git fetch origin "$TARGET_BRANCH"
          frozen_inputs=(
            configs/natural_language_localization/topology_micro_pilot_execution_freeze_v1.json
            scripts/run_topology_micro_pilot_execution_freeze.py
            tests/test_topology_micro_pilot_execution_freeze.py
            configs/natural_language_localization/topology_micro_pilot_v1.json
          )
          if ! git diff --quiet \
            "$GITHUB_SHA" "origin/$TARGET_BRANCH" -- "${frozen_inputs[@]}"; then
            echo "Frozen execution inputs changed during the run." >&2
            exit 1
          fi
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
