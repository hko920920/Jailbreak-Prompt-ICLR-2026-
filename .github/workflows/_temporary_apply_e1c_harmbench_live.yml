name: temporary-apply-e1c-harmbench-live

# One-shot installation of the frozen non-workflow live implementation.
# No model weights, inference, or classifier outputs are opened here.
"on":
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_apply_e1c_harmbench_live.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-apply-e1c-harmbench-live
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: agent/programmatic-agentharm-pivot
      ARCHIVE: /tmp/e1c_live_exec_nonworkflow.tgz
      ARCHIVE_SHA256: 7b9d9fab2793c368d9de358ff299607b123dd8e150c2debc9b893a33796ef054
      PIP_NO_CACHE_DIR: "1"

    steps:
      - name: Check out current research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reassemble, verify, extract, and apply lint-only repair
        run: |
          set -euo pipefail
          chunks=(
            .agent/e1c_live_exec_bundle.b64.part00
            .agent/e1c_live_exec_bundle.b64.part01
            .agent/e1c_live_exec_bundle.b64.part02
            .agent/e1c_live_exec_bundle.b64.part03
          )
          for chunk in "${chunks[@]}"; do
            test -s "$chunk"
          done
          cat "${chunks[@]}" | base64 -d > "$ARCHIVE"
          test "$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" = "$ARCHIVE_SHA256"
          tar -tzf "$ARCHIVE" >/dev/null
          tar -xzf "$ARCHIVE" -C .
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run_evaluator_panel_e1c_harmbench_live.py")
          text = path.read_text(encoding="utf-8")
          needle = (
              '    source = as_object(contract["harmbench_source"], '
              'where="harmbench_source")\n'
          )
          if text.count(needle) != 1:
              raise SystemExit("expected exactly one frozen unused-source assignment")
          path.write_text(text.replace(needle, ""), encoding="utf-8")
          PY

      - name: Validate implementation before commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8.2' 'ruff>=0.6'
          ruff check \
            scripts/run_evaluator_panel_e1c_harmbench_live.py \
            tests/test_evaluator_panel_e1c_harmbench_live.py
          python -m pytest -q tests/test_evaluator_panel_e1c_harmbench_live.py
          python -m py_compile scripts/run_evaluator_panel_e1c_harmbench_live.py
          bash -n scripts/run_evaluator_panel_e1c_harmbench_live_ci.sh
          git diff --check

      - name: Verify frozen predecessor authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  "data/natural_language_localization/evaluator_panel_v1/"
                  "e1c_harmbench_live_contract.safe.json"
              ).read_text(encoding="utf-8")
          )
          assert result["status"] == "E1C_HARMBENCH_LIVE_CONTRACT_FREEZE_PASS"
          assert result["operational_pass"] is True
          assert result["next_authorized_operation"] == (
              "EXECUTE_E1C_HARMBENCH_LIVE_REPRODUCTION_AND_INJECTION_CANARIES"
          )
          assert result["execution_budget"]["expected_total_classifier_requests"] == 448
          assert result["model_inference_performed"] is False
          assert result["harmbench_live_predictions_generated"] is False
          PY

      - name: Commit non-workflow live implementation
        run: |
          git rm \
            .agent/e1c_live_exec_bundle.b64.part00 \
            .agent/e1c_live_exec_bundle.b64.part01 \
            .agent/e1c_live_exec_bundle.b64.part02 \
            .agent/e1c_live_exec_bundle.b64.part03
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/run_evaluator_panel_e1c_harmbench_live.py \
            scripts/run_evaluator_panel_e1c_harmbench_live_ci.sh \
            tests/test_evaluator_panel_e1c_harmbench_live.py \
            docs/EVALUATOR_PANEL_E1C_HARMBENCH_LIVE_EXECUTION_V1.md
          git commit -m "Install E1C HarmBench live qualification implementation"
          git fetch origin "$TARGET_BRANCH"
          panel_dir=data/natural_language_localization/evaluator_panel_v1
          frozen_inputs=(
            configs/natural_language_localization/evaluator_panel_e1c_harmbench_live_contract_v1.json
            "$panel_dir/e1c_harmbench_live_contract.safe.json"
            "$panel_dir/e1c_prompt_source_freeze_v3.safe.json"
            "$panel_dir/e1c_harmbench_prompt_manifest_v3.safe.jsonl"
            "$panel_dir/e1c_harmbench_selection_v2.safe.jsonl"
          )
          if ! git diff --quiet "$GITHUB_SHA" "origin/$TARGET_BRANCH" -- \
            "${frozen_inputs[@]}"; then
            echo "Frozen E1C inputs changed during installation." >&2
            exit 1
          fi
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
