name: evaluator-panel-e1c-canary-requalification-live

"on":
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - data/natural_language_localization/evaluator_panel_v1/e1c_canary_requalification_freeze_v1.safe.json
      - data/natural_language_localization/evaluator_panel_v1/e1c_canary_requalification_selection_v1.safe.jsonl
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evaluator-panel-e1c-canary-requalification-live
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/programmatic-agentharm-pivot
  SOURCE_ROOT: upstream/HarmBench
  CONFIG: configs/natural_language_localization/evaluator_panel_e1c_canary_requalification_freeze_v1.json
  FREEZE_RESULT: data/natural_language_localization/evaluator_panel_v1/e1c_canary_requalification_freeze_v1.safe.json
  SELECTION: data/natural_language_localization/evaluator_panel_v1/e1c_canary_requalification_selection_v1.safe.jsonl
  LIVE_CONTRACT: configs/natural_language_localization/evaluator_panel_e1c_harmbench_live_contract_v1.json
  HARM_BENCH_REVISION: 8e1604d1171fe8a48d8febecd22f600e462bdcdd
  PIP_NO_CACHE_DIR: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact frozen requalification commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate frozen paired-invariance implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8.2' 'ruff>=0.6'
          ruff check \
            scripts/run_evaluator_panel_e1c_canary_requalification_freeze.py \
            scripts/run_evaluator_panel_e1c_canary_requalification_live.py \
            tests/test_evaluator_panel_e1c_canary_requalification_freeze.py \
            tests/test_evaluator_panel_e1c_canary_requalification_live.py
          python -m pytest -q \
            tests/test_evaluator_panel_e1c_canary_requalification_freeze.py \
            tests/test_evaluator_panel_e1c_canary_requalification_live.py
          python -m py_compile \
            scripts/run_evaluator_panel_e1c_canary_requalification_freeze.py \
            scripts/run_evaluator_panel_e1c_canary_requalification_live.py
          bash -n \
            scripts/run_evaluator_panel_e1c_canary_requalification_worker_ci.sh
          python -m json.tool "$CONFIG" >/dev/null
          python scripts/run_evaluator_panel_e1c_canary_requalification_live.py \
            validate \
            --root . \
            --config "$CONFIG" \
            --freeze-result "$FREEZE_RESULT" \
            --selection "$SELECTION" \
            --safe-output /tmp/e1c-canary-requalification-validation.safe.json
          test "$(jq -r '.status' \
            /tmp/e1c-canary-requalification-validation.safe.json)" = \
            "E1C_HARMBENCH_CANARY_REQUALIFICATION_VALIDATION_PASS"
          git diff --check

  full-shards:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      ROOT: ${{ github.workspace }}
      SAFE_DIR: artifacts/e1c-canary-requalification/shard-${{ matrix.shard }}
      PRIVATE_DIR: /tmp/e1c-canary-requalification-private-${{ matrix.shard }}
      MODEL_DIR: /tmp/e1c-canary-requalification-model-${{ matrix.shard }}
      TOOLS_DIR: /tmp/e1c-canary-requalification-tools-${{ matrix.shard }}
      SERVER_URL: http://127.0.0.1:8081
      SHARD_INDEX: ${{ matrix.shard }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact frozen requalification commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Check out immutable HarmBench source
        uses: actions/checkout@v4
        with:
          repository: centerforaisafety/HarmBench
          ref: ${{ env.HARM_BENCH_REVISION }}
          path: ${{ env.SOURCE_ROOT }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute frozen 36-request paired-invariance shard
        run: |
          bash scripts/run_evaluator_panel_e1c_canary_requalification_worker_ci.sh

      - name: Audit terminal shard output
        if: always()
        run: |
          summary="$SAFE_DIR/canary_requalification_shard_$(printf '%02d' "$SHARD_INDEX")_summary.safe.json"
          test -f "$summary"
          test "$(jq -r '.status' "$summary")" = \
            "E1C_HARMBENCH_CANARY_REQUALIFICATION_SHARD_PASS"
          test "$(jq -r '.record_count' "$summary")" = "3"
          test "$(jq -r '.request_count' "$summary")" = "36"
          test "$(jq -r '.raw_text_recorded' "$summary")" = "false"

      - name: Upload safe paired-invariance shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1c-canary-requalification-shard-${{ matrix.shard }}
          path: ${{ env.SAFE_DIR }}
          if-no-files-found: warn
          retention-days: 30

  finalize:
    if: always()
    needs:
      - preflight
      - full-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SAFE_DIR: artifacts/e1c-canary-requalification/final
      SAFE_RESULT: artifacts/e1c-canary-requalification/final/e1c_canary_requalification_live_v1.safe.json
      RECORD_ROOT: data/natural_language_localization/evaluator_panel_v1
      RECORD_DIR: data/natural_language_localization/evaluator_panel_v1/e1c_canary_requalification_live_v1
      RECORD_RESULT: data/natural_language_localization/evaluator_panel_v1/e1c_canary_requalification_live_v1.safe.json
      RUN_RECORD: data/natural_language_localization/evaluator_panel_v1/e1c_canary_requalification_live_v1_run.safe.json
    steps:
      - name: Check out exact frozen requalification commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all available safe paired-invariance shards
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: e1c-canary-requalification-shard-*
          path: /tmp/e1c-canary-requalification-shards
          merge-multiple: true

      - name: Merge exact grid and apply frozen scientific gate
        run: |
          mkdir -p "$SAFE_DIR" /tmp/e1c-canary-requalification-shards
          cp -a /tmp/e1c-canary-requalification-shards/. "$SAFE_DIR"/ || true
          python scripts/run_evaluator_panel_e1c_canary_requalification_live.py \
            finalize \
            --root . \
            --config "$CONFIG" \
            --freeze-result "$FREEZE_RESULT" \
            --selection "$SELECTION" \
            --input-dir /tmp/e1c-canary-requalification-shards \
            --safe-output-dir "$SAFE_DIR" \
            --runtime-sha256 \
              45f6c4dc9e86d540a2e153f57852673f54732704a3039b1426ce46b1e436f578 \
            --runtime-size-bytes 7865957120 \
            --safe-output "$SAFE_RESULT"

      - name: Audit terminal result and privacy boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          safe_dir = Path(os.environ["SAFE_DIR"])
          result = json.loads(Path(os.environ["SAFE_RESULT"]).read_text())
          assert result["status"] in {
              "E1C_HARMBENCH_CANARY_REQUALIFICATION_PASS",
              "E1C_HARMBENCH_CANARY_REQUALIFICATION_SCIENTIFIC_FAIL",
              "E1C_HARMBENCH_CANARY_REQUALIFICATION_OPERATIONAL_FAIL",
          }
          assert result["paper_validity"] is False
          assert result["original_e1c_scientific_fail_preserved"] is True
          assert result["new_harmful_attack_outputs_generated"] is False
          assert result["semantic_only_stage_a_opened"] is False
          assert result["cross_regime_stage_a_opened"] is False
          assert result["heldout_opened"] is False
          assert result["causal_oracle_opened"] is False
          assert result["keep_only_oracle_opened"] is False
          assert result["wavelet_used"] is False
          if result["operational_pass"] is True:
              assert result["request_count"] == 288
              assert result["raw_diagnostic"]["request_count"] == 144
              assert result["hardened_production_gate"]["request_count"] == 144
          forbidden = (
              '"raw_output":',
              '"prompt":',
              '"prompt_private":',
              '"generation_private":',
              '"behavior_private":',
              '"context_private":',
              '"test_case":',
              '"generation":',
              '"behavior_text":',
          )
          for path in safe_dir.rglob("*"):
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8").lower()
              for token in forbidden:
                  assert token not in text, (path, token)
          PY

      - name: Upload complete safe requalification artifact
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-panel-e1c-canary-requalification-live-safe
          path: ${{ env.SAFE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit terminal safe requalification records
        run: |
          rm -rf "$RECORD_DIR"
          mkdir -p "$RECORD_DIR" "$RECORD_ROOT"
          cp -a "$SAFE_DIR"/. "$RECORD_DIR"/
          cp "$SAFE_RESULT" "$RECORD_RESULT"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RECORD_RESULT"])
          result = json.loads(result_path.read_text(encoding="utf-8"))
          record_dir = Path(os.environ["RECORD_DIR"])
          files = sorted(path for path in record_dir.rglob("*") if path.is_file())
          record = {
              "schema_version": "e1c-canary-requalification-live-run-safe-v1",
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "head_sha_at_start": os.environ["GITHUB_SHA"],
              "terminal_status": result["status"],
              "operational_pass": result["operational_pass"],
              "scientific_pass": result["scientific_pass"],
              "next_authorized_operation": result["next_authorized_operation"],
              "result_sha256": hashlib.sha256(result_path.read_bytes()).hexdigest(),
              "safe_file_count": len(files),
              "safe_file_manifest_sha256": hashlib.sha256(
                  "\n".join(
                      f"{path.relative_to(record_dir)}:{hashlib.sha256(path.read_bytes()).hexdigest()}"
                      for path in files
                  ).encode("utf-8")
              ).hexdigest(),
              "paper_validity": False,
              "original_e1c_scientific_fail_preserved": True,
              "new_harmful_attack_outputs_generated": False,
              "stage_a_opened": False,
              "heldout_opened": False,
              "causal_oracle_opened": False,
              "keep_only_oracle_opened": False,
              "wavelet_used": False,
              "raw_text_recorded": False,
          }
          Path(os.environ["RUN_RECORD"]).write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RECORD_DIR" "$RECORD_RESULT" "$RUN_RECORD"
          if git diff --cached --quiet; then
            echo "Terminal canary requalification records are already current."
            exit 0
          fi
          git commit -m "Record E1C paired-invariance requalification result"
          git fetch origin "$TARGET_BRANCH"
          frozen_inputs=(
            .github/workflows/evaluator_panel_e1c_canary_requalification_live.yml
            configs/natural_language_localization/evaluator_panel_e1c_canary_requalification_freeze_v1.json
            configs/natural_language_localization/evaluator_panel_e1c_harmbench_live_contract_v1.json
            scripts/run_evaluator_panel_e1c_canary_requalification_live.py
            scripts/run_evaluator_panel_e1c_canary_requalification_worker_ci.sh
            scripts/run_evaluator_panel_e1c_harmbench_preflight.py
            scripts/run_evaluator_panel_e1c_prompt_source_freeze_v3.py
            scripts/run_evaluator_panel_e1c_harmbench_live.py
            data/natural_language_localization/evaluator_panel_v1/e1c_canary_requalification_freeze_v1.safe.json
            data/natural_language_localization/evaluator_panel_v1/e1c_canary_requalification_selection_v1.safe.jsonl
          )
          if ! git diff --quiet "$GITHUB_SHA" "origin/$TARGET_BRANCH" -- \
            "${frozen_inputs[@]}"; then
            echo "Frozen paired-invariance inputs changed during live execution." >&2
            exit 1
          fi
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Surface operational failure after preserving evidence
        run: |
          status="$(jq -r '.status' "$SAFE_RESULT")"
          if [[ "$status" == \
            "E1C_HARMBENCH_CANARY_REQUALIFICATION_OPERATIONAL_FAIL" ]]; then
            echo "Paired-invariance requalification ended operationally." >&2
            exit 1
          fi
