name: temporary-deepinception-status-probe

on:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_deepinception_status_probe.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/programmatic-agentharm-pivot
          fetch-depth: 1

      - name: Query and freeze DeepInception workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: data/natural_language_localization/e0_attack_family_provenance_v1/deepinception_run_probe.safe.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUTPUT")"
          runs="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent/programmatic-agentharm-pivot&per_page=100")"
          jq -n \
            --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson runs "$runs" '
            {
              schema_version: "deepinception-run-probe-safe-v1",
              recorded_at: $recorded_at,
              runs: [
                $runs.workflow_runs[]
                | select(.name == "e0-deepinception-static-audit")
                | {
                    id,
                    run_number,
                    run_attempt,
                    event,
                    head_sha,
                    status,
                    conclusion,
                    created_at,
                    updated_at,
                    run_started_at,
                    html_url,
                    path
                  }
              ],
              scientific_contract_changed: false,
              target_outputs_opened: false,
              attack_success_scored: false,
              causal_oracle_opened: false,
              wavelet_used: false
            }
          ' > "$OUTPUT"
          test "$(jq '.runs | length' "$OUTPUT")" -ge 1

          git config user.name 'Taewook-git'
          git config user.email 'lkhd3329@naver.com'
          git add "$OUTPUT"
          git commit -m 'Record DeepInception E0 workflow status'
          git push origin HEAD:agent/programmatic-agentharm-pivot
