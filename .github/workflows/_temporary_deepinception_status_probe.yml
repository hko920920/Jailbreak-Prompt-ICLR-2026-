name: temporary-deepinception-status-probe

# Refreshed after the DeepInception audit workflow was admitted.
on:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_deepinception_status_probe.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: temporary-deepinception-status-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: agent/programmatic-agentharm-pivot
      OUTPUT: data/natural_language_localization/e0_attack_family_provenance_v1/deepinception_run_probe.safe.json
    steps:
      - name: Query and persist DeepInception workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=100")"
          safe="$(jq -n \
            --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson runs "$runs" '
            {
              schema_version: "deepinception-run-probe-safe-v2",
              recorded_at: $recorded_at,
              runs: [
                $runs.workflow_runs[]
                | select(.name == "e0-deepinception-static-audit")
                | {
                    id,
                    run_number,
                    run_attempt,
                    event,
                    head_sha,
                    status,
                    conclusion,
                    created_at,
                    updated_at,
                    run_started_at,
                    html_url,
                    path
                  }
              ],
              scientific_contract_changed: false,
              target_outputs_opened: false,
              attack_success_scored: false,
              causal_oracle_opened: false,
              wavelet_used: false
            }
          ')"
          test "$(jq '.runs | length' <<<"$safe")" -ge 1

          encoded="$(printf '%s\n' "$safe" | base64 -w0)"
          current_sha="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/contents/${OUTPUT}?ref=${TARGET_BRANCH}" \
            --jq '.sha' 2>/dev/null || true)"
          args=(
            --method PUT
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
            "repos/${GITHUB_REPOSITORY}/contents/${OUTPUT}"
            -f message='Record DeepInception E0 workflow status v2'
            -f content="$encoded"
            -f branch="$TARGET_BRANCH"
          )
          if [[ -n "$current_sha" ]]; then
            args+=( -f sha="$current_sha" )
          fi
          gh api "${args[@]}" >/dev/null
          jq -r '.runs[] | "- run \(.id): \(.status) / \(.conclusion // "pending"), head=\(.head_sha)"' <<<"$safe" >> "$GITHUB_STEP_SUMMARY"
