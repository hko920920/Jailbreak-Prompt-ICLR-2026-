name: e0-deepinception-parameter-balance

on:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/e0_deepinception_parameter_balance.yml
      - configs/natural_language_localization/e0_deepinception_parameter_balance_v1.json
      - docs/E0_DEEPINCEPTION_PARAMETER_BALANCE_V1.md
      - scripts/run_e0_deepinception_static_audit.py
      - scripts/run_e0_deepinception_exact_rerender.py
      - scripts/run_e0_deepinception_exact_rerender_v2.py
      - scripts/run_e0_deepinception_parameter_balance.py
      - tests/test_e0_deepinception_parameter_balance.py
      - data/natural_language_localization/e0_attack_family_provenance_v1/deepinception_exact_rerender_v2.safe.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e0-deepinception-parameter-balance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REPOSITORY: https://github.com/tmlr-group/DeepInception.git
      SOURCE_REVISION: fc5689e76c4dd87a14babf1eadf890532f2b6880
      CONTRACT: configs/natural_language_localization/e0_deepinception_parameter_balance_v1.json
      SAFE_OUTPUT: artifacts/e0-deepinception-parameter-balance/e0_deepinception_parameter_balance.safe.json
      RECORD_PATH: data/natural_language_localization/e0_attack_family_provenance_v1/deepinception_parameter_balance.safe.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest==9.1.1' 'ruff==0.16.4'

      - name: Validate predecessor, code, tests, and contract
        run: |
          test -f data/natural_language_localization/e0_attack_family_provenance_v1/deepinception_exact_rerender_v2.safe.json
          ruff check \
            scripts/run_e0_deepinception_static_audit.py \
            scripts/run_e0_deepinception_exact_rerender.py \
            scripts/run_e0_deepinception_exact_rerender_v2.py \
            scripts/run_e0_deepinception_parameter_balance.py \
            tests/test_e0_deepinception_parameter_balance.py
          pytest tests/test_e0_deepinception_parameter_balance.py
          python -m json.tool "$CONTRACT" >/dev/null
          git diff --check

      - name: Check out immutable DeepInception source
        run: |
          source_root="$RUNNER_TEMP/deepinception-source"
          git init -q "$source_root"
          git -C "$source_root" remote add origin "$SOURCE_REPOSITORY"
          git -C "$source_root" fetch -q --depth 1 origin "$SOURCE_REVISION"
          git -C "$source_root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$source_root" rev-parse HEAD)" = "$SOURCE_REVISION"
          test -f "$source_root/res/data_abl_c.json"
          test -f "$source_root/res/data_abl_layers.json"
          test -f "$source_root/res/data_multi_scene.json"
          test -f "$source_root/LICENSE"
          echo "SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"

      - name: Execute parameter and balanced-template audit
        id: execute
        run: |
          set +e
          python scripts/run_e0_deepinception_parameter_balance.py \
            --config "$CONTRACT" \
            --source-root "$SOURCE_ROOT" \
            --output "$SAFE_OUTPUT"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -f "$SAFE_OUTPUT"

      - name: Verify safe result and frozen boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["SAFE_OUTPUT"]).read_text())
          assert result["status"] in {
              "E0_DEEPINCEPTION_PARAMETER_BALANCE_PASS_FAMILY_ADAPTER_READY_FOR_FROZEN_SIGNAL_SCREEN_CONTRACT",
              "E0_DEEPINCEPTION_PARAMETER_BALANCE_FAIL",
          }
          assert result["paper_validity"] is False
          assert result["target_model_called"] is False
          assert result["attack_success_scored"] is False
          assert result["real_harmful_output_generated"] is False
          assert result["cross_regime_stage_a_opened"] is False
          assert result["heldout_opened"] is False
          assert result["causal_oracle_opened"] is False
          assert result["keep_only_oracle_opened"] is False
          assert result["wavelet_used"] is False
          assert result["dataset_count"] == 3
          assert result["total_source_rows"] == 15
          assert result["total_questions"] == 75
          assert result["unit_count_per_question"] == 7
          assert result["subset_count_per_question"] == 127
          assert result["variant_count_per_question"] == 254
          assert result["total_subset_count"] == 9525
          assert result["total_variant_count"] == 19050
          assert result["primary_plus_sensitivity_setting_count"] == 9
          assert result["midpoint_sensitivity_setting_count"] == 4
          assert result["primary_family_representative"] == {
              "scene": "science fiction",
              "character_count": 5,
              "layer_depth": 5,
              "setting_sha256": result["primary_family_representative"]["setting_sha256"],
              "may_not_be_replaced_after_target_outcomes": True,
          }

          forbidden = {
              "plain_attack",
              "inception_attack",
              "question",
              "rendered_text",
              "raw_prompt",
              "raw_output",
              "canonical_goal",
              "derived_prompt",
              "synthetic_prompt",
              "synthetic_payload",
              "bridge",
          }
          stack = [result]
          while stack:
              value = stack.pop()
              if isinstance(value, dict):
                  leaked = forbidden.intersection(value)
                  if leaked:
                      raise SystemExit(f"unsafe raw-field keys: {sorted(leaked)}")
                  stack.extend(value.values())
              elif isinstance(value, list):
                  stack.extend(value)
          PY

      - name: Persist safe parameter-balance record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encoded="$(base64 -w0 < "$SAFE_OUTPUT")"
          current_sha="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/contents/${RECORD_PATH}?ref=agent/programmatic-agentharm-pivot" \
            --jq '.sha' 2>/dev/null || true)"
          args=(
            --method PUT
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
            "repos/${GITHUB_REPOSITORY}/contents/${RECORD_PATH}"
            -f message='Record DeepInception parameter-balance audit'
            -f content="$encoded"
            -f branch='agent/programmatic-agentharm-pivot'
          )
          if [[ -n "$current_sha" ]]; then
            args+=( -f sha="$current_sha" )
          fi
          gh api "${args[@]}" >/dev/null

      - name: Publish safe summary
        if: always()
        run: |
          if [[ -f "$SAFE_OUTPUT" ]]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["SAFE_OUTPUT"]).read_text())
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as handle:
              handle.write("# E0 DeepInception parameter balance\n\n")
              handle.write(f"- status: **{result['status']}**\n")
              handle.write(
                  f"- datasets / questions: **{result['dataset_count']} / "
                  f"{result['total_questions']}**\n"
              )
              handle.write(
                  f"- variants: **{result['total_variant_pass_count']}/"
                  f"{result['total_variant_count']} passed**\n"
              )
              handle.write(
                  f"- all settings / primary registry / midpoint registry: "
                  f"**{result['all_setting_count']} / "
                  f"{result['primary_plus_sensitivity_setting_count']} / "
                  f"{result['midpoint_sensitivity_setting_count']}**\n"
              )
              handle.write(
                  f"- topic and goal alignment: "
                  f"**{result['topic_alignment_across_axes']} / "
                  f"{result['canonical_goal_alignment_across_axes']}**\n"
              )
              handle.write("- target model / attack scoring: **false / false**\n")
              handle.write("- Stage A / oracle / wavelet: **closed / closed / closed**\n")
          PY
          fi

      - name: Upload safe parameter-balance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e0-deepinception-parameter-balance-safe
          path: artifacts/e0-deepinception-parameter-balance
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce parameter-balance decision
        run: |
          test "${{ steps.execute.outputs.exit_code }}" = "0"
