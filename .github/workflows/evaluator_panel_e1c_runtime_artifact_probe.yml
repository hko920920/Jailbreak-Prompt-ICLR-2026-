name: evaluator-panel-e1c-runtime-artifact-probe

# Static metadata only. This workflow does not download model weights or run inference.
on:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/evaluator_panel_e1c_runtime_artifact_probe.yml
      - configs/natural_language_localization/evaluator_panel_e1c_runtime_artifact_probe_v1.json
      - scripts/run_evaluator_panel_e1c_runtime_probe.py
      - tests/test_evaluator_panel_e1c_runtime_probe.py
      - data/natural_language_localization/evaluator_panel_v1/e1c_harmbench_preflight.safe.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evaluator-panel-e1c-runtime-artifact-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CONFIG: configs/natural_language_localization/evaluator_panel_e1c_runtime_artifact_probe_v1.json
      SAFE_DIR: artifacts/evaluator-panel-e1c-runtime-artifact-probe/safe
      SAFE_RESULT: artifacts/evaluator-panel-e1c-runtime-artifact-probe/safe/e1c_runtime_artifact_probe.safe.json
      RECORD_RESULT: data/natural_language_localization/evaluator_panel_v1/e1c_runtime_artifact_probe.safe.json
      PIP_NO_CACHE_DIR: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'huggingface_hub>=0.24,<2' \
            'pytest>=8.2' \
            'ruff>=0.6'

      - name: Validate frozen probe implementation
        run: |
          ruff check \
            scripts/run_evaluator_panel_e1c_runtime_probe.py \
            tests/test_evaluator_panel_e1c_runtime_probe.py
          python -m pytest -q tests/test_evaluator_panel_e1c_runtime_probe.py

      - name: Query immutable runtime artifact metadata
        id: probe
        shell: bash
        run: |
          mkdir -p "$SAFE_DIR"
          set +e
          python scripts/run_evaluator_panel_e1c_runtime_probe.py \
            --root . \
            --config "$CONFIG" \
            --safe-output "$SAFE_RESULT"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -f "$SAFE_RESULT"

      - name: Audit safe probe boundaries
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["SAFE_RESULT"]).read_text(encoding="utf-8"))
          assert result["model_weight_downloaded"] is False
          assert result["model_inference_performed"] is False
          assert result["harmbench_live_predictions_generated"] is False
          assert result["new_harmful_attack_outputs_generated"] is False
          assert result["cross_regime_stage_a_opened"] is False
          assert result["causal_oracle_opened"] is False
          assert result["keep_only_oracle_opened"] is False
          assert result["wavelet_used"] is False
          PY

      - name: Record safe runtime artifact identity
        run: |
          mkdir -p "$(dirname "$RECORD_RESULT")"
          cp "$SAFE_RESULT" "$RECORD_RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RECORD_RESULT"
          if git diff --cached --quiet; then
            echo "Runtime artifact probe result is already current."
          else
            git commit -m "Record E1C runtime artifact probe result"
            git push origin HEAD:agent/programmatic-agentharm-pivot
          fi

      - name: Upload safe runtime artifact probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-panel-e1c-runtime-artifact-probe-safe
          path: ${{ env.SAFE_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce runtime artifact probe gate
        if: always()
        run: |
          test "${{ steps.probe.outputs.exit_code }}" = "0"
