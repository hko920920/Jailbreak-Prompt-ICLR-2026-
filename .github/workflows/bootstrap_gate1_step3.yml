name: bootstrap-gate1-step3

on:
  push:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/bootstrap_gate1_step3.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate1-contract
          fetch-depth: 0

      - name: Unpack frozen Step 3 implementation
        run: |
          cat > "$RUNNER_TEMP/step3.b64" <<'PAYLOAD'

PAYLOAD
          base64 --decode "$RUNNER_TEMP/step3.b64" | tar -xJf - -C .
          rm -f .github/workflows/bootstrap_gate1_step3.yml

      - name: Commit Step 3 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            configs/gate1/gate1_step3_runtime.json \
            data/gate1/evaluator_registry.json \
            data/gate1/evaluator_prompts.json \
            src/jbspan/gate1/step3.py \
            scripts/run_gate1_step3.py \
            tests/test_gate1_step3.py \
            .github/workflows/gate1_step3_smoke.yml \
            pyproject.toml \
            .github/workflows/bootstrap_gate1_step3.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Implement Gate 1 Step 3 runtime and smoke"
          git push origin HEAD:agent/gate1-contract
