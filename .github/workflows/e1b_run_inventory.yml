name: e1b-run-inventory

on:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/e1b_run_inventory.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: e1b-run-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_WORKFLOW: evaluator_panel_e1b_wildguard.yml
      TARGET_BRANCH: agent/programmatic-agentharm-pivot
      OUTPUT_PATH: data/natural_language_localization/evaluator_panel_v1/e1b_recent_runs.safe.json
    steps:
      - name: Persist recent E1B runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?branch=${TARGET_BRANCH}&per_page=20")"
          safe="$(jq --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            {
              schema_version: "e1b-recent-runs-safe-v1",
              recorded_at: $recorded_at,
              total_count: .total_count,
              runs: [
                .workflow_runs[] | {
                  id,
                  run_number,
                  run_attempt,
                  event,
                  head_sha,
                  status,
                  conclusion,
                  created_at,
                  updated_at,
                  run_started_at,
                  html_url
                }
              ],
              scientific_contract_changed: false,
              target_outputs_opened_by_inventory: false,
              causal_oracle_opened_by_inventory: false,
              wavelet_used_by_inventory: false
            }
          ' <<<"$runs")"
          encoded="$(printf '%s\n' "$safe" | base64 -w0)"
          current_sha="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/contents/${OUTPUT_PATH}?ref=${TARGET_BRANCH}" \
            --jq '.sha' 2>/dev/null || true)"
          args=(
            --method PUT
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
            "repos/${GITHUB_REPOSITORY}/contents/${OUTPUT_PATH}"
            -f message='Record recent E1B workflow inventory'
            -f content="$encoded"
            -f branch="$TARGET_BRANCH"
          )
          if [[ -n "$current_sha" ]]; then
            args+=( -f sha="$current_sha" )
          fi
          gh api "${args[@]}" >/dev/null
          jq -r '.runs[] | "- run \(.id): \(.status) / \(.conclusion // "pending"), head=\(.head_sha), created=\(.created_at)"' <<<"$safe" >> "$GITHUB_STEP_SUMMARY"
