name: phase1-cpu-eligibility-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase1-core-experiment-prep
    paths:
      - .github/workflows/phase1_cpu_eligibility_smoke.yml
      - scripts/run_phase1_llama_cpp_eligibility.py
      - scripts/assemble_phase1_jbb_micro_pilot.py
      - data/manifests/phase1_micro_pilot_20.source_selection.json

permissions:
  contents: read

jobs:
  qwen-7b-eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MODEL_REF: "Qwen/Qwen2.5-7B-Instruct-GGUF:Q4_K_M"
      DATA_PATH: data/processed/phase1_micro_pilot_20.local.jsonl
      SAFE_OUTPUT: artifacts/phase1-qwen25-7b-cpu-smoke/eligibility_summary.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate eligibility runner
        run: |
          ruff check scripts/run_phase1_llama_cpp_eligibility.py
          mypy src/jbspan scripts/run_phase1_llama_cpp_eligibility.py

      - name: Assemble pinned 20-example input
        run: |
          python scripts/assemble_phase1_jbb_micro_pilot.py \
            --output "$DATA_PATH" \
            --manifest data/manifests/phase1_micro_pilot_20.selection.runtime.json

      - name: Install official llama.cpp runtime
        run: |
          curl -LsSf https://llama.app/install.sh | \
            SKIP_CUDA=1 SKIP_ROCM=1 SKIP_VULKAN=1 sh
          ~/.llama-app/llama --version

      - name: Start Qwen2.5-7B-Instruct Q4 server
        run: |
          export HF_HOME="$RUNNER_TEMP/huggingface"
          mkdir -p "$HF_HOME" "$RUNNER_TEMP/llama-server"
          nohup ~/.llama-app/llama serve \
            -hf "$MODEL_REF" \
            --host 127.0.0.1 \
            --port 8080 \
            -c 4096 \
            -t 4 \
            >"$RUNNER_TEMP/llama-server/server.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/llama-server/pid"

          ready=0
          for _ in $(seq 1 180); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/llama-server/pid")" 2>/dev/null; then
              echo "llama server exited before readiness"
              tail -n 100 "$RUNNER_TEMP/llama-server/server.log"
              exit 1
            fi
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health || true)"
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            sleep 10
          done

          if [ "$ready" != "1" ]; then
            echo "llama server did not become ready"
            tail -n 100 "$RUNNER_TEMP/llama-server/server.log"
            exit 1
          fi

      - name: Run 20-pair heuristic eligibility smoke
        run: |
          timeout 55m python scripts/run_phase1_llama_cpp_eligibility.py \
            --data "$DATA_PATH" \
            --output "$SAFE_OUTPUT" \
            --model "$MODEL_REF" \
            --max-examples 20 \
            --max-tokens 40 \
            --temperature 0.0

      - name: Publish safe aggregate summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["SAFE_OUTPUT"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          summary = {
              key: value
              for key, value in payload.items()
              if key != "records"
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("# Phase 1 Qwen2.5-7B eligibility smoke\n\n")
              handle.write(f"- examples: **{payload['example_count']}**\n")
              handle.write(f"- original refused: **{payload['original_refused_count']}**\n")
              handle.write(f"- jailbreak non-refusal: **{payload['jailbreak_nonrefusal_count']}**\n")
              handle.write(f"- heuristically eligible: **{payload['eligible_count']}**\n")
              handle.write(f"- eligible by family: `{payload['eligible_by_family']}`\n")
              handle.write("- raw prompts recorded: **false**\n")
              handle.write("- raw responses recorded: **false**\n")
              handle.write("\nThis result is infrastructure-only and not paper-valid.\n")
          PY

      - name: Upload safe summary only
        uses: actions/upload-artifact@v4
        with:
          name: phase1-qwen25-7b-safe-eligibility-summary
          path: ${{ env.SAFE_OUTPUT }}
          if-no-files-found: error
          retention-days: 7

      - name: Stop local model server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/llama-server/pid" ]; then
            kill "$(cat "$RUNNER_TEMP/llama-server/pid")" 2>/dev/null || true
          fi
