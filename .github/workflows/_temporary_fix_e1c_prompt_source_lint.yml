name: temporary-fix-e1c-prompt-source-lint

on:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_fix_e1c_prompt_source_lint.yml

permissions:
  contents: write

concurrency:
  group: temporary-fix-e1c-prompt-source-lint
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/programmatic-agentharm-pivot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply exact formatting-only replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path("scripts/run_evaluator_panel_e1c_prompt_source_freeze.py")
          script_text = script.read_text(encoding="utf-8")
          old_script = (
              '    framed = f"blob {len(payload)}\\0".encode("utf-8") + payload\n'
          )
          new_script = '    framed = f"blob {len(payload)}\\0".encode() + payload\n'
          if script_text.count(old_script) != 1:
              raise SystemExit("expected one script lint target")
          script.write_text(
              script_text.replace(old_script, new_script),
              encoding="utf-8",
          )

          test = Path("tests/test_evaluator_panel_e1c_prompt_source_freeze.py")
          test_text = test.read_text(encoding="utf-8")
          old_test = (
              'LLAMA2_CLS_PROMPT = {"prompt": "llama {behavior} {generation}", '
              '"prompt_contextual": "llama contextual"}\n'
              'MISTRAL_CLS_PROMPT = {"prompt": "mistral {behavior} {generation}", '
              '"prompt_contextual": "mistral contextual"}\n'
          )
          new_test = (
              'LLAMA2_CLS_PROMPT = {\n'
              '    "prompt": "llama {behavior} {generation}",\n'
              '    "prompt_contextual": "llama contextual",\n'
              '}\n'
              'MISTRAL_CLS_PROMPT = {\n'
              '    "prompt": "mistral {behavior} {generation}",\n'
              '    "prompt_contextual": "mistral contextual",\n'
              '}\n'
          )
          if test_text.count(old_test) != 1:
              raise SystemExit("expected one synthetic prompt lint target")
          test.write_text(
              test_text.replace(old_test, new_test),
              encoding="utf-8",
          )
          PY

      - name: Validate complete correction
        run: |
          python -m pip install 'ruff>=0.6' 'pytest>=8.2'
          ruff check \
            scripts/run_evaluator_panel_e1c_prompt_source_freeze.py \
            tests/test_evaluator_panel_e1c_prompt_source_freeze.py
          python -m pytest -q tests/test_evaluator_panel_e1c_prompt_source_freeze.py

      - name: Commit correction and remove one-shot workflow
        run: |
          git rm .github/workflows/_temporary_fix_e1c_prompt_source_lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/run_evaluator_panel_e1c_prompt_source_freeze.py \
            tests/test_evaluator_panel_e1c_prompt_source_freeze.py
          git commit -m "Fix E1C prompt-source lint without changing contract"
          git push origin HEAD:agent/programmatic-agentharm-pivot
