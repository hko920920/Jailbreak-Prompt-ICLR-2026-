name: temporary-debug-gcg-qwen-preflight

on:
  workflow_dispatch:
  push:
    branches:
      - agent/programmatic-agentharm-pivot
    paths:
      - .github/workflows/_temporary_debug_gcg_qwen_preflight.yml

permissions:
  contents: read

concurrency:
  group: temporary-debug-gcg-qwen-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/programmatic-agentharm-pivot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tokenizer-only dependencies
        run: |
          python -m pip install \
            'huggingface-hub==0.28.1' \
            'transformers==4.48.3'

      - name: Enforce no-model safety boundary
        run: |
          ! grep -R -n -E 'AutoModel|AutoModelFor|torch\.load|generate\(' \
            scripts/gcg_qwen_adapter.py \
            scripts/run_e0_gcg_qwen_preflight.py

      - name: Reproduce operational exception with harmless fixture
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from run_e0_gcg_qwen_preflight import build_result

          build_result(
              Path('.').resolve(),
              Path(
                  'configs/natural_language_localization/'
                  'e0_gcg_qwen_preflight_v1.json'
              ).resolve(),
          )
          PY
