name: repair-q8-canonical-runtime

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gate1-contract
    paths:
      - .github/workflows/repair_q8_canonical_runtime.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: repair-q8-canonical-runtime
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gate1-contract
          fetch-depth: 0

      - name: Publish run marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 3 --body \
            "Canonical Q8 runtime repair: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Apply the two operational-only Q8 repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/gate1_step3b_wildguard_q8_canonical.yml")
          text = path.read_text(encoding="utf-8")

          stale = '          test "$WILDGUARD_ACCESS_OK" = "true"\n'
          fixed = '''          python - <<'PY'\n          import json\n          import os\n          from pathlib import Path\n\n          preflight = json.loads(\n              (Path(os.environ["SAFE_OUTPUT"]) / "wildguard_preflight.json").read_text()\n          )\n          if preflight.get("access_ok") is not True:\n              raise SystemExit("official WildGuard access preflight did not pass")\n          PY\n'''
          if stale not in text:
              raise SystemExit("same-step GITHUB_ENV assertion was not found")
          text = text.replace(stale, fixed, 1)

          start = text.index("      - name: Persist or verify canonical Q8 result\n")
          end = text.index("      - name: Publish Q8 job summary\n", start)
          replacement = '''      - name: Persist canonical Q8 result and archive the operational-only attempt\n        if: always()\n        run: |\n          test -f "$SAFE_OUTPUT/wildguard_decision.json"\n          generated_report="$RUNNER_TEMP/GATE1_STEP3B5_WILDGUARD_Q8_RESULT.md"\n          destination=data/gate1/v2/wildguard_q8\n          report=docs/GATE1_STEP3B5_WILDGUARD_Q8_RESULT.md\n          operational=data/gate1/v2/wildguard_q8_operational_32357880091\n          operational_report=docs/GATE1_STEP3B5_WILDGUARD_Q8_OPERATIONAL_32357880091.md\n\n          git fetch origin agent/gate1-contract\n          git checkout -B agent/gate1-contract origin/agent/gate1-contract\n          if [ -d "$destination" ]; then\n            current_status="$(jq -r '.status' "$destination/wildguard_decision.json")"\n            if [ "$current_status" = "WILDGUARD_RUNTIME_OR_SELECTION_NOT_COMPLETED" ]; then\n              test ! -e "$operational"\n              git mv "$destination" "$operational"\n              if [ -f "$report" ]; then\n                test ! -e "$operational_report"\n                git mv "$report" "$operational_report"\n              fi\n            else\n              diff -ru "$destination" "$SAFE_OUTPUT"\n              diff -u "$report" "$generated_report"\n              exit 0\n            fi\n          fi\n\n          mkdir -p "$destination"\n          cp -a "$SAFE_OUTPUT"/. "$destination"/\n          cp "$generated_report" "$report"\n          git config user.name github-actions[bot]\n          git config user.email 41898282+github-actions[bot]@users.noreply.github.com\n          git add "$destination" "$report"\n          if [ -e "$operational" ]; then\n            git add "$operational"\n          fi\n          if [ -e "$operational_report" ]; then\n            git add "$operational_report"\n          fi\n          git diff --cached --check\n          git commit -m "Freeze canonical WildGuard Q8 decision [skip ci]"\n          git push origin HEAD:agent/gate1-contract\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate repaired workflow text
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(
              ".github/workflows/gate1_step3b_wildguard_q8_canonical.yml"
          ).read_text(encoding="utf-8")
          assert 'test "$WILDGUARD_ACCESS_OK" = "true"' not in text
          assert 'preflight.get("access_ok") is not True' in text
          assert "wildguard_q8_operational_32357880091" in text
          assert "Persist canonical Q8 result" in text
          PY
          git diff --check

      - name: Commit the operational repair
        run: |
          git rm -f \
            .github/workflows/repair_q8_canonical_runtime.yml \
            .github/workflows/repair_gate1_orchestration.yml \
            .github/workflows/repair_gate1_orchestration_v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/gate1_step3b_wildguard_q8_canonical.yml
          git diff --cached --check
          git commit -m "Repair canonical Q8 execution without changing its contract [skip ci]"
          git push origin HEAD:agent/gate1-contract
